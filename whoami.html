<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Хто я?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #14161a; --tile-bg: #22252b; --text-light: #f4f5f1; --text-muted: #8b909c; --accent: #38cfa0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none;
      -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; padding: 0; min-height: 100dvh; background: var(--bg);
      font-family: 'Inter', sans-serif; color: var(--text-light); overflow-x: hidden; touch-action: manipulation; }
  .page { max-width: 420px; margin: 0 auto; padding: 0 18px 30px; display: flex;
      flex-direction: column; align-items: center; min-height: 100dvh; }
  .hidden { display: none !important; }

  h2 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin: 0 0 14px; text-align: center; }
  .status-line { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 14px; }

  .host-panel { width: 100%; background: var(--tile-bg); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .host-panel label { display: block; font-size: 12px; color: var(--text-muted); margin: 10px 0 4px; }
  .host-panel select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
      background: #14161a; color: var(--text-light); font-size: 14px; }

  button.primary-btn { width: 100%; border: none; border-radius: 20px; padding: 12px; font-weight: 700;
      font-size: 14px; cursor: pointer; background: var(--accent); color: #0e2318; margin-top: 10px; }
  button.secondary-btn { width: 100%; border: none; border-radius: 20px; padding: 10px; font-weight: 700;
      font-size: 13px; cursor: pointer; background: #272729; color: var(--text-light);
      border: 1px solid rgba(255,255,255,0.12); margin-top: 8px; }

  .role-hint { color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 18px; max-width: 320px; }

  .reveal-trigger {
    width: min(90vw, 280px); padding: 50px 20px; border-radius: 20px;
    background: var(--tile-bg); border: 1px dashed rgba(255,255,255,0.15);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 18px;
    touch-action: none;
  }
  .reveal-trigger .icon { font-size: 36px; }

  .tally { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
  .tally b { color: var(--text-light); font-family: 'Space Grotesk', sans-serif; font-size: 18px; }
  .action-row { display: flex; gap: 10px; width: 100%; margin-bottom: 18px; }
  .action-row button { flex: 1; border: none; border-radius: 14px; padding: 12px; font-weight: 700;
      font-size: 13px; cursor: pointer; background: #272729; color: var(--text-light);
      border: 1px solid rgba(255,255,255,0.12); }
  .action-row button.guessed { background: var(--accent); color: #0e2318; }

  /* --------- повноекранне розкриття слова --------- */
  .fullscreen-reveal {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: none; align-items: center; justify-content: center; padding: 6vh 5vw;
    touch-action: none;
  }
  .fullscreen-reveal.counting, .fullscreen-reveal.revealed { display: flex; }
  .fullscreen-reveal .countdown-block, .fullscreen-reveal .reveal-content {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  .fullscreen-reveal.counting .countdown-block { display: flex; }
  .fullscreen-reveal.revealed .reveal-content { display: flex; }
  .countdown-digit {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 110px;
    animation: countdownPulse 1s ease-in-out infinite;
  }
  @keyframes countdownPulse { 0%,100%{ transform: scale(1); opacity: 1; } 50%{ transform: scale(0.9); opacity: 0.75; } }
  .countdown-hint { margin-top: 14px; font-size: 14px; color: var(--text-muted); text-align: center; max-width: 70vw; }
  .fullscreen-reveal .theme-tag {
    position: absolute; top: 6vh; left: 0; right: 0; text-align: center;
    font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.12em;
  }
  .fullscreen-reveal .fit-text {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--text-light);
    text-align: center; line-height: 1.05; max-width: 100%; word-break: break-word;
  }
</style>
</head>
<body>
<div class="page">

  <div id="view-setup" class="hidden">
    <h2>🙈 Хто я?</h2>
    <div class="status-line">Кожен грає на своєму телефоні — налаштуй і починай</div>

    <div class="host-panel">
      <label>Тема</label>
      <select id="themeSelect"></select>
      <label>Складність</label>
      <select id="difficultySelect"></select>
      <button class="primary-btn" id="startBtn">Почати гру</button>
    </div>
  </div>

  <div id="view-active" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <div class="role-hint">Відверни телефон екраном від себе — нехай інші читають слово й запитують «так/ні».</div>

    <div class="reveal-trigger" id="revealTrigger">
      <div class="icon">🙈</div>
      <div>Натисни, щоб показати своє слово</div>
    </div>

    <div class="tally">Твій бал: <b id="myScore">0</b></div>
    <div class="action-row">
      <button id="skipBtn">Не можу вгадати</button>
      <button class="guessed" id="guessedBtn">Я вгадав!</button>
    </div>

    <button class="secondary-btn" id="resetBtn">🔄 До налаштувань</button>
  </div>

</div>

<!-- повноекранний показ слова -->
<div class="fullscreen-reveal" id="fullscreenReveal">
  <div class="countdown-block">
    <div class="countdown-digit" id="fsCountdownDigit">2</div>
    <div class="countdown-hint">Відверни екран від себе…</div>
  </div>
  <div class="reveal-content">
    <div class="theme-tag" id="fsTheme">—</div>
    <div class="fit-text" id="fsWord">—</div>
  </div>
</div>

<script src="js/whoami-words.js"></script>
<script src="js/whoami-game.js"></script>
<script src="js/help.js"></script>
<script src="js/back-button.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app-settings.js"></script>
<link rel="stylesheet" href="js/game-header.css">
<script src="js/game-header.js"></script>
<script src="js/login.js"></script>
<script>
(function () {
  const VIEWS = ["setup", "active"];
  function showView(name) {
    VIEWS.forEach((v) => document.getElementById("view-" + v).classList.toggle("hidden", v !== name));
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }

  let themeSelectBuilt = false;
  let diffSelectBuilt = false;
  let lastShownWord = null;

  function buildSetup() {
    const state = window.WhoAmIGame.getState();

    if (!themeSelectBuilt) {
      const themeSelect = document.getElementById("themeSelect");
      themeSelect.innerHTML =
        `<option value="random">🎲 Випадкова</option>` +
        window.WhoAmIGame.THEME_NAMES.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
      themeSelect.value = state.settings.theme;
      themeSelectBuilt = true;
    }

    if (!diffSelectBuilt) {
      const diffSelect = document.getElementById("difficultySelect");
      diffSelect.innerHTML = window.WhoAmIGame.DIFFICULTIES
        .map((d) => `<option value="${d}">${window.WhoAmIGame.DIFF_LABELS[d]}</option>`).join("");
      diffSelect.value = state.settings.difficulty;
      diffSelectBuilt = true;
    }
  }

  function renderActive() {
    const state = window.WhoAmIGame.getState();
    document.getElementById("myScore").textContent = state.score;

    if (state.currentWord !== lastShownWord) {
      lastShownWord = state.currentWord;
      resetOverlay();
    }
  }

  document.getElementById("themeSelect").addEventListener("change", pushSettings);
  document.getElementById("difficultySelect").addEventListener("change", pushSettings);
  function pushSettings() {
    const theme = document.getElementById("themeSelect").value;
    const difficulty = document.getElementById("difficultySelect").value;
    window.WhoAmIGame.updateSettings(theme, difficulty);
  }

  document.getElementById("startBtn").addEventListener("click", () => {
    window.WhoAmIGame.startGame();
    showView("active");
    renderActive();
  });
  document.getElementById("guessedBtn").addEventListener("click", () => {
    window.WhoAmIGame.markGuessed();
    renderActive();
  });
  document.getElementById("skipBtn").addEventListener("click", () => {
    window.WhoAmIGame.skipWord();
    renderActive();
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Повернутися до вибору теми й складності? Поточний рахунок буде втрачено.")) {
      showView("setup");
    }
  });

  // ---- tap → відлік → повноекранний показ слова ----
  const trigger = document.getElementById("revealTrigger");
  const fsReveal = document.getElementById("fullscreenReveal");
  const fsCountdownDigit = document.getElementById("fsCountdownDigit");
  const fsTheme = document.getElementById("fsTheme");
  const fsWord = document.getElementById("fsWord");
  const REVEAL_DELAY_MS = 2000;
  let countdownTick = null, countdownTimeout = null, isCounting = false, isRevealed = false;

  function resetOverlay() {
    clearInterval(countdownTick); clearTimeout(countdownTimeout);
    countdownTick = null; countdownTimeout = null; isCounting = false; isRevealed = false;
    fsReveal.classList.remove("counting", "revealed");
  }

  function startCountdown() {
    const state = window.WhoAmIGame.getState();
    if (!state.currentWord || isCounting || isRevealed) return;
    isCounting = true;
    fsReveal.classList.remove("revealed");
    fsReveal.classList.add("counting");

    let secondsLeft = Math.ceil(REVEAL_DELAY_MS / 1000);
    fsCountdownDigit.textContent = secondsLeft;
    countdownTick = setInterval(() => {
      secondsLeft -= 1;
      if (secondsLeft > 0) fsCountdownDigit.textContent = secondsLeft;
    }, 1000);

    countdownTimeout = setTimeout(() => {
      clearInterval(countdownTick); countdownTick = null; countdownTimeout = null;
      isCounting = false; isRevealed = true;
      fsReveal.classList.remove("counting");
      fsReveal.classList.add("revealed");
      fsTheme.textContent = state.currentThemeName || "";
      fsWord.textContent = state.currentWord || "";
      fitWordText();
    }, REVEAL_DELAY_MS);
  }

  trigger.addEventListener("pointerdown", (e) => { e.preventDefault(); startCountdown(); });
  trigger.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
  trigger.addEventListener("contextmenu", (e) => e.preventDefault());
  fsReveal.addEventListener("pointerdown", (e) => { e.preventDefault(); resetOverlay(); });
  fsReveal.addEventListener("contextmenu", (e) => e.preventDefault());
  window.addEventListener("resize", () => { if (isRevealed) fitWordText(); });

  function fitWordText() {
    let lo = 16, hi = 260, best = 16;
    while (lo <= hi) {
      const mid = Math.floor((lo + hi) / 2);
      fsWord.style.fontSize = mid + "px";
      const fitsWidth = fsWord.scrollWidth <= fsReveal.clientWidth * 0.92;
      const fitsHeight = fsWord.scrollHeight <= fsReveal.clientHeight * 0.62;
      if (fitsWidth && fitsHeight) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    fsWord.style.fontSize = best + "px";
  }

  document.addEventListener("selectstart", (e) => e.preventDefault());

  showView("setup");
  buildSetup();
})();
</script>
</body>
</html>
