<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b626b"/><stop offset=".45" stop-color="#2c3137"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="1" y2="1">
