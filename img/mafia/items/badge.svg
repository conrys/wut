<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/><stop offset=".35" stop-color="#e2b850"/><stop offset=".7" stop-color="#b8862b"/><stop offset="1" stop-color="#8a5f17"/>
    </linearGradient>
    <linearGradient id="goldIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d277"/><stop offset="1" stop-color="#c3922f"/>
    </linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff4c8"/><stop offset=".5" stop-color="#d9aa3f"/><stop offset="1" stop-color="#8a5f17"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5f8f"/><stop offset="1" stop-color="#1f3a5f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <g filter="url(#sh)">
    <!-- шестипроменева зірка з кульками -->
    <path d="M120 12l16 31 35-2-19 29 19 29-35-2-16 31-16-31-35 2 19-29-19-29 35 2z" fill="url(#gold)" stroke="#6b4a12" stroke-width="2.4" stroke-linejoin="round"/>
    <g fill="url(#ball)" stroke="#6b4a12" stroke-width="1.8">
      <circle cx="120" cy="11" r="7"/><circle cx="172" cy="40" r="7"/><circle cx="172" cy="100" r="7"/>
      <circle cx="120" cy="129" r="7"/><circle cx="68" cy="100" r="7"/><circle cx="68" cy="40" r="7"/>
    </g>
    <!-- внутрішній диск -->
    <circle cx="120" cy="70" r="28" fill="url(#goldIn)" stroke="#6b4a12" stroke-width="2"/>
    <circle cx="120" cy="70" r="23" fill="none" stroke="#8a5f17" stroke-width="1" stroke-dasharray="2 2.5"/>
    <!-- стрічка з написом -->
    <path d="M84 62h72l-5 8 5 8H84l5-8z" fill="url(#ribbon)" stroke="#12243d" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="120" y="74.5" text-anchor="middle" font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="13" letter-spacing="2.4" fill="#f6e7b4">ШЕРИФ</text>
    <!-- блиск -->
    <path d="M99 30l13 17" stroke="#fff8d6" stroke-width="2.6" stroke-linecap="round" opacity=".7"/>
    <path d="M137 98l6 9" stroke="#fff8d6" stroke-width="2" stroke-linecap="round" opacity=".45"/>
  </g>
</svg>
