    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- поле 4×2 знизу: майже заповнений рядок і щілина під фігуру -->
  <g transform="translate(80 300)">
    <rect x="-12" y="-12" width="376" height="164" rx="26" fill="#06222b" opacity=".55"/>
    <g>
      <rect x="0" y="0" width="80" height="62" rx="14" fill="#ff5d6c"/><rect x="88" y="0" width="80" height="62" rx="14" fill="#ff5d6c"/>
      <rect x="264" y="0" width="80" height="62" rx="14" fill="#3fc3ff"/>
      <rect x="0" y="70" width="80" height="62" rx="14" fill="#b86bff"/><rect x="88" y="70" width="80" height="62" rx="14" fill="#ffb340"/>
      <rect x="176" y="70" width="80" height="62" rx="14" fill="#ffb340"/><rect x="264" y="70" width="80" height="62" rx="14" fill="#3fc3ff"/>
    </g>
    <rect x="176" y="0" width="80" height="62" rx="14" fill="none" stroke="#ffe156" stroke-width="5" stroke-dasharray="12 9" opacity=".9"/>
