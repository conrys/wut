<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="46.501 1.5 503.091 555.993" xmlns="http://www.w3.org/2000/svg" xmlns:bx="https://boxy-svg.com">
  <defs bx:workspace="root">
    <style>
      .eye-blink-l, .eye-blink-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c2-blink 4.8s ease-in-out infinite; 
        animation-delay: 0.8s;
      }
      .pupil-look-l, .pupil-look-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c2-look 6.8s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; 
      }
      .body-breathe {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: c2-breathe 4.1s ease-in-out infinite;
      }
      .mouth-anim {
        transform-box: fill-box;
        transform-origin: center;
        animation: c2-mouth 7.5s ease-in-out infinite;
        animation-delay: 0.5s;
      }
      .beard-sway {
        transform-box: fill-box;
        transform-origin: center top;
        animation: beard-sway 3.2s ease-in-out infinite;
      }
      
      /* Клипання з власною затримкою */
      @keyframes c2-blink { 
        0%, 91%, 100% { transform: scaleY(1); } 
        95% { transform: scaleY(0.08); } 
      }

      /* Саккадичний погляд: Вниз-ліворуч -&gt; Праворуч -&gt; Вгору-ліворуч */
      @keyframes c2-look { 
        0%, 20%   { transform: translate(0, 0); }
        24%, 46%  { transform: translate(-6px, 4px); }
        50%, 72%  { transform: translate(5px, 1px); }
        76%, 88%  { transform: translate(-3px, -4px); }
        92%, 100% { transform: translate(0, 0); }
      }

      /* М'яка пульсація тіла з легким нахилом */
      @keyframes c2-breathe {
        0%, 100% { transform: scale(1, 1) rotate(0deg) translateY(0); }
        50%      { transform: scale(0.98, 1.03) rotate(-0.8deg) translateY(-2px); }
      }

      /* Вирівняний рот із переходом від гіпертрофованого нахилу до спокійнішого стану */
      @keyframes c2-mouth {
        0%, 30%   { transform: rotate(12deg) scale(0.85, 0.9); }
        45%, 75%  { transform: rotate(2deg) scale(0.55, 0.35) translateY(-12px); }
        88%, 100% { transform: rotate(12deg) scale(0.85, 0.9); }
      }

      /* Гойдання бороди */
      @keyframes beard-sway {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-0.5px) rotate(0.4deg); }
      }
    </style>
  </defs>
  <g class="body-breathe" style="transform-origin: 358.712px 458.856px;" transform="matrix(0.979929, -0.014363, 0.013666, 1.029863, -0.027299, -2.057183)">
    <g id="hat" transform="matrix(1, 0, 0, 1, 8.735774, -18.610977)">
      <path style="stroke: rgb(0, 0, 0); fill: rgb(54, 79, 204);" d="M 439.91 209.755 L 334.373 166.574 L 489.072 40.961 L 439.91 209.755 Z"/>
      <path d="M 429.448 123.371 L 432.35 129.793 L 441.188 129.932 L 434.144 134.04 L 436.704 140.548 L 429.448 136.664 L 422.192 140.548 L 424.752 134.04 L 417.708 129.932 L 426.546 129.793 Z" bx:shape="star 429.448 132.866 12.344 9.495 0.4 5 1@511ba9a5" style="fill: rgb(216, 216, 216); stroke: rgb(0, 0, 0);"/>
      <path d="M 460.9 77.995 L 463.266 83.004 L 470.472 83.112 L 464.729 86.316 L 466.816 91.393 L 460.9 88.363 L 454.984 91.393 L 457.071 86.316 L 451.328 83.112 L 458.534 83.004 Z" bx:shape="star 460.9 85.401 10.065 7.406 0.4 5 1@8dda858e" style="fill: rgb(216, 216, 216); stroke: rgb(0, 0, 0);"/>
      <path d="M 401.713 128.995 L 406.349 133.309 L 415.759 134.244 L 409.214 137.844 L 410.394 142.736 L 401.713 140.647 L 393.032 142.736 L 394.212 137.844 L 387.667 134.244 L 397.077 133.309 Z" bx:shape="star 401.713 136.591 14.769 7.596 0.534 5 1@b6df5275" style="fill: rgb(216, 216, 216); stroke: rgb(0, 0, 0);"/>
    </g>
    <g id="character_core" transform="matrix(1, 0, 0, 1, -50.440961, -2.094176)">
      <path id="body" fill="#7f00ff" stroke="#000000" stroke-width="10" d="M 178.676 213.13 C 178.676 213.13 162.6 221.022 206.479 430.586 C 186.149 444.525 475.733 471.433 494.133 427.934 C 512.533 384.435 553.984 252.497 539.98 226.055 C 520.41 158.397 355.617 117.217 354.779 118.909 C 354.779 118.909 228.396 122.691 178.676 213.13 Z"/>
      <g id="eyes_wrapper" transform="matrix(1, 0, 0, 1, 4.853057, 38.638169)">
        <g class="eye-blink-r">
          <ellipse fill="#ffffff" cx="405.692" cy="189.867" rx="46.422" ry="48.097"/>
          <g class="pupil-look-r">
            <ellipse class="pupil" fill="#000000" cx="413.793" cy="185.886" rx="22.185" ry="22.56"/>
          </g>
        </g>
        <g class="eye-blink-l">
          <ellipse fill="#ffffff" cx="296.475" cy="190.1" rx="43.695" ry="44.88"/>
          <g class="pupil-look-l" style="transform-origin: 296.214px 179.835px;" transform="matrix(1, 0, 0, 1, -3, -4)">
            <ellipse class="pupil" fill="#7efc00" stroke="#000000" stroke-width="10" cx="295.097" cy="185.309" rx="20.147" ry="16.023"/>
          </g>
        </g>
      </g>
      <g id="mouth_group" class="mouth-anim" transform="matrix(0.831425, 0.176725, -0.187121, 0.880333, 0, 0)">
        <path title="рот" style="fill: rgb(127, 0, 255); stroke: rgb(0, 0, 0); stroke-width: 10px; transform-box: fill-box; transform-origin: 50% 50%;" d="M 260.13 324.799 C 300.344 312.666 399.94 313.693 433.977 327.592"/>
      </g>
    </g>
  </g>
</svg>