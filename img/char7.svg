<?xml version="1.0"?>
<svg width="600" height="480" viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
 <!-- Створено для Смішліста, у стилістиці оригінальних char1-4.svg, форма тіла унікальна -->
 <g class="layer">
  <title>Layer 1</title>
  <style>
   .eye-blink-r { transform-box: fill-box; transform-origin: center; animation: c7-blink 4.4s ease-in-out infinite; animation-delay: 0.6s; }
   .pupil-look-r { transform-box: fill-box; transform-origin: center; animation: c7-look 6.2s ease-in-out infinite; animation-delay: 1.1s; }
   @keyframes c7-blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
   @keyframes c7-look { 0%, 100% { transform: translate(0,0); } 22% { transform: translate(-3px,1px); } 50% { transform: translate(0,0); } 74% { transform: translate(3px,-1px); } 90% { transform: translate(0,0); } }
  </style>
  <path fill="#3498db" stroke="#000000" stroke-width="10" d="M 573.0,260.0 Q 573.0,260.0 514.5,312.0 Q 455.9,363.9 378.0,401.6 Q 300.0,439.2 224.3,400.1 Q 148.5,361.0 85.7,310.5 Q 22.8,260.0 84.2,208.5 Q 145.6,157.0 222.8,120.3 Q 300.0,83.6 376.5,120.8 Q 452.9,158.0 513.0,209.0 Z"/>

  <path d="M220,235 Q255,217 290,235" fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
  <g class="eye-blink-r">
   <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="355" cy="233" rx="32" ry="28"/>
   <g class="pupil-look-r"><ellipse fill="#000000" cx="362" cy="237" rx="11" ry="13"/></g>
  </g>
  <path d="M265,290 Q300,307 335,290" fill="none" stroke="#0d3d5c" stroke-width="10" stroke-linecap="round"/>
 </g>
</svg>