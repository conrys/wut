<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg">
  <g class="layer">
    <style>
      /* Анімація тіла (м'яке желеподібне стиснення) */
      .slime-body {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: c7-squish 3.6s ease-in-out infinite;
      }

      /* Праве око (кліпання та озирання) */
      .eye-blink-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c7-blink 4.4s ease-in-out infinite; 
        animation-delay: 0.6s; 
      }
      .pupil-look-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c7-look 6.2s ease-in-out infinite; 
        animation-delay: 1.1s; 
      }

      /* Ліве прижмурене око (підморгування) */
      .wink-eye {
        transform-box: fill-box;
        transform-origin: center;
        animation: c7-wink 3.6s ease-in-out infinite;
      }

      /* Рот (грайлива посмішка) */
      .mouth-anim {
        transform-box: fill-box;
        transform-origin: center;
        animation: c7-mouth 3.6s ease-in-out infinite;
      }

      /* РОДЗИНКА: Золота корона з погойдуванням */
      .crown-group {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: c7-crown 3.6s ease-in-out infinite;
      }

      /* Внутрішні бульбашки слайма */
      .bubble-1 { animation: c7-float-1 4s ease-in-out infinite; }
      .bubble-2 { animation: c7-float-2 5s ease-in-out infinite 1s; }
      .bubble-3 { animation: c7-float-3 3.5s ease-in-out infinite 0.5s; }

      @keyframes c7-squish {
        0%, 100% { transform: scale(1, 1) translateY(0); }
        50% { transform: scale(1.05, 0.93) translateY(8px); }
      }

      @keyframes c7-blink { 
        0%, 92%, 100% { transform: scaleY(1); } 
        96% { transform: scaleY(0.08); } 
      }

      @keyframes c7-look { 
        0%, 100% { transform: translate(0,0); } 
        22% { transform: translate(-4px,2px); } 
        50% { transform: translate(0,0); } 
        74% { transform: translate(4px,-2px); } 
        90% { transform: translate(0,0); } 
      }

      @keyframes c7-wink {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1, 0.85); }
      }

      @keyframes c7-mouth {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.12, 0.9); }
      }

      @keyframes c7-crown {
        0%, 100% { transform: rotate(0deg) translateY(0); }
        50% { transform: rotate(-8deg) translateY(5px); }
      }

      @keyframes c7-float-1 {
        0%, 100% { transform: translate(0, 0); opacity: 0.4; }
        50% { transform: translate(-6px, -15px); opacity: 0.8; }
      }

      @keyframes c7-float-2 {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        50% { transform: translate(8px, -20px); opacity: 0.7; }
      }

      @keyframes c7-float-3 {
        0%, 100% { transform: translate(0, 0); opacity: 0.5; }
        50% { transform: translate(-4px, -10px); opacity: 0.9; }
      }
    </style>

    <!-- Основна група персонажа -->
    <g class="slime-body">
      <!-- Тіло (Скелет) -->
      <path fill="#3498db" stroke="#000000" stroke-width="10" d="M 573.0,260.0 Q 573.0,260.0 514.5,312.0 Q 455.9,363.9 378.0,401.6 Q 300.0,439.2 224.3,400.1 Q 148.5,361.0 85.7,310.5 Q 22.8,260.0 84.2,208.5 Q 145.6,157.0 222.8,120.3 Q 300.0,83.6 376.5,120.8 Q 452.9,158.0 513.0,209.0 Z" id="body"/>

      <!-- Відблиск світла на тілі (для об'єму слайма) -->
      <path fill="#ffffff" opacity="0.3" d="M 210,145 Q 280,105 350,135 Q 270,120 190,165 Z"/>

      <!-- Внутрішні бульбашки -->
      <g class="bubbles">
        <circle class="bubble-1" cx="200" cy="310" r="12" fill="#ffffff" opacity="0.4"/>
        <circle class="bubble-2" cx="430" cy="290" r="16" fill="#ffffff" opacity="0.3"/>
        <circle class="bubble-3" cx="300" cy="360" r="9" fill="#ffffff" opacity="0.5"/>
      </g>

      <!-- Очі -->
      <g class="eyes-group">
        <!-- Ліве прижмурене око -->
        <g class="wink-eye">
          <path d="M220,235 Q255,217 290,235" fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
        </g>

        <!-- Праве відкрите око -->
        <g class="eye-blink-r">
          <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="355" cy="233" rx="32" ry="28"/>
          <g class="pupil-look-r">
            <ellipse class="pupil" fill="#000000" cx="362" cy="237" rx="11" ry="13"/>
            <!-- Маленький відблиск у зіниці -->
            <circle cx="366" cy="233" r="4" fill="#ffffff"/>
          </g>
        </g>
      </g>

      <!-- Рот -->
      <g class="mouth-group mouth-anim">
        <path d="M265,290 Q300,307 335,290" fill="none" stroke="#0d3d5c" stroke-width="10" stroke-linecap="round"/>
      </g>

      <!-- РОДЗИНКА: Золота корона короля слаймів -->
      <g class="crown-group">
        <path fill="#f1c40f" stroke="#000000" stroke-width="6" stroke-linejoin="round" d="M 285,100 L 355,85 L 365,55 L 340,70 L 320,42 L 302,68 L 278,52 Z"/>
        <!-- Рубіни на короні -->
        <circle cx="278" cy="52" r="4" fill="#e74c3c"/>
        <circle cx="320" cy="42" r="5" fill="#e74c3c"/>
        <circle cx="365" cy="55" r="4" fill="#e74c3c"/>
      </g>
    </g>
  </g>
</svg>
