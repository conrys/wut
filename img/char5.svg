   <g class="pupil-look-r"><ellipse fill="#000000" cx="362" cy="239" rx="12" ry="14"/></g>
  </g>
  <path d="M235,305 Q300,355 365,305" fill="none" stroke="#7a1d00" stroke-width="12" stroke-linecap="round"/>
 </g>
