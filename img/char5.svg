<?xml version="1.0"?>
<svg width="600" height="480" viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
 <!-- Створено для Смішліста, у стилістиці оригінальних char1-4.svg, форма тіла унікальна -->
 <g class="layer">
  <title>Layer 1</title>
  <style>
   .eye-blink-l, .eye-blink-r { transform-box: fill-box; transform-origin: center; animation: c5-blink 3.5s ease-in-out infinite; animation-delay: 0.2s; }
   .pupil-look-l, .pupil-look-r { transform-box: fill-box; transform-origin: center; animation: c5-look 5.4s ease-in-out infinite; animation-delay: 0.9s; }
   @keyframes c5-blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
   @keyframes c5-look { 0%, 100% { transform: translate(0,0); } 26% { transform: translate(-3px,1px); } 50% { transform: translate(0,0); } 76% { transform: translate(3px,-1px); } 90% { transform: translate(0,0); } }
  </style>
  <path fill="#ff6b35" stroke="#000000" stroke-width="10" d="M 493.8,260.0 Q 493.8,260.0 478.3,297.1 Q 462.9,334.2 429.9,363.4 Q 396.9,392.5 348.5,400.5 Q 300.0,408.5 251.6,400.5 Q 203.1,392.5 170.1,363.4 Q 137.1,334.2 121.7,297.1 Q 106.2,260.0 121.7,222.9 Q 137.1,185.8 170.1,156.6 Q 203.1,127.5 251.5,119.5 Q 300.0,111.5 348.4,119.5 Q 396.9,127.5 429.9,156.6 Q 462.9,185.7 478.3,222.9 Z"/>

  <g class="eye-blink-l">
   <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="255" cy="235" rx="34" ry="30"/>
