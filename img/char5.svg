<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg">
  <g class="layer">
    <style>
      .eye-blink-l, .eye-blink-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c5-blink 4.8s ease-in-out infinite; 
        animation-delay: 0.5s; 
      }
      .pupil-look-l, .pupil-look-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c5-look 7.0s ease-in-out infinite; 
        animation-delay: 0.8s; 
      }
      .body-breathe {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: c5-breathe 4.2s ease-in-out infinite;
      }
      .mouth-anim {
        transform-box: fill-box;
        transform-origin: center;
        animation: c5-mouth 7.0s ease-in-out infinite;
      }

      @keyframes c5-blink { 
        0%, 93%, 100% { transform: scaleY(1); } 
        96% { transform: scaleY(0.08); } 
      }

      @keyframes c5-look { 
        0%, 100% { transform: translate(0,0); } 
        28% { transform: translate(-3px, 0); } 
        55% { transform: translate(0,0); } 
        80% { transform: translate(3px, 0); } 
      }

      @keyframes c5-breathe {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.01, 0.98) translateY(2px); }
      }

      @keyframes c5-mouth {
        0%, 100% { transform: scale(1, 1) translateY(0); }
        50% { transform: scale(1.02, 0.97) translateY(1px); }
      }
    </style>

    <!-- Тіло Сімона (Бірюзовий колір) -->
    <path class="body-breathe" fill="#00a896" stroke="#000000" stroke-width="10" d="M 460,260 C 465,360 405,405 300,405 C 195,405 135,360 140,260 C 145,145 210,95 300,95 C 390,95 455,145 460,260 Z" id="body"/>

    <!-- Очі -->
    <g class="eyes-group">
      <!-- Ліве око -->
      <g class="eye-blink-l">
        <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="245" cy="210" rx="36" ry="28"/>
        <g class="pupil-look-l">
          <ellipse class="pupil" fill="#000000" cx="248" cy="212" rx="9" ry="9"/>
        </g>
        <!-- Повіко: повністю накриває верх ока кольором тіла -->
        <path fill="#00a896" d="M 200,170 H 290 V 202 Q 245,215 200,202 Z"/>
        <path fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" d="M 208,202 Q 245,215 282,202"/>
      </g>

      <!-- Праве око -->
      <g class="eye-blink-r">
        <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="355" cy="210" rx="35" ry="27"/>
        <g class="pupil-look-r">
          <ellipse class="pupil" fill="#000000" cx="358" cy="212" rx="9" ry="9"/>
        </g>
        <!-- Повіко: повністю накриває верх ока кольором тіла -->
        <path fill="#00a896" d="M 310,170 H 400 V 202 Q 355,215 310,202 Z"/>
        <path fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" d="M 319,202 Q 355,215 391,202"/>
      </g>
    </g>

    <!-- Серйозні солідні вуса та стриманий закритий рот -->
    <g class="mouth-group mouth-anim">
      <path fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" d="M 265,315 Q 300,310 335,315"/>
      <path fill="#45332b" stroke="#000000" stroke-width="3" stroke-linejoin="round" d="M 295 300 L 250 310 M 305 300 L 350 310"/>
    </g>
  </g>
</svg>
