      </g>
      <g class="eyes-group" transform="matrix(1.225474, 0, 0, 1.569372, -13.809916, -57.159055)" style="">
        <g class="eye-blink-l" style="">
          <ellipse fill="#ffffff" cx="309.189" cy="169.403" rx="59.727" ry="41.673"/>
          <g class="pupil-look-l">
            <ellipse class="pupil" fill="#000000" cx="305.279" cy="168.871" rx="17.342" ry="9.47"/>
