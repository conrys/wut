<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <g class="layer" transform="matrix(1, 0, 0, 1, 5.771553, 0)">
    <style>
      .eye-blink-l, .eye-blink-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c1-blink 4.2s ease-in-out infinite; 
      }
      .pupil-look-l, .pupil-look-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c1-look 7.2s cubic-bezier(0.25, 1, 0.5, 1) infinite; 
        animation-delay: 0.3s; 
      }
      .body-breathe {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: c1-breathe 3.6s ease-in-out infinite;
      }
      .mouth-anim {
        transform-box: fill-box;
        transform-origin: center;
        animation: c1-mouth 6.5s ease-in-out infinite;
      }
      
      /* Клипання */
      @keyframes c1-blink { 
        0%, 92%, 100% { transform: scaleY(1); } 
        96% { transform: scaleY(0.08); } 
      }

      /* Саккадичне озирання */
      @keyframes c1-look { 
        0%, 18%   { transform: translate(0, 0); }
        22%, 42%  { transform: translate(6px, -2px); }
        45%, 65%  { transform: translate(-5px, 3px); }
        68%, 85%  { transform: translate(-6px, -1px); }
        89%, 100% { transform: translate(0, 0); }
      }

      /* М'яке дихання тіла */
      @keyframes c1-breathe {
        0%, 100% { transform: scale(1, 1); }
        50%      { transform: scale(1.025, 0.97) translateY(3px); }
      }

      /* Періодичне заспокоєння рота */
      @keyframes c1-mouth {
        0%, 35%   { transform: scale(1, 1); }                  /* Дика гіпертрофована посмішка */
        48%, 70%  { transform: scale(0.6, 0.3) translateY(-10px); }/* Перехід у напівзакритий/спокійний стан */
        82%, 100% { transform: scale(1, 1); }                  /* Повернення широкої емоції */
      }
    </style>
    <g id="character" transform="translate(-30, 0)">
