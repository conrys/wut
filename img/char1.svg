<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <g class="layer">
    <style>
      .eye-blink-l, .eye-blink-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c1-blink 4.2s ease-in-out infinite; 
      }
      .pupil-look-l, .pupil-look-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c1-look 7.2s cubic-bezier(0.25, 1, 0.5, 1) infinite; 
        animation-delay: 0.3s; 
      }
      .body-breathe {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: c1-breathe 3.6s ease-in-out infinite;
      }
      .mouth-anim {
        transform-box: fill-box;
        transform-origin: center;
        animation: c1-mouth 6.5s ease-in-out infinite;
      }
      
      /* Клипання */
      @keyframes c1-blink { 
        0%, 92%, 100% { transform: scaleY(1); } 
        96% { transform: scaleY(0.08); } 
      }

      /* Саккадичне озирання */
      @keyframes c1-look { 
        0%, 18%   { transform: translate(0, 0); }
        22%, 42%  { transform: translate(6px, -2px); }
        45%, 65%  { transform: translate(-5px, 3px); }
        68%, 85%  { transform: translate(-6px, -1px); }
        89%, 100% { transform: translate(0, 0); }
      }

      /* М'яке дихання тіла */
      @keyframes c1-breathe {
        0%, 100% { transform: scale(1, 1); }
        50%      { transform: scale(1.025, 0.97) translateY(3px); }
      }

      /* Періодичне заспокоєння рота */
      @keyframes c1-mouth {
        0%, 35%   { transform: scale(1, 1); }                  /* Дика гіпертрофована посмішка */
        48%, 70%  { transform: scale(0.6, 0.3) translateY(-10px); }/* Перехід у напівзакритий/спокійний стан */
        82%, 100% { transform: scale(1, 1); }                  /* Повернення широкої емоції */
      }
    </style>
    
    <!-- Персонаж відцентрований -->
    <g id="character" transform="translate(-30, 0)">
      <!-- Тіло з анімацією дихання -->
      <path class="body-breathe" fill="#7efc00" stroke="#000000" stroke-width="10" d="m235.12,68.74l-94.12,311.26l203,34l208,-29l-60,-324l-25,-12c-10,12 -18,22 -35,18c-12,-18 -10,-45 -28,-50l-22,35l-35,-12l-22,28l-38,-25l-20,22z" id="body"/>
      
      <!-- Очі -->
      <g class="eyes-group">
        <g class="eye-blink-r">
          <ellipse fill="#ffffff" cx="394.27" cy="168.77" rx="35" ry="27"/>
          <g class="pupil-look-r">
            <ellipse class="pupil" fill="#000000" cx="399.78" cy="171.34" rx="11.57" ry="9.47"/>
          </g>
        </g>
        <g class="eye-blink-l">
          <ellipse fill="#ffffff" cx="288.78" cy="170.22" rx="36" ry="25"/>
          <g class="pupil-look-l">
            <ellipse class="pupil" fill="#000000" cx="294.29" cy="172.14" rx="11.57" ry="9.47"/>
          </g>
        </g>
      </g>

      <!-- Рот із динамічною зміною стану -->
      <g class="mouth-group mouth-anim">
        <path fill="#3f7f00" stroke="#000000" stroke-width="3" d="m454.56,257.46c96.12,-47.1 52.83,101.85 -50.29,113.3c-103.12,11.46 -205.6,-124.76 -135.66,-107.24c69.95,17.52 89.83,41.04 185.94,-6.06z"/>
        <path fill="#7efc00" stroke="#000000" stroke-width="5" d="m487.56,238.37c-5.4,15.22 32.26,30.8 34.4,30.26"/>
        <path fill="#366804" d="m479.56,329.61c2.26,-29.34 28.47,-7.95 1.13,-29.29c-27.34,-21.34 -37.6,14.82 -38.81,10.62c-2.42,-8.4 -11.38,-46.67 -39.27,16.58l-3.54,40.82l41.49,-10.98l39,-27.76z"/>
        <path fill="#ffffff" d="m502.27,292.16c0,0 -7.51,21.92 -19.48,32.67c-11.97,10.75 -17.65,29.83 -70.41,42.61c-52.76,12.78 -123.19,-33.58 -120.33,-38.15c2.86,-4.57 4.38,-17.56 6.42,-16.94c2.04,0.62 44.79,10.73 43.45,12.65c-1.34,1.92 -9.09,24.38 -7.1,24.83c1.99,0.45 8.47,-25.63 9.73,-25.27c1.26,0.36 30.63,2.32 31.69,3.23c1.06,0.9 -3.22,26.06 -2.01,27.28c1.22,1.22 2.2,-28.37 4.07,-27.5c1.87,0.87 30.17,0.36 30.47,-0.52c0.29,-0.88 -2.06,31.06 -0.28,30.91c1.79,-0.16 0.73,-30.2 2.15,-30.44c1.43,-0.25 35.9,-3.79 36.15,-6c0.25,-2.21 1.71,26.86 3.74,27.27c2.03,0.41 -3.01,-27.05 -1.49,-27.05c1.52,0 27.83,-10.45 27.06,-11.19c-0.77,-0.74 1.21,14.3 1.78,14.14c0.57,-0.16 0.55,-13.18 -0.81,-13.63c-1.36,-0.45 18.38,-14.7 19.51,-14.85c1.13,-0.16 0.2,2 0.98,3.12c0.78,1.13 -0.25,-1.41 0.73,-3.33c0.99,-1.92 3.97,-3.82 3.97,-3.82z"/>
      </g>
    </g>
  </g>
</svg>
