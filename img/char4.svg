<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <g class="layer">
    <style>
      .eye-blink-l, .eye-blink-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c4-blink 4.6s ease-in-out infinite; 
        animation-delay: 0.5s; 
      }
      .pupil-look-l, .pupil-look-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c4-look 6.4s cubic-bezier(0.25, 1, 0.5, 1) infinite; 
        animation-delay: 0.2s; 
      }
      .body-breathe {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: c4-breathe 3.9s ease-in-out infinite;
      }
      .mouth-anim {
        transform-box: fill-box;
        transform-origin: center;
        animation: c4-mouth 7.2s ease-in-out infinite;
        animation-delay: 0.3s;
      }
      
      @keyframes c4-blink { 
        0%, 91%, 100% { transform: scaleY(1); } 
        95% { transform: scaleY(0.08); } 
      }

      @keyframes c4-look { 
        0%, 22%   { transform: translate(0, 0); }
        26%, 45%  { transform: translate(5px, 3px); }
        50%, 70%  { transform: translate(-6px, -4px); }
        74%, 88%  { transform: translate(1px, 4px); }
        92%, 100% { transform: translate(0, 0); }
      }

      @keyframes c4-breathe {
        0%, 100% { transform: scale(1, 1) rotate(0deg); }
        48%      { transform: scale(1.02, 0.97) translateY(3px) rotate(0.6deg); }
      }

      @keyframes c4-mouth {
        0%, 32%   { transform: scale(1, 1); }
        48%, 72%  { transform: scale(0.62, 0.32) translateY(-14px); }
        86%, 100% { transform: scale(1, 1); }
      }
    </style>

    <g id="character">
      <!-- Згладжене тіло -->
      <path class="body-breathe" fill="#ffaa56" stroke="#000000" stroke-width="10" d="m244.54,56.15c-50,30 -108.6,45 -108.6,93.59c0,70 -5,150 0,220.02c60,35 90,52 142.72,62.44c80,-25 160,-50 215.06,-101.78c10,-70 -5,-155 -18.82,-229.24c-45,-25 -90,-42 -134.79,-57.48c-35,-3 -60,2 -95.57,12.46z" id="body"/>

      <!-- Очі -->
      <g class="eyes-group">
        <g class="eye-blink-r" transform="translate(13.08, -0.44)">
          <ellipse fill="#ffffff" cx="394.27" cy="168.77" rx="35" ry="27"/>
          <g class="pupil-look-r">
            <ellipse class="pupil" fill="#000000" cx="399.78" cy="171.34" rx="11.57" ry="9.47"/>
          </g>
        </g>
        <g class="eye-blink-l" transform="translate(8.29, 2.43)">
          <ellipse fill="#ffffff" cx="288.78" cy="170.22" rx="36" ry="25"/>
          <g class="pupil-look-l">
            <ellipse class="pupil" fill="#7efc00" stroke="#000000" stroke-width="10" cx="294.29" cy="172.14" rx="6.71" ry="3.93"/>
          </g>
        </g>
      </g>

      <!-- Рот з доданим верхнім рядом зубів -->
      <g class="mouth-group">
        <g class="mouth-anim">
          <path fill="#ba7a3f" stroke="#000000" stroke-width="3" d="m243.56,261.27c35,4 95.46,8.61 95.46,8.61c40,-5 113.46,-13.3 113.14,-13.91c-2,15 -9.07,50.69 -9.39,50.08c-30,20 -136.61,76.51 -136.61,76.51c-25,-20 -74.33,-70.42 -74.66,-71.03c-2,-15 12.06,-50.25 12.06,-50.25z"/>
          
          <!-- Верхній ряд зубів -->
          <path fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" d="M 252,262 C 285,266 339,269 339,269 C 380,264 440,257 440,257 L 428,272 L 418,260 L 405,277 L 392,263 L 378,281 L 362,267 L 347,284 L 332,270 L 317,284 L 302,268 L 288,279 L 275,265 L 263,274 Z"/>

          <path fill="#5e3f23" d="m306.73,381.25l-29.92,-28.68c0,0 7.27,-20.11 16.53,-19.7c9.26,0.41 13.59,24.09 13.53,24.03c-0.06,-0.06 8.09,-26.08 18.32,-25.12c10.23,0.97 14.89,27.65 14.82,29.65c-0.06,2 -33.29,19.83 -33.29,19.83z"/>
          <path fill="#ffffff" d="m306.32,380.82c0,0 -40.77,-37.68 -40.77,-37.68c0,0 40.77,37.68 40.77,37.68z"/>
          <path fill="#ffffff" d="m306.53,382.26c0,0 -28.82,-26.77 -28.89,-26.81c-0.06,-0.04 0.06,-9.84 0.06,-9.84c0,0 14.41,1.65 14.35,1.61c-0.06,-0.04 0.06,12.81 0.06,12.81c0,0 2.06,-13.18 2,-13.22c-0.06,-0.04 12.83,0.86 12.77,0.82c-0.06,-0.04 0.06,14.45 0,14.41c-0.06,-0.04 2.33,-15.2 2.26,-15.24c-0.06,-0.04 11.59,-0.17 11.53,-0.21c-0.06,-0.04 0.68,15.07 0.62,15.03c-0.06,-0.04 1.71,-15.61 1.65,-15.65c-0.06,-0.04 16.12,-0.58 16.06,-0.62c-0.06,-0.04 0.06,13.83 0,13.79c-0.06,-0.04 3.15,-14.17 3.09,-14.21c-0.06,-0.04 17.97,0.04 17.91,0c-0.06,-0.04 -0.97,7.25 -1.03,7.21c-0.06,-0.04 -52.44,30.1 -52.44,30.1z"/>
        </g>
      </g>
    </g>
  </g>
</svg>
