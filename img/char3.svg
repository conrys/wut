<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Маска рота, щоб ікла та язик ніколи не виходили за контур -->
    <clipPath id="mouth-clip">
      <path d="M 240 260 C 290 280, 350 280, 400 250 C 385 330, 255 330, 240 260 Z"/>
    </clipPath>
  </defs>

  <style>
    .devil-body-group {
      transform-box: fill-box;
      transform-origin: 50% 90%;
      animation: c3-breathe 4s ease-in-out infinite;
    }
    .tail-anim {
      transform-box: fill-box;
      transform-origin: left center;
      animation: c3-tail 2.8s ease-in-out infinite;
    }
    .eye-blink-r, .eye-blink-l {
      transform-box: fill-box;
      transform-origin: center;
      animation: c3-blink 4.8s ease-in-out infinite;
    }
    .pupil-look {
      transform-box: fill-box;
      transform-origin: center;
      /* Зменшено загальний час та змінено анімацію на швидші рухи */
      animation: c3-look 5s ease-in-out infinite;
    }

    /* Анімації */
    @keyframes c3-breathe {
      0%, 100% { transform: scale(1, 1) rotate(0deg); }
      50% { transform: scale(1.02, 0.97) rotate(1deg) translateY(3px); }
    }
    @keyframes c3-tail {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes c3-blink {
      0%, 93%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }
    @keyframes c3-look {
      /* Швидкі та різкі рухи */
      0%, 5% { transform: translate(0, 0); } /* Початкова пауза */
      10% { transform: translate(5px, -3px); } /* Швидкий перескок 1 */
      12%, 15% { transform: translate(5px, -3px); } /* Коротка пауза 1 */
      20% { transform: translate(-4px, 2px); } /* Швидкий перескок 2 */
      22%, 25% { transform: translate(-4px, 2px); } /* Коротка пауза 2 */
      30%, 100% { transform: translate(0, 0); } /* Швидке повернення та довга пауза для циклу */
    }
  </style>

  <g id="character">
    <g class="devil-body-group">
      
      <!-- Хвіст -->
      <g class="tail-anim">
        <path d="M 420 340 C 477.329 355.03 504.401 319.883 510 290 C 512.605 276.1 524.539 294.702 515 310 C 496.954 338.942 500.258 353.198 410 365" fill="#d32f2f" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
        <!-- Накінечник хвоста (стрілка) -->
        <polygon points="499.341 287.62 528.586 257.104 526.551 304.356" fill="#d32f2f" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
      </g>

      <!-- Роги -->
      <g id="horns">
        <!-- Лівий ріг -->
        <path d="M 251.921 149.23 C 251.921 149.23 227.379 101.099 243.33 70.689 C 214.813 87.61 208.013 140.852 233.013 163.852 L 251.921 149.23 Z" fill="#d32f2f" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
        <!-- Правий ріг -->
        <path d="M 402.18 158.059 C 402.18 158.059 425.041 109.107 408.046 79.268 C 437.132 95.191 445.772 148.166 421.582 172.018 L 402.18 158.059 Z" fill="#d32f2f" stroke="#000000" stroke-width="8" stroke-linejoin="round" style="transform-origin: 412.518px 119.094px;"/>
      </g>

      <!-- Тіло (Оновлена форма) -->
      <path id="body" d="M 320 120 C 450 120 457.059 208.484 460 320 C 462.431 412.163 185.869 412.05 187.545 319.87 C 189.959 187.122 190 120 320 120 Z" fill="#e53935" stroke="#000000" stroke-width="9" stroke-linejoin="round"/>

      <!-- Очі (smug face та прижмур) -->
      <g class="eyes-group">
        <!-- Праве око (хитро підняте) -->
        <g class="eye-blink-r">
          <ellipse cx="375" cy="200" rx="32" ry="24" fill="#ffffff" stroke="#000000" stroke-width="6"/>
          <g class="pupil-look">
            <!-- Зміїна/демонічна різка зелена зіниця з світінням -->
            <polygon points="375,185 381,200 375,215 369,200" fill="#7efc00"/>
            <circle cx="377" cy="195" r="3" fill="#ffffff"/>
          </g>
          <!-- Хитрувата брова -->
          <path d="M 340 170 Q 375 155 410 175" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
        </g>

        <!-- Ліве око (трохи примружене) -->
        <g class="eye-blink-l">
          <ellipse cx="265" cy="205" rx="30" ry="18" fill="#ffffff" stroke="#000000" stroke-width="6"/>
          <g class="pupil-look">
            <!-- Зміїна/демонічна різка зелена зіниця з світінням -->
            <polygon points="265,193 270,205 265,217 260,205" fill="#7efc00"/>
            <circle cx="267" cy="201" r="2.5" fill="#ffffff"/>
          </g>
          <!-- Нахилена брова -->
          <path d="M 235 185 Q 265 180 295 190" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Рот з іклами -->
      <g id="mouth">
        <!-- Внутрішнє наполнення рота під маскою -->
        <g clip-path="url(#mouth-clip)">
          <!-- Темна порожнина -->
          <rect x="200" y="240" width="240" height="100" fill="#4a0000"/>
          
          <!-- Язик -->
          <path d="M 280 300 Q 320 270 360 300 Q 320 330 280 300 Z" fill="#b71c1c"/>
          
          <!-- Верхні ікла -->
          <polygon points="265,263 273,280 282,266" fill="#ffffff" stroke="#000000" stroke-width="2"/>
          <polygon points="295,268 305,288 315,270" fill="#ffffff" stroke="#000000" stroke-width="2"/>
          <polygon points="330,270 340,288 350,268" fill="#ffffff" stroke="#000000" stroke-width="2"/>
          <polygon points="365,264 373,280 380,260" fill="#ffffff" stroke="#000000" stroke-width="2"/>

          <!-- Нижні ікла -->
          <polygon points="280,315 290,295 300,315" fill="#ffffff" stroke="#000000" stroke-width="2"/>
          <polygon points="335,315 345,295 355,315" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        </g>

        <!-- Зовнішній чорний контур губ -->
        <path d="M 240 260 C 290 280, 350 280, 400 250 C 385 330, 255 330, 240 260 Z" fill="none" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
      </g>

    </g>
  </g>
</svg>
