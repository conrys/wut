<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <g class="layer">
    <style>
      .eye-blink-l, .eye-blink-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c3-blink 5.2s ease-in-out infinite; 
        animation-delay: 0.2s; 
      }
      .pupil-look-l, .pupil-look-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c3-look 8.1s cubic-bezier(0.25, 1, 0.5, 1) infinite; 
      }
      .body-breathe {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: c3-breathe 4.5s ease-in-out infinite;
      }
      .mouth-anim {
        transform-box: fill-box;
        transform-origin: center;
        animation: c3-mouth 7.0s ease-in-out infinite;
        animation-delay: 0.8s;
      }
      
      /* Клипання */
      @keyframes c3-blink { 
        0%, 93%, 100% { transform: scaleY(1); } 
        96% { transform: scaleY(0.08); } 
      }

      /* Погляд: Вгору-праворуч -> Вниз-ліворуч -> Вгору */
      @keyframes c3-look { 
        0%, 15%   { transform: translate(0, 0); }
        20%, 40%  { transform: translate(6px, -5px); }
        45%, 68%  { transform: translate(-7px, 3px); }
        72%, 85%  { transform: translate(0, -6px); }
        90%, 100% { transform: translate(0, 0); }
      }

      /* Глибоке дихання з похидуванням */
      @keyframes c3-breathe {
        0%, 100% { transform: scale(1, 1) rotate(0deg); }
        40%      { transform: scale(1.03, 0.96) rotate(1deg) translateY(4px); }
        70%      { transform: scale(0.98, 1.02) rotate(-0.5deg) translateY(-2px); }
      }

      /* Перехід оскалу в спокійніший стан */
      @keyframes c3-mouth {
        0%, 30%   { transform: scale(1, 1) rotate(0deg); }
        45%, 72%  { transform: scale(0.65, 0.3) translateY(-15px) rotate(-4deg); }
        85%, 100% { transform: scale(1, 1) rotate(0deg); }
      }
    </style>

    <g id="character">
      <!-- Тіло із модифікованою формою та диханням -->
      <path class="body-breathe" fill="#ff0000" stroke="#000000" stroke-width="10" d="m320.22,75.5c-55,0 -155,20 -185.86,45.15c-20,85 110,225.9 135.73,313.9c80,15 150,5 198.78,-15.67c45,-85 115.46,-208.79 75.46,-288.79c-35,-45 -125.03,-60.05 -150.03,-50.05z" id="body"/>

      <!-- Очі -->
      <g class="eyes-group">
        <g class="eye-blink-r" transform="translate(52.73, 15.69)">
          <ellipse fill="#ffffff" cx="394.27" cy="168.77" rx="35" ry="27"/>
          <g class="pupil-look-r">
            <ellipse class="pupil" fill="#000000" cx="399.78" cy="171.34" rx="11.57" ry="9.47"/>
          </g>
        </g>
        <g class="eye-blink-l" transform="translate(73.45, 14.44)">
          <ellipse fill="#ffffff" cx="288.78" cy="170.22" rx="36" ry="25"/>
          <g class="pupil-look-l">
            <ellipse class="pupil" fill="#7efc00" stroke="#000000" stroke-width="10" cx="294.29" cy="172.14" rx="6.71" ry="3.93"/>
          </g>
        </g>
      </g>

      <!-- Рот із анімацією та вирівняним позиціонуванням -->
      <g class="mouth-group" transform="translate(-10, -5)">
        <g class="mouth-anim">
          <path fill="#aa0303" stroke="#000000" stroke-width="4" d="m267.51,253.07l77.75,16.86l65.29,7.53l77.21,-8.79c11.3,-5.65 -52.64,57.84 -52.64,57.84c0,0 -49.59,21.97 -49.68,21.88c-0.09,-0.09 -158.1,-79.01 -117.92,-95.33z"/>
          <path fill="#720000" d="m385.48,344.16l-39.94,-22.02c5.62,-7.22 10.57,-20.32 23.79,-20.41c13.22,-0.08 3.14,20.74 6.44,19.41c3.3,-1.33 6.89,-18.06 17.6,-14.43c10.7,3.63 6.79,21.44 7.58,31.29l-15.47,6.16z"/>
          <path fill="#ffffff" d="m384.71,346.15l-36.19,-19.64l-36.02,-21.45l1.82,-5.79c0,0 22.44,12.16 22.44,12.16c0,0 -1.98,3.31 -2.1,3.22c-0.12,-0.09 3.76,-2.39 3.64,-2.48c-0.12,-0.09 39.14,15.13 39.02,15.05c-0.12,-0.09 2.27,11.33 2.15,11.24c-0.12,-0.09 0.78,-10.99 0.66,-11.08c-0.12,-0.09 32.53,-6.2 32.41,-6.28c-0.12,-0.09 3.1,8.02 2.98,7.94c-0.12,-0.09 -0.38,-8.68 -0.5,-8.76c-0.12,-0.09 28.23,-13.64 28.11,-13.72l1.65,6.78l-10.91,11.74c-1.44,-0.42 -49.15,21.08 -49.15,21.08z"/>
        </g>
      </g>
    </g>
  </g>
</svg>
