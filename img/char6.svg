<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg">
  <g class="layer">
    <style>
      .eye-blink-l, .eye-blink-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c6-blink 4.9s ease-in-out infinite; 
        animation-delay: 1.6s; 
      }
      .pupil-look-l, .pupil-look-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c6-look 6.8s ease-in-out infinite; 
        animation-delay: 0.2s; 
      }
      .body-breathe {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: c6-breathe 3.6s ease-in-out infinite;
      }
      .mouth-anim {
        transform-box: fill-box;
        transform-origin: center;
        animation: c6-mouth 4.5s ease-in-out infinite;
      }

      @keyframes c6-blink { 
        0%, 92%, 100% { transform: scaleY(1); } 
        96% { transform: scaleY(0.08); } 
      }

      @keyframes c6-look { 
        0%, 100% { transform: translate(0,0); } 
        20% { transform: translate(3px,-1px); } 
        50% { transform: translate(0,0); } 
        70% { transform: translate(-3px,1px); } 
        88% { transform: translate(0,0); } 
      }

      @keyframes c6-breathe {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.02, 0.97) translateY(2px); }
      }

      @keyframes c6-mouth {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.1, 0.9); }
      }
    </style>

    <g class="body-breathe">
      <!-- Спис (праворуч) -->
      <g class="spear-group">
        <!-- Древко -->
        <path fill="#8d5b4c" stroke="#000000" stroke-width="6" stroke-linecap="round" d="M 445,110 L 445,395"/>
        <!-- Металевий наконечник -->
        <path fill="#8d99ae" stroke="#000000" stroke-width="5" stroke-linejoin="round" d="M 445,70 L 458,115 L 432,115 Z"/>
        <!-- Відблиск на наконечнику -->
        <path fill="#ffffff" d="M 445,78 L 453,112 L 445,112 Z" opacity="0.6"/>
      </g>

      <!-- Тіло Кікі (#9b59b6) -->
      <path fill="#9b59b6" stroke="#000000" stroke-width="10" d="M 300.0,415.0 C 260.0,415.0 227.3,366.2 181.2,341.5 C 135.2,316.8 127.4,257.3 127.4,257.3 Q 119.5,197.8 163.7,161.7 Q 207.9,125.5 253.9,96.5 Q 300.0,67.5 341.2,103.6 Q 382.4,139.7 423.6,171.4 Q 464.8,203.2 484.4,266.8 C 484.4,266.8 440.8,351.8 377.6,373.3 C 340.0,388.0 340.0,415.0 300.0,415.0 Z" id="body"/>

      <!-- Очі -->
      <g class="eyes-group">
        <g class="eye-blink-l">
          <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="255" cy="210" rx="34" ry="32"/>
          <g class="pupil-look-l">
            <ellipse class="pupil" fill="#000000" cx="255" cy="207" rx="14" ry="16"/>
          </g>
        </g>
        <g class="eye-blink-r">
          <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="355" cy="210" rx="34" ry="32"/>
          <g class="pupil-look-r">
            <ellipse class="pupil" fill="#000000" cx="355" cy="207" rx="14" ry="16"/>
          </g>
        </g>
      </g>

      <!-- Рот -->
      <g class="mouth-group mouth-anim">
        <ellipse fill="#3d1a4a" stroke="#000000" stroke-width="8" cx="300" cy="305" rx="34" ry="28"/>
      </g>

      <!-- Щит (зліва) -->
      <g class="shield-group">
        <circle cx="160" cy="295" r="42" fill="#e76f51" stroke="#000000" stroke-width="7"/>
        <circle cx="160" cy="295" r="28" fill="#f4a261" stroke="#000000" stroke-width="4"/>
        <circle cx="160" cy="295" r="14" fill="#8d99ae" stroke="#000000" stroke-width="5"/>
        <circle cx="156" cy="291" r="4" fill="#ffffff" opacity="0.6"/>
      </g>
    </g>
  </g>
</svg>
