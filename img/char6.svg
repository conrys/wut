<?xml version="1.0"?>
<svg width="600" height="480" viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
 <!-- Створено для Смішліста, у стилістиці оригінальних char1-4.svg, форма тіла унікальна -->
 <g class="layer">
  <title>Layer 1</title>
  <style>
   .eye-blink-l, .eye-blink-r { transform-box: fill-box; transform-origin: center; animation: c6-blink 4.9s ease-in-out infinite; animation-delay: 1.6s; }
   .pupil-look-l, .pupil-look-r { transform-box: fill-box; transform-origin: center; animation: c6-look 6.8s ease-in-out infinite; animation-delay: 0.2s; }
   @keyframes c6-blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
   @keyframes c6-look { 0%, 100% { transform: translate(0,0); } 20% { transform: translate(3px,-1px); } 50% { transform: translate(0,0); } 70% { transform: translate(-3px,1px); } 88% { transform: translate(0,0); } }
  </style>
  <path fill="#9b59b6" stroke="#000000" stroke-width="10" d="M 300.0,496.2 Q 300.0,496.2 263.6,431.2 Q 227.3,366.2 181.2,341.5 Q 135.2,316.8 127.4,257.3 Q 119.5,197.8 163.7,161.7 Q 207.9,125.5 253.9,96.5 Q 300.0,67.5 341.2,103.6 Q 382.4,139.7 423.6,171.4 Q 464.8,203.2 484.4,266.8 Q 504.0,330.3 440.8,351.8 Q 377.6,373.3 338.8,434.8 Z"/>

  <g class="eye-blink-l">
   <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="255" cy="210" rx="34" ry="32"/>
   <g class="pupil-look-l"><ellipse fill="#000000" cx="255" cy="207" rx="14" ry="16"/></g>
  </g>
  <g class="eye-blink-r">
   <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="355" cy="210" rx="34" ry="32"/>
   <g class="pupil-look-r"><ellipse fill="#000000" cx="355" cy="207" rx="14" ry="16"/></g>
  </g>
  <ellipse fill="#3d1a4a" stroke="#000000" stroke-width="8" cx="300" cy="305" rx="34" ry="28"/>
 </g>
</svg>