<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg">
  <g class="layer">
    <style>
      /* Емоційне важке дихання */
      .body-breathe {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: c8-breathe 3.2s ease-in-out infinite;
      }

      /* Кліпання очей */
      .eye-blink-l, .eye-blink-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c8-blink 4.2s ease-in-out infinite; 
        animation-delay: 0.8s; 
      }

      /* Рух зіниць */
      .pupil-look-l, .pupil-look-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c8-look 5.4s ease-in-out infinite; 
        animation-delay: 0.3s; 
      }

      /* Посмикування з'єднаних брів-повік */
      .brow-l, .brow-r { 
        transform-box: fill-box; 
        transform-origin: center; 
        animation: c8-brow 2.8s ease-in-out infinite; 
      }

      /* Анімація фірмового М-подібного рота */
      .mouth-anim {
        transform-box: fill-box;
        transform-origin: center;
        animation: c8-mouth 3.2s ease-in-out infinite;
      }

      /* Пульсуюча позначка гніву (💢) */
      .anger-vein {
        transform-box: fill-box;
        transform-origin: center;
        animation: c8-pop 1.8s ease-in-out infinite;
      }

      /* Погойдування окулярів */
      .shades-group {
        transform-box: fill-box;
        transform-origin: center;
        animation: c8-shades 3.2s ease-in-out infinite;
      }

      @keyframes c8-breathe {
        0%, 100% { transform: scale(1, 1) translateY(0); }
        50% { transform: scale(1.04, 0.95) translateY(6px); }
      }

      @keyframes c8-blink { 
        0%, 92%, 100% { transform: scaleY(1); } 
        96% { transform: scaleY(0.08); } 
      }

      @keyframes c8-look { 
        0%, 100% { transform: translate(0,0); } 
        24% { transform: translate(3px,-1px); } 
        50% { transform: translate(0,0); } 
        78% { transform: translate(-3px,1px); } 
        92% { transform: translate(0,0); } 
      }

      @keyframes c8-brow { 
        0%, 100% { transform: translateY(0); } 
        50% { transform: translateY(-3px); } 
      }

      @keyframes c8-mouth {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.06, 0.94); }
      }

      @keyframes c8-pop {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.25) rotate(5deg); }
      }

      @keyframes c8-shades {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(2px); }
      }
    </style>

    <g class="body-breathe">
      <!-- Тіло (Карен) -->
      <path fill="#ff6fa5" stroke="#000000" stroke-width="10" d="M 507.4,260.0 Q 507.4,260.0 462.3,307.7 Q 417.2,355.5 376.3,405.2 Q 335.4,455.0 280.3,420.4 Q 225.2,385.7 168.3,356.2 Q 111.5,326.6 133.1,267.6 Q 154.6,208.6 175.5,147.2 Q 196.3,85.7 261.3,100.5 Q 326.3,115.4 392.6,123.0 Q 458.9,130.6 483.1,195.3 Z" id="body"/>

      <!-- Стильні темні окуляри на лобі -->
      <g class="shades-group">
        <path d="M 215,135 Q 300,110 385,135" stroke="#111111" stroke-width="8" fill="none" stroke-linecap="round"/>
        <rect x="220" y="115" width="68" height="38" rx="10" fill="#222222" stroke="#000000" stroke-width="5"/>
        <path d="M 228,122 L 245,142" stroke="#ffffff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
        <rect x="312" y="115" width="68" height="38" rx="10" fill="#222222" stroke="#000000" stroke-width="5"/>
        <path d="M 320,122 L 337,142" stroke="#ffffff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
        <rect x="288" y="125" width="24" height="6" fill="#000000"/>
      </g>

      <!-- Очі -->
      <g class="eyes-group">
        <!-- Білки та зіниці -->
        <g class="eye-blink-l">
          <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="255" cy="235" rx="30" ry="26"/>
          <g class="pupil-look-l">
            <ellipse class="pupil" fill="#000000" cx="248" cy="238" rx="10" ry="12"/>
            <circle cx="251" cy="234" r="3" fill="#ffffff"/>
          </g>
        </g>
        <g class="eye-blink-r">
          <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="355" cy="235" rx="30" ry="26"/>
          <g class="pupil-look-r">
            <ellipse class="pupil" fill="#000000" cx="362" cy="238" rx="10" ry="12"/>
            <circle cx="365" cy="234" r="3" fill="#ffffff"/>
          </g>
        </g>

        <!-- З'єднані брови з повіками (суцільна деталь поверху очей) -->
        <g class="brow-l">
          <path d="M 218,220 L 282,240 C 282,224 278,200 225,200 C " fill="#ff6fa5" stroke="#000000" stroke-width="9" stroke-linecap="round" />
        </g>
        <g class="brow-r">
          <path d="M 382,220 L 318,240 C 318,224 320,205 379,200 " fill="#ff6fa5" stroke="#000000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Класичний М-подібний рот -->
      <g class="mouth-group mouth-anim">
        <path d="M240,305 L272,290 L300,303 L328,288 L365,305" fill="none" stroke="#7a1140" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Позначка гніву (💢) -->
      <g class="anger-vein">
        <path d="
          M 420 160 L 435 180 L 450 160
          M 465 180 L 445 195 L 465 210
          M 405 180 L 425 195 L 405 210
          M 420 230 L 435 210 L 450 230 
          " 
          stroke="#e74c3c" 
          stroke-width="8" 
          stroke-linecap="round" 
          fill="none"/>
      </g>
    </g>
  </g>
</svg>
