<?xml version="1.0"?>
<svg width="600" height="480" viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
 <!-- Створено для Смішліста, у стилістиці оригінальних char1-4.svg, форма тіла унікальна -->
 <g class="layer">
  <title>Layer 1</title>
  <style>
   .eye-blink-l, .eye-blink-r { transform-box: fill-box; transform-origin: center; animation: c8-blink 4.0s ease-in-out infinite; animation-delay: 1.0s; }
   .pupil-look-l, .pupil-look-r { transform-box: fill-box; transform-origin: center; animation: c8-look 5.6s ease-in-out infinite; animation-delay: 0.5s; }
   .brow-l, .brow-r { transform-box: fill-box; transform-origin: center; animation: c8-brow 7.5s ease-in-out infinite; animation-delay: 0.5s; }
   @keyframes c8-blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
   @keyframes c8-look { 0%, 100% { transform: translate(0,0); } 24% { transform: translate(3px,-1px); } 50% { transform: translate(0,0); } 78% { transform: translate(-3px,1px); } 92% { transform: translate(0,0); } }
   @keyframes c8-brow { 0%, 88%, 100% { transform: translateY(0); } 92% { transform: translateY(-4px); } }
  </style>
  <path fill="#ff6fa5" stroke="#000000" stroke-width="10" d="M 507.4,260.0 Q 507.4,260.0 462.3,307.7 Q 417.2,355.5 376.3,405.2 Q 335.4,455.0 280.3,420.4 Q 225.2,385.7 168.3,356.2 Q 111.5,326.6 133.1,267.6 Q 154.6,208.6 175.5,147.2 Q 196.3,85.7 261.3,100.5 Q 326.3,115.4 392.6,123.0 Q 458.9,130.6 483.1,195.3 Z"/>

  <g class="eye-blink-l">
   <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="255" cy="235" rx="30" ry="26"/>
   <g class="pupil-look-l"><ellipse fill="#000000" cx="248" cy="238" rx="10" ry="12"/></g>
  </g>
  <g class="eye-blink-r">
   <ellipse fill="#ffffff" stroke="#000000" stroke-width="6" cx="355" cy="235" rx="30" ry="26"/>
   <g class="pupil-look-r"><ellipse fill="#000000" cx="362" cy="238" rx="10" ry="12"/></g>
  </g>
  <g class="brow-l"><path d="M222,205 L270,220" stroke="#000000" stroke-width="9" stroke-linecap="round"/></g>
  <g class="brow-r"><path d="M378,205 L330,220" stroke="#000000" stroke-width="9" stroke-linecap="round"/></g>
  <path d="M240,305 L272,290 L300,303 L328,288 L365,305" fill="none" stroke="#7a1140" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
</svg>