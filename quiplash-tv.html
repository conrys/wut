<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Сміхлист ТВ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="js/styles/quiplash-shared.css">
<link rel="stylesheet" href="js/styles/reactions.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg2); color: #fff; font-family: var(--ql-font); overflow: hidden; }
.hidden { display: none !important; }
.stage { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: safe center;
  padding: 11vh 4vw 5vh; text-align: center; gap: 2vh; overflow: hidden; }
.hint { color: var(--muted); font-size: clamp(16px, 1.8vw, 26px); font-weight: 700; margin: 0; }
.top-bar { position: fixed; top: 2vh; left: 3vw; right: 3vw; z-index: 10; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.top-bar .ql-chip { font-size: clamp(13px, 1.3vw, 20px); padding: 8px 18px; }
.top-bar .ql-timer { width: clamp(64px, 6vw, 110px); height: clamp(64px, 6vw, 110px); }
.top-bar .ql-timer span { font-size: clamp(22px, 2.4vw, 42px); }
.top-bar .ql-timer::before { inset: 9px; }
#status-line { position: fixed; bottom: 2vh; left: 0; right: 0; z-index: 10; text-align: center; color: #ffb84d; font-weight: 800; font-size: clamp(14px, 1.4vw, 22px); pointer-events: none; }
#pause-overlay { position: fixed; inset: 0; z-index: 800; display: flex; align-items: center; justify-content: center; background: rgba(10,8,28,0.86); }
#pause-overlay .ql-card { padding: 4vh 5vw; font-size: clamp(20px, 2.5vw, 40px); font-weight: 900; text-align: center; }

/* лобі */
.tv-logo { font-size: clamp(72px, 11vw, 190px); }
.tv-code { display: flex; align-items: center; gap: 2vw; padding: 1.4vh 2.4vw; }
.tv-code .label { font-size: clamp(14px, 1.4vw, 22px); font-weight: 800; color: #6b6496; text-transform: uppercase; text-align: left; line-height: 1.3; }
.tv-code .code { font-size: clamp(44px, 6vw, 100px); font-weight: 900; letter-spacing: 0.14em; }
.tv-players { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); gap: 1vh 0.8vw; width: min(calc(var(--cols, 5) * 17vw), 94vw); }
.tv-p { display: flex; flex-direction: column; align-items: center; gap: 0.4vh; min-width: 0; animation: ql-pop 0.5s cubic-bezier(.3,1.6,.5,1) both; }
.tv-p .qa-av { width: var(--av, min(7vw, 14vh)); height: var(--av, min(7vw, 14vh)); }
.tv-p .nm { font-weight: 800; font-size: clamp(13px, 1.3vw, 22px); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-p.off { opacity: 0.35; filter: grayscale(0.8); }
.tv-p.ok .nm { color: var(--teal); }
.tv-p.wait { opacity: 0.6; }

/* заставка раунду */
.tv-round .ql-round-num { font-size: clamp(80px, 12vw, 220px); }
.tv-round .ql-round-sub { font-size: clamp(20px, 2.4vw, 40px); }
.tv-round .ql-round-mult { font-size: clamp(24px, 3vw, 52px); }
.fact { font-size: clamp(16px, 1.6vw, 26px); color: var(--muted); font-weight: 700; max-width: 70vw; }
.big-title { font-size: clamp(44px, 6vw, 110px); font-weight: 900; color: #fff; -webkit-text-stroke: 0.05em var(--ink); paint-order: stroke fill; text-shadow: 0 0.07em 0 var(--ink); margin: 0; }

/* голосування */
.tv-prompt { font-size: clamp(26px, 3.4vw, 60px); max-width: 80vw; }
.tv-duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 3vw; width: min(90vw, 1500px); }
.tv-duel .ql-vs { font-size: clamp(60px, 7vw, 130px); align-self: center; }
.tv-side { display: flex; flex-direction: column; gap: 3vh; min-width: 0; }
.tv-side .ql-bubble { font-size: clamp(24px, 2.8vw, 52px); padding: 3vh 2vw; min-height: 14vh; display: flex; align-items: center; justify-content: center; text-align: center; }
.tv-who { display: flex; align-items: center; gap: 1.2vw; min-height: 14vh; }
.tv-side.right .tv-who { flex-direction: row-reverse; }
.tv-who .qa-av { width: clamp(80px, 9vw, 170px); height: clamp(80px, 9vw, 170px); flex-shrink: 0; }
.tv-who-info { display: flex; flex-direction: column; gap: 1vh; min-width: 0; text-align: left; }
.tv-side.right .tv-who-info { text-align: right; align-items: flex-end; }
.tv-who-info b { font-size: clamp(22px, 2.4vw, 44px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-who-info .rv-pts { display: flex; gap: 0.8vw; align-items: center; flex-wrap: wrap; }
.tv-side.right .rv-pts { justify-content: flex-end; }
.tv-who-info .ql-points, .tv-who-info .ql-bonus { font-size: clamp(16px, 1.7vw, 30px); padding: 0.5vh 1.2vw; }
.tv-who-info .ql-voters .qa-av { width: clamp(30px, 3vw, 56px); height: clamp(30px, 3vw, 56px); }
.tv-side.right .ql-voters { justify-content: flex-end; }
.tv-votecount { font-size: clamp(18px, 2vw, 34px); font-weight: 800; color: var(--muted); }
.tv-voted { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6vw; min-height: 6vh; }
.tv-voted .qa-av { width: clamp(36px, 3.6vw, 66px); height: clamp(36px, 3.6vw, 66px); animation: ql-vote-in 0.45s cubic-bezier(.3,1.6,.5,1) both; }
.d1 { animation-delay: 0.3s !important; } .d2 { animation-delay: 1.5s !important; } .d3 { animation-delay: 2.4s !important; }

/* галерея (фінал) */
.tv-gallery { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 3vw; width: min(94vw, 1700px); align-items: center; }
.tv-gallery img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 22px; border: 4px solid var(--ink); background: #0c0826; box-shadow: 0 8px 0 var(--ink); }
.tv-answers { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 2vh 1.4vw; }
.tv-answers .ql-bubble { font-size: clamp(16px, 1.7vw, 30px); padding: 1.6vh 1.2vw; text-align: center; }
.tv-answers .ql-bubble::after { display: none; }
.tv-res { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 1.2vh 1vw; max-height: 80vh; }
.tv-res.compact .tv-res-row .ql-bubble { font-size: min(1.25vw, 2.4vh); padding: 0.8vh 0.8vw; }
.tv-res.compact .tv-res-row .qa-av { width: min(3.4vw, 6vh); height: min(3.4vw, 6vh); }
.tv-res.compact .ql-voters .qa-av { width: min(1.8vw, 3.2vh); height: min(1.8vw, 3.2vh); }
.tv-res.compact .side { min-width: 8vw; }
.tv-res.compact .side b { font-size: min(1.1vw, 2vh); max-width: 9vw; }
.tv-res.compact .ql-points, .tv-res.compact .ql-bonus { font-size: min(1vw, 1.9vh); padding: 2px 8px; }
.tv-res-row .side b { max-width: 14vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-res-row { display: flex; align-items: center; gap: 1vw; text-align: left; }
.tv-res-row .qa-av { width: clamp(50px, 5vw, 90px); height: clamp(50px, 5vw, 90px); flex-shrink: 0; }
.tv-res-row .ql-bubble { flex: 1; font-size: clamp(16px, 1.7vw, 30px); padding: 1.2vh 1.2vw; }
.tv-res-row .ql-bubble::after { display: none; }
.tv-res-row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 0.6vh; min-width: 12vw; }
.tv-res-row .side b { font-size: clamp(14px, 1.4vw, 24px); }

/* рахунок */
.tv-board { width: min(80vw, 1100px); }
.tv-board .ql-board { gap: 1vh; }
.tv-board.many .ql-board { display: grid; grid-template-columns: 1fr 1fr; gap: 1vh 1.5vw; }
.tv-board .ql-row { padding: 0.6vh 1.2vw 0.6vh 0.6vw; }
.tv-board .ql-row .qa-av { width: clamp(40px, 4.4vw, 76px); height: clamp(40px, 4.4vw, 76px); }
.tv-board .ql-row-name { font-size: clamp(16px, 1.6vw, 28px); }
.tv-board .ql-row-score { font-size: clamp(18px, 1.9vw, 34px); min-width: 7vw; }
.tv-board .ql-row-rank { font-size: clamp(16px, 1.5vw, 26px); width: 3vw; }
.tv-board .ql-row-delta { font-size: clamp(12px, 1.1vw, 18px); }
.tv-podium { display: flex; align-items: center; justify-content: center; gap: 3vw; max-width: 92vw; }
.tv-podium .winner { display: flex; align-items: center; gap: 1.5vw; min-width: 0; }
.tv-podium .qa-av { width: min(11vw, 20vh); height: min(11vw, 20vh); flex-shrink: 0; }
.tv-podium.tie .qa-av { width: min(8vw, 14vh); height: min(8vw, 14vh); }
.tv-crown { font-size: min(4vw, 7vh); font-weight: 900; animation: ql-bob 1.6s ease-in-out infinite; }
.tv-podium .nm { max-width: 36vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: min(4vw, 7vh); font-weight: 900; color: var(--yellow); -webkit-text-stroke: 0.04em var(--ink); paint-order: stroke fill; text-shadow: 0 0.06em 0 var(--ink); }
.tv-podium .sc { font-size: clamp(20px, 2.2vw, 38px); font-weight: 800; }
.tv-sound { position: fixed; bottom: 2vh; right: 2vw; z-index: 20; font-size: 14px; padding: 8px 14px; opacity: 0.8; }
</style>
</head>
<body data-scene="lobby">
<div class="ql-bg" aria-hidden="true"></div>
<div id="pause-overlay" class="hidden"><div class="ql-card">⏸ Пауза<div class="hint" id="pause-by" style="color:#6b6496;margin-top:8px"></div></div></div>
<div class="top-bar"><span class="ql-chip" id="round-chip" style="visibility:hidden"></span><div class="ql-timer hidden-timer" id="tv-timer"><span>0</span></div></div>
<div id="status-line"></div>
<button class="ql-btn ghost tv-sound" id="sound-btn">🔇 Звук</button>
<main class="stage" id="stage"></main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>window.FIREBASE_SILENT_GUEST = true; // екран ТВ: тихий анонімний вхід для запису в базу</script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/media-pool.js"></script>
<script src="js/promts/quiplash-prompts.js"></script>
<script src="js/core/content-overlay.js"></script>
<script src="js/core/online-engine.js"></script>
<script src="js/quiplash-avatars.js"></script>
<script src="js/quiplash-game.js"></script>
<script src="js/quiplash-ui.js"></script>
<script src="js/quiplash-sounds.js"></script>
<script src="js/core/reactions.js"></script>
<script>
(function () {
  const G = window.QuiplashGame, UI = window.QuiplashUI, SFX = window.QuiplashSfx;
  const esc = UI.esc;
  const stage = document.getElementById("stage");
  let state = null;
  let roomId = null;
  let reactionsMounted = false;
  let phaseKey = null;
  let lastTick = null;

  function setStage(key, html) {
    if (stage.dataset.key === key) return false;
    stage.dataset.key = key;
    stage.innerHTML = html;
    return true;
  }
  const P = (name) => Object.assign({ name }, (state.players || {})[name] || { character: 1 });
  const conn = () => G.connectedEntries(state.players).map(([n]) => n);

  function cue() {
    const key = `${state.phase}|${state.round}|${state.currentMatchupIndex}`;
    if (key === phaseKey) return;
    const first = phaseKey === null;
    phaseKey = key;
    if (first) return;
    switch (state.phase) {
      case "round_intro": SFX.play("chime"); setTimeout(() => SFX.play("whoosh"), 600); break;
      case "answering": SFX.play("pop"); break;
      case "answer_countdown": SFX.play(state.timedOut ? "buzz" : "ding"); break;
      case "voting": SFX.play("vs"); break;
      case "reveal": SFX.play("drum"); setTimeout(() => SFX.play("ding"), 1500); break;
      case "round_end": SFX.play("cheer"); break;
      case "game_over": SFX.play("fanfare"); setTimeout(() => SFX.play("cheer"), 700); UI.confetti(160); setTimeout(() => UI.confetti(120), 1600); break;
    }
  }

  function playersGrid(names, moodOf, extraCls) {
    const n = names.length;
    // не більше двох рядів: 6–10 гравців — по 5, 11–20 — по 10 в ряд
    const cols = n <= 5 ? Math.max(3, n) : Math.min(10, Math.ceil(n / 2));
    const av = cols <= 5 ? "min(8vw, 15vh)" : "min(6.4vw, 11vh)";
    return `<div class="tv-players" style="--cols:${cols};--av:${av}">${names.map((nm, i) =>
      `<div class="tv-p ${extraCls ? extraCls(nm) : ""}" style="animation-delay:${i * 50}ms">${UI.avatar(P(nm), moodOf ? moodOf(nm) : "idle")}<div class="nm">${esc(nm)}</div></div>`).join("")}</div>`;
  }

  function renderLobby() {
    const names = Object.keys(state.players || {}).sort((a, b) => (state.players[a].joinedAt || 0) - (state.players[b].joinedAt || 0));
    const c = new Set(conn());
    const key = "lobby|" + names.map((n) => `${n}:${state.players[n].character}:${c.has(n)}`).join(",");
    setStage(key, `<div class="ql-logo tv-logo bob"><span>Сміх</span><span>лист</span></div>
      <div class="ql-card tv-code"><div class="label">Заходьте з телефонів<br>Сміхлист → код кімнати</div><div class="code">${esc(roomId)}</div></div>
      ${names.length ? playersGrid(names, () => "idle", (n) => (c.has(n) ? "" : "off")) : `<p class="hint">Чекаємо на гравців…</p>`}
      <p class="hint">${c.size < G.MIN_PLAYERS ? `Потрібно ще ${G.MIN_PLAYERS - c.size} гравців` : `Гравців: ${names.length}/${G.MAX_PLAYERS} — ведучий може починати!`}</p>`);
  }

  function renderIntro() {
    const t = UI.roundTitle(state.round);
    const answerers = state.roundAnswerers || conn();
    setStage(`intro|${state.round}`, `<div class="tv-round ql-round-intro">
        <div class="ql-round-num">${esc(t.title)}</div><div class="ql-round-sub">${esc(t.sub)}</div><div class="ql-round-mult">${esc(t.mult)}</div></div>
      ${playersGrid(answerers, () => "shock")}
      ${answerers.length < Object.keys(state.players || {}).length ? `<p class="hint">Відповідають ${answerers.length} з ${Object.keys(state.players).length} — решта голосує</p>` : ""}`);
  }

  function renderAnswering() {
    const answerers = (state.roundAnswerers || conn()).filter((n) => state.players && state.players[n]);
    const done = answerers.filter((n) => G.playerAnswered(state, n));
    const key = `ans|${state.round}|${done.join(",")}`;
    const g = state.gallery;
    setStage(key, `${g ? `<img src="${esc(g.image)}" alt="" style="max-height:30vh;max-width:60vw;border-radius:22px;border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink)">` : ""}
      <h1 class="big-title">${g ? "Придумайте підпис!" : "Пишіть відповіді!"}</h1>
      <p class="hint">${g ? "Дивіться на картинку і пишіть на телефонах" : "Питання — на ваших телефонах. Кожне дісталось двом гравцям."}</p>
      ${playersGrid(answerers, (n) => (done.includes(n) ? "happy" : "write"), (n) => (done.includes(n) ? "ok" : "wait"))}
      <p class="hint">Готові: ${done.length}/${answerers.length}</p>
      ${state.tvFact ? `<div class="fact">💡 ${esc(state.tvFact)}</div>` : ""}`);
  }

  function renderCountdown() {
    setStage(`cd|${state.round}|${!!state.timedOut}`, `<h1 class="big-title ql-stamp" style="color:var(--yellow)">${state.timedOut ? "Час вийшов! ⏰" : "Всі відповіли!"}</h1>
      <p class="hint">Голосуємо — автори приховані до кінця</p>`);
  }

  function votedRow(votes) {
    return `<div class="tv-voted">${Object.keys(votes || {}).map((n) => UI.avatar(P(n), "happy")).join("")}</div>`;
  }

  function renderVoting() {
    const intro = !!state.voteRevealAt && G.now() < state.voteRevealAt;
    if (state.gallery) {
      const g = state.gallery;
      const answers = Object.entries(g.answers || {}).filter(([, t]) => t);
      const cols = answers.length > 12 ? 4 : answers.length > 6 ? 3 : answers.length > 3 ? 2 : 1;
      const votesIn = Object.keys(g.votes || {}).length;
      if (setStage(`gv|${state.round}|${intro}`, `<div class="tv-gallery">
          <img src="${esc(g.image)}" alt="">
          <div><h1 class="big-title" style="font-size:clamp(30px,3.4vw,60px);margin-bottom:2vh">${intro ? "Голосуємо!" : "Найкращий підпис?"}</h1>
            <div class="tv-answers" style="--cols:${cols};${answers.length > 8 ? "font-size:.8em" : ""}">${answers.map(([, t], i) => `<div class="ql-bubble ql-pop" style="animation-delay:${intro ? 9999 : i * 120}ms">${esc(t)}</div>`).join("")}</div>
            <p class="tv-votecount" id="vc" style="margin-top:2vh"></p><div id="voted"></div></div></div>`)) {
        stage.dataset.voted = "";
      }
      document.getElementById("vc").textContent = intro ? "" : `Голосів: ${votesIn}/${G.galleryVoters(state).length}`;
      const vk = Object.keys(g.votes || {}).join(",");
      if (stage.dataset.voted !== vk) { stage.dataset.voted = vk; document.getElementById("voted").innerHTML = votedRow(g.votes); }
      return;
    }
    const m = G.matchupList(state)[state.currentMatchupIndex];
    if (!m) return;
    const side = (text, right) => `<div class="tv-side${right ? " right" : ""}">
      <div class="ql-bubble ${right ? "right ql-slide-r" : "ql-slide-l"}">${intro ? "?" : esc(text)}</div></div>`;
    if (setStage(`v|${m.id}|${intro}`, `<div class="ql-prompt tv-prompt ql-pop">${UI.promptHtml(m.promptText)}</div>
        <div class="tv-duel">${side(m.answerA)}<div class="ql-vs">VS</div>${side(m.answerB, true)}</div>
        <p class="tv-votecount" id="vc"></p><div id="voted"></div>`)) {
      stage.dataset.voted = "";
    }
    const votesIn = Object.keys(m.votes || {}).length;
    document.getElementById("vc").textContent = intro ? "Хто ж автори? Дізнаємось після голосування" : `Голосуйте на телефонах! ${votesIn}/${G.eligibleVoters(state, m).length}`;
    const vk = Object.keys(m.votes || {}).join(",");
    if (stage.dataset.voted !== vk) { stage.dataset.voted = vk; document.getElementById("voted").innerHTML = intro ? "" : votedRow(m.votes); }
  }

  function chips(votes, match) {
    return Object.entries(votes || {}).filter(([, v]) => v === match).map(([n], i) =>
      UI.avatar(P(n), "happy").replace('class="qa-av', `style="animation-delay:${300 + i * 140}ms" class="qa-av`)).join("");
  }

  function renderReveal() {
    if (state.gallery) {
      const g = state.gallery;
      const res = Object.entries(g.results || {}).sort((a, b) => b[1].count - a[1].count);
      const compact = res.length > 5;
      const cols = res.length > 12 ? 3 : compact ? 2 : 1;
      const step = Math.min(350, 4500 / Math.max(1, res.length));
      setStage(`gr|${state.round}`, `<div class="tv-gallery" style="${compact ? "grid-template-columns:minmax(0,.55fr) minmax(0,1.45fr)" : ""}"><img src="${esc(g.image)}" alt="">
        <div class="tv-res${compact ? " compact" : ""}" style="--cols:${cols}">${res.map(([n, r], i) => `<div class="tv-res-row ql-rise" style="animation-delay:${Math.round((res.length - 1 - i) * step)}ms">
          ${UI.avatar(P(n), i === 0 && r.count > 0 ? "happy" : r.count === 0 ? "sad" : "idle")}
          <div class="ql-bubble ${i === 0 && r.count > 0 ? "win" : ""}">${esc(g.answers[n])}<div class="ql-voters" style="margin-top:6px">${chips(g.votes, n)}</div></div>
          <div class="side"><b>${esc(n)}</b><span class="ql-points">+${r.points}</span>${UI.bonusLabel(r.bonusKind, r.bonusPoints)}</div></div>`).join("")}</div></div>`);
      return;
    }
    const m = G.matchupList(state)[state.currentMatchupIndex];
    if (!m) return;
    const aWin = (m.pointsA || 0) > (m.pointsB || 0), bWin = (m.pointsB || 0) > (m.pointsA || 0);
    const forfeit = !m.answerA || !m.answerB;
    const side = (name, text, pts, bonus, kind, count, choice, win, lose, right) => `<div class="tv-side${right ? " right" : ""}">
      <div class="ql-bubble ${right ? "right" : ""} ${win ? "win" : ""} ${lose ? "lose" : ""} ${text ? "" : "missing"}">${text ? esc(text) : "— без відповіді —"}</div>
      <div class="tv-who"><span class="ql-pop d2">${UI.avatar(P(name), !text ? "sad" : win ? "happy" : lose ? "sad" : "idle")}</span>
        <div class="tv-who-info"><b class="ql-rise d2">${esc(name)}</b>
          <div class="ql-voters">${chips(m.votes, choice)}</div>
          <div class="rv-pts ql-pop d3"><span class="ql-points">+${pts || 0}</span>${UI.bonusLabel(kind, bonus)}${forfeit ? "" : `<span class="tv-votecount">${count || 0} ${UI.votesWord(count || 0)}</span>`}</div></div></div></div>`;
    setStage(`r|${m.id}`, `<div class="ql-prompt tv-prompt" style="font-size:clamp(22px,2.6vw,46px)">${UI.promptHtml(m.promptText)}</div>
      <div class="tv-duel">${side(m.playerAId, m.answerA, m.pointsA, m.bonusA, m.bonusKindA, m.countA, "A", aWin, bWin)}
        <div class="ql-vs" style="opacity:.5">VS</div>
        ${side(m.playerBId, m.answerB, m.pointsB, m.bonusB, m.bonusKindB, m.countB, "B", bWin, aWin, true)}</div>`);
  }

  function renderRoundEnd() {
    const last = state.round >= G.TOTAL_ROUNDS;
    if (setStage(`re|${state.round}`, `<h1 class="big-title" style="font-size:min(4.5vw,8vh)">${last ? "Фінальний підрахунок" : `Після раунду ${state.round}`}</h1>
      <div id="board" style="width:100%"></div><p class="hint" id="re-hint"></p>`)) {
      UI.renderChart(document.getElementById("board"), state, { showDelta: true, height: "52vh" });
    }
    const t = UI.phaseTimer(state);
    document.getElementById("re-hint").textContent = last ? "А переможцем стає…" : conn().length < 2 ? "Чекаємо, поки гравці повернуться…" : `Наступний раунд за ${t ? Math.ceil(t.remaining / 1000) : 0} с`;
  }

  function renderGameOver() {
    const ranked = Object.entries(state.players || {}).sort((a, b) => (b[1].score || 0) - (a[1].score || 0));
    const best = ranked.length ? ranked[0][1].score || 0 : 0;
    const winners = ranked.filter(([, p]) => (p.score || 0) === best).slice(0, 3);
    const tie = winners.length > 1;
    if (setStage(`go|${state.createdAt}|${ranked.length}`, `${winners.length ? `<div class="tv-crown">${tie ? "🤝 Нічия!" : "👑 Переможець"}</div>
      <div class="tv-podium ql-pop${tie ? " tie" : ""}">${winners.map(([n]) => `<div class="winner">${UI.avatar(P(n), "happy")}
        <div style="text-align:left;min-width:0"><div class="nm">${esc(n)}</div><div class="sc">${best} балів</div></div></div>`).join("")}</div>` : ""}
      <div id="board" style="width:100%"></div>`)) {
      UI.renderChart(document.getElementById("board"), state, { final: true, height: "36vh" });
    }
  }

  function render() {
    if (!state) return;
    document.body.dataset.scene = state.phase;
    if (!reactionsMounted && window.GameReactions) {
      reactionsMounted = true;
      window.GameReactions.mountOverlay(window.rtdb.ref(`quiplash_rooms/${roomId}`));
    }
    cue();
    UI.maybeSuper(state, () => { SFX.play("fanfare"); setTimeout(() => SFX.play("cheer"), 400); });
    document.getElementById("pause-overlay").classList.toggle("hidden", !state.paused);
    if (state.paused) document.getElementById("pause-by").textContent = state.pausedByName ? `${state.pausedByName} натиснув(-ла) паузу` : "";
    const chip = document.getElementById("round-chip");
    const playing = state.phase !== "lobby" && state.phase !== "game_over";
    chip.style.visibility = playing ? "visible" : "hidden";
    chip.textContent = (G.ROUND_PLAN[state.round - 1] || "classic") === "image" ? "Фінал · ×3"
      : `Раунд ${state.round}/${G.TOTAL_ROUNDS}${state.round > 1 ? ` · ×${G.mult(state.round)}` : ""}`;
    const players = Object.keys(state.players || {});
    const c = new Set(conn());
    const off = players.filter((n) => !c.has(n));
    document.getElementById("status-line").textContent = off.length && playing ? `Відключились: ${off.join(", ")}` : "";

    switch (state.phase) {
      case "lobby": renderLobby(); break;
      case "round_intro": renderIntro(); break;
      case "answering": renderAnswering(); break;
      case "answer_countdown": renderCountdown(); break;
      case "voting": renderVoting(); break;
      case "reveal": renderReveal(); break;
      case "round_end": renderRoundEnd(); break;
      case "game_over": renderGameOver(); break;
    }
  }

  setInterval(() => {
    if (!state) return;
    const visible = state.phase === "answering" || (state.phase === "voting" && !(state.voteRevealAt && G.now() < state.voteRevealAt));
    const secs = UI.paintTimer(document.getElementById("tv-timer"), state, visible);
    if (secs != null && secs <= 5 && secs > 0 && secs !== lastTick && !state.paused) SFX.play(secs <= 3 ? "tickUrgent" : "tick");
    lastTick = secs;
    // кінець VS-заставки і зворотний відлік — без чекання нового стану
    if (state.phase === "voting" || state.phase === "round_end") render();
  }, 250);

  const soundBtn = document.getElementById("sound-btn");
  soundBtn.onclick = () => { SFX.play("chime"); soundBtn.remove(); };

  function waitForRtdb() {
    if (!window.rtdbReady) { setTimeout(waitForRtdb, 300); return; }
    roomId = (new URLSearchParams(location.search).get("room") || prompt("Код кімнати Сміхлиста:") || "").trim().toUpperCase();
    if (!roomId) return;
    history.replaceState(null, "", location.pathname + "?room=" + roomId);
    window.rtdb.ref(`quiplash_rooms/${roomId}`).on("value", (snap) => {
      const s = snap.val();
      if (!s) { setStage("none", `<div class="ql-logo tv-logo bob"><span>Сміх</span><span>лист</span></div><p class="hint">Кімнату ${esc(roomId)} ще не створено — створіть її з телефона</p>`); return; }
      state = s;
      render();
    });
  }
  waitForRtdb();
})();
</script>
</body>
</html>
