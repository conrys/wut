<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<script src="js/core/native.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14161a" />
<title>Картинки для ігор</title>
<link rel="stylesheet" href="./vendor/fonts/inter.css"><link rel="stylesheet" href="./vendor/fonts/space-grotesk.css">
<link rel="stylesheet" href="js/styles/game-header.css">
<script src="js/core/game-header.js" defer></script>
<style>
  :root {
    --bg: #14161a; --surface-1: #1c1f2b; --surface-2: #262a3a; --surface-3: #31364a;
    --line: rgba(255,255,255,0.08); --text: #f2f1ec; --text-muted: #8d90a3;
    --accent: #d9b45c; --ok: #6fbf8a; --danger: #d97070;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
    --r-sm: 8px; --r-md: 14px; --r-pill: 999px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  .page { max-width: 640px; margin: 0 auto; padding: 16px 16px 120px; }
  h1 { font-family: var(--font-display); font-size: 22px; margin: 4px 0 2px; }
  h2 { font-family: var(--font-display); font-size: 16px; margin: 26px 0 10px; display: flex; align-items: baseline; gap: 6px; }
  .muted { color: var(--text-muted); font-size: 13px; line-height: 1.45; }
  .hidden { display: none !important; }
  button, label.btn {
    font: 600 14px var(--font-body); cursor: pointer; touch-action: manipulation; border: none;
    border-radius: var(--r-sm); padding: 12px 14px; color: var(--text); background: var(--surface-2);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:disabled { opacity: .45; cursor: default; }
  .btn-primary { background: var(--accent); color: #14161a; }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0 8px; }
  .tab { flex-direction: column; gap: 2px; padding: 10px 6px; background: var(--surface-1); border: 1px solid var(--line); }
  .tab small { color: var(--text-muted); font-weight: 500; font-size: 11px; }
  .tab.on { border-color: var(--accent); background: var(--surface-2); }
  .tab.on small { color: var(--accent); }

  .pick { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
  .pick label.btn { padding: 18px 14px; font-size: 15px; background: var(--surface-1); border: 1px dashed rgba(255,255,255,.22); }
  .pick input { display: none; }

  .queue { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .q { display: grid; grid-template-columns: 72px 1fr auto; gap: 10px; align-items: center;
       background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px; }
  .q img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--r-sm); background: var(--surface-2); display: block; }
  .q .info { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .q .meta { font-size: 12px; color: var(--text-muted); }
  .q .meta b { color: var(--text); font-weight: 600; }
  .q input[type=text] { width: 100%; font: 500 14px var(--font-body); color: var(--text); background: var(--surface-2);
       border: 1px solid transparent; border-radius: var(--r-sm); padding: 9px 10px; outline: none; }
  .q input[type=text]:focus { border-color: var(--accent); }
  .q input.bad { border-color: var(--danger); }
  .q .bar { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .q .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .q.done { border-color: rgba(111,191,138,.5); }
  .q.done .bar i { background: var(--ok); }
  .q.err { border-color: var(--danger); }
  .q .tl { display: flex; flex-direction: column; gap: 3px; }
  .q .tl span { font-size: 11px; color: var(--text-muted); }
  .q .gs { display: flex; flex-wrap: wrap; gap: 4px; }
  .q .g { font: 600 11px var(--font-body); padding: 5px 8px; border-radius: var(--r-pill); background: var(--surface-2);
          color: var(--text-muted); border: 1px solid transparent; }
  .q .g.on { color: #14161a; background: var(--accent); }
  .q .g.ok { color: var(--ok); background: transparent; border-color: rgba(111,191,138,.5); }
  .q .x { width: 34px; height: 34px; padding: 0; border-radius: var(--r-pill); background: transparent; border: 1px solid var(--line); color: var(--text-muted); }

  .send { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
          background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .send button { width: 100%; max-width: 608px; margin: 0 auto; display: flex; padding: 15px; font-size: 15px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .cell { position: relative; aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-1); }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 4px; font-size: 10px; line-height: 1.25;
               background: linear-gradient(transparent, rgba(0,0,0,.8)); max-height: 60%; overflow: hidden; }
  .cell .del { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; padding: 0; border-radius: var(--r-pill);
               background: rgba(20,22,26,.75); font-size: 13px; }
  .seg { display: flex; gap: 4px; background: var(--surface-1); padding: 4px; border-radius: var(--r-md); margin-bottom: 10px; }
  .seg button { flex: 1; padding: 8px 4px; font-size: 12px; background: transparent; color: var(--text-muted); }
  .seg button.on { background: var(--surface-3); color: var(--text); }
  .cell > button.open { all: unset; display: block; width: 100%; height: 100%; cursor: pointer; }
  .cell .badge { position: absolute; top: 4px; left: 4px; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: var(--r-pill);
                 background: rgba(217,180,92,.9); color: #14161a; }
  .more { width: 100%; margin-top: 10px; }

  .lb { position: fixed; inset: 0; z-index: 100000; background: #08090c; display: flex; flex-direction: column; touch-action: pan-y; }
  .lb .top { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
  .lb .top .n { flex: 1; font-size: 13px; color: var(--text-muted); }
  .lb .top button { width: 40px; height: 40px; padding: 0; border-radius: var(--r-pill); }
  .lb .top .rm { width: auto; padding: 0 14px; color: var(--danger); }
  .lb .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .lb .stage img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  .lb .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; padding: 0; background: rgba(38,42,58,.6); font-size: 22px; }
  .lb .nav.l { left: 6px; } .lb .nav.r { right: 6px; }
  .lb .capt { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); font-size: 15px; line-height: 1.4; text-align: center; min-height: 52px; }
  .lb .capt small { display: block; color: var(--text-muted); font-size: 11px; margin-top: 4px; }
  .empty { padding: 26px 10px; text-align: center; color: var(--text-muted); font-size: 13px;
           border: 1px dashed var(--line); border-radius: var(--r-md); }

  .gate { margin-top: 40px; text-align: center; }
  .gate p { color: var(--text-muted); font-size: 14px; line-height: 1.5; }
  .uid { display: flex; gap: 6px; margin: 14px auto; max-width: 420px; }
  .uid code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--surface-1);
              border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 10px; font-size: 13px; text-align: left; }
  ol.steps { text-align: left; color: var(--text-muted); font-size: 13px; line-height: 1.6; max-width: 420px; margin: 0 auto; padding-left: 20px; }
  ol.steps b { color: var(--text); }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--surface-3); color: var(--text);
           padding: 10px 16px; border-radius: var(--r-pill); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="page">
  <h1>Картинки для ігор</h1>
  <div class="muted" id="status">Завантаження…</div>

  <!-- немає входу / не адмін -->
  <div id="gate" class="gate hidden"></div>

  <div id="app" class="hidden">
    <div class="tabs" id="tabs"></div>
    <div class="muted" id="hint"></div>

    <div class="pick">
      <label class="btn">＋ Обрати фото<input type="file" id="pickFiles" accept="image/*" multiple></label>
      <label class="btn" aria-label="Зняти на камеру">📷<input type="file" id="pickCamera" accept="image/*" capture="environment"></label>
    </div>
    <div class="queue" id="queue"></div>

    <h2>Галерея <span class="muted" id="cloudCount"></span></h2>
    <div class="seg" id="seg">
      <button data-f="all" class="on">Усі</button><button data-f="cloud">Завантажені</button><button data-f="built">Вбудовані</button>
    </div>
    <div class="grid" id="grid"></div>
    <button class="more hidden" id="moreBtn">Показати ще</button>
    <div class="muted" id="builtin" style="margin-top:10px"></div>
  </div>
</div>

<div class="send hidden" id="sendBar"><button class="btn-primary" id="sendBtn">Завантажити</button></div>
<div class="toast" id="toast"></div>

<script src="./vendor/firebase/10.13.0/firebase-app-compat.js"></script>
<script src="./vendor/firebase/10.13.0/firebase-auth-compat.js"></script>
<script src="./vendor/firebase/10.13.0/firebase-firestore-compat.js"></script>
<script src="./vendor/firebase/10.13.0/firebase-storage-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/media-pool.js"></script>
<script src="js/core/login.js"></script>
<script src="js/core/back-button.js"></script>
<script src="js/promts/memology-cards.js"></script>
<script src="js/promts/fakenews-photos.js"></script>
<script>
(function () {
  const MP = window.MediaPool;
  const MAX_SIDE = 1280, TARGET_BYTES = 450 * 1024, MAX_BYTES = 1.9 * 1024 * 1024;
  // вбудовані картинки кожної гри (лежать у репо): { url, text }
  const readable = (src) => {
    let f = String(src || "").split(/[?#]/, 1)[0].split("/").pop() || "";
    try { f = decodeURIComponent(f); } catch (e) {}
    return f.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim();
  };
  const builtinLists = {
    memology: (window.MEMOLOGY_CARD_IDS || []).map((f) => ({ url: "memes/" + encodeURIComponent(f), text: "" })),
    fakenews: (window.FakeNewsPhotos || []).map((p) => ({ url: p.src, text: (p.title || "").trim() || readable(p.src) })),
    quiplash: [],
  };
  fetch("ql_img/image-prompts.json").then((r) => r.json()).then((items) => {
    builtinLists.quiplash = (Array.isArray(items) ? items : []).filter((x) => x && x.image)
      .map((x) => ({ url: "ql_img/" + x.image, text: String(x.text || "").trim() }));
    if (me) { renderTabs(); if (game === "quiplash") renderGrid(); }
  }).catch(() => {});
  const BUILTIN = { memology: () => builtinLists.memology.length, fakenews: () => builtinLists.fakenews.length, quiplash: () => builtinLists.quiplash.length };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const kb = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + " МБ" : Math.max(1, Math.round(n / 1024)) + " КБ";

  let game = "memology";
  try { const g = localStorage.getItem("games41_upload_game"); if (MP.GAMES[g]) game = g; } catch (e) {}
  let queue = [];            // { id, file, blob, type, ext, w, h, url, text, state: "ready"|"up"|"done"|"err", pct }
  let cloud = { memology: [], fakenews: [], quiplash: [] };
  let me = null, busy = false;

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ------------------------- доступ -------------------------
  function showGate(html) { $("status").textContent = ""; $("gate").innerHTML = html; $("gate").classList.remove("hidden"); }

  function boot() {
    const s = window.AppAuth && AppAuth.getSession();
    if (!s) {
      showGate(`<p>Завантажувати картинки можуть лише адміни.<br>Спершу увійди у свій акаунт.</p>
        <button class="btn-primary" id="loginBtn">Увійти</button>`);
      $("loginBtn").onclick = () => AppAuth.openLogin("login");
      return;
    }
    firebase.auth().onAuthStateChanged((user) => {
      if (!user) return;   // login.js сам скине застарілу сесію й перезавантажить
      me = { uid: user.uid, name: s.username, guest: !!s.guest };
      db.collection("games41_admins").doc(user.uid).get()
        .then((d) => (d.exists ? start() : notAdmin()))
        .catch((e) => (e && e.code === "permission-denied" ? noRules("Firestore") : notAdmin()));
    });
  }

  function notAdmin() {
    showGate(`<p>У <b>${esc(me.name)}</b> поки немає права вантажити картинки.</p>
      ${me.guest ? `<p>Ти зайшов як гість — у гостя id змінюється. Збережи профіль або увійди в акаунт.</p>` : ""}
      <div class="uid"><code id="uidText">${esc(me.uid)}</code><button id="copyUid">Копіювати</button></div>
      <ol class="steps">
        <li>Скопіюй цей id.</li>
        <li>Firebase Console → <b>Firestore</b> → колекція <b>games41_admins</b>.</li>
        <li>«Add document»: Document ID = цей id, будь-яке поле (напр. <b>name</b> = ${esc(me.name)}).</li>
        <li>Онови цю сторінку.</li>
      </ol>`);
    $("copyUid").onclick = () => navigator.clipboard.writeText(me.uid).then(() => toast("Скопійовано"), () => toast("Не вдалось скопіювати"));
  }

  // Правила Firestore/Storage у консолі ще без блоку «Картинки для ігор» — база відмовляє в читанні.
  function noRules(where) {
    showGate(`<p>База не пускає: у консолі Firebase ще немає правил для картинок (${esc(where)}).</p>
      <ol class="steps">
        <li>Firebase Console → <b>Firestore → Rules</b>: встав блок між <b>▽ Картинки для ігор</b> і <b>△</b> з файлу <b>firestore.rules</b> (перед останніми двома <b>}</b>) → Publish.</li>
        <li><b>Storage → Rules</b>: блок <b>match /games41_media/…</b> з файлу <b>storage.rules</b> → Publish.</li>
        <li>Онови цю сторінку.</li>
      </ol>`);
  }

  function start() {
    $("status").textContent = "Фото стискаються на телефоні (WebP, до " + MAX_SIDE + " px) і одразу з'являються в грі — без деплою.";
    $("app").classList.remove("hidden");
    renderTabs();
    Object.keys(MP.GAMES).forEach(loadCloud);
  }

  // ------------------------- вкладки й список у грі -------------------------
  function renderTabs() {
    $("tabs").innerHTML = Object.entries(MP.GAMES).map(([k, g]) =>
      `<button class="tab ${k === game ? "on" : ""}" data-g="${k}">${esc(g.label)}<small>${BUILTIN[k]() + cloud[k].length} фото</small></button>`).join("");
    $("tabs").querySelectorAll(".tab").forEach((b) => b.onclick = () => setGame(b.dataset.g));
    $("hint").textContent = MP.GAMES[game].hint;
  }
  function setGame(g) {
    if (busy || g === game) return;
    game = g;
    try { localStorage.setItem("games41_upload_game", g); } catch (e) {}
    filter = "all"; shown = PAGE;
    renderTabs(); renderQueue(); renderGrid();
  }
  function loadCloud(g) {
    return MP.list(g, { fresh: true }).then((items) => { cloud[g] = items; renderTabs(); if (g === game) renderGrid(); });
  }
  // ------------------------- галерея -------------------------
  const PAGE = 60;
  let filter = "all", shown = PAGE, gallery = [];
  function galleryItems() {
    const c = filter === "built" ? [] : cloud[game].slice().reverse().map((it) => ({ url: it.url, text: it.text, id: it.id, cloud: true, by: it.by, at: it.createdAt }));
    const b = filter === "cloud" ? [] : builtinLists[game].map((it) => ({ url: it.url, text: it.text, cloud: false }));
    return c.concat(b);
  }
  function renderGrid() {
    gallery = galleryItems();
    $("cloudCount").textContent = `(${cloud[game].length} завант. · ${BUILTIN[game]()} вбуд.)`;
    $("seg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.f === filter));
    const showText = game !== "memology";
    $("grid").innerHTML = gallery.slice(0, shown).map((it, i) =>
      `<div class="cell"><button class="open" data-i="${i}" aria-label="Відкрити"><img loading="lazy" decoding="async" alt="" src="${esc(it.url)}"></button>
        ${it.cloud && filter === "all" ? `<span class="badge">нове</span>` : ""}
        ${it.text && showText ? `<div class="cap">${esc(it.text)}</div>` : ""}
        ${it.cloud ? `<button class="del" data-id="${esc(it.id)}" aria-label="Видалити">✕</button>` : ""}</div>`).join("");
    if (!gallery.length) $("grid").innerHTML = `<div class="empty" style="grid-column:1/-1">${filter === "cloud" ? "Ще нічого не завантажено — гра бере лише вбудовані" : "Порожньо"}</div>`;
    $("grid").querySelectorAll(".del").forEach((b) => b.onclick = () => remove(b.dataset.id));
    $("grid").querySelectorAll(".open").forEach((b) => b.onclick = () => openLb(Number(b.dataset.i)));
    $("moreBtn").classList.toggle("hidden", gallery.length <= shown);
    $("moreBtn").textContent = `Показати ще (${gallery.length - shown})`;
    $("builtin").textContent = filter !== "cloud" && BUILTIN[game]() ? "Вбудовані лежать у GitHub — тут їх лише видно, прибрати не можна." : "";
  }
  $("seg").querySelectorAll("button").forEach((b) => b.onclick = () => { filter = b.dataset.f; shown = PAGE; renderGrid(); });
  $("moreBtn").onclick = () => { shown += PAGE; renderGrid(); };

  // перегляд на весь екран: свайп/стрілки, «Назад» на телефоні закриває
  let lbIdx = -1, lbEl = null;
  function openLb(i) {
    if (!lbEl) {
      lbEl = document.createElement("div");
      lbEl.className = "lb";
      lbEl.innerHTML = `<div class="top"><button class="cl" aria-label="Закрити">✕</button><div class="n"></div><button class="rm">Прибрати</button></div>
        <div class="stage"><img alt=""><button class="nav l" aria-label="Попередня">‹</button><button class="nav r" aria-label="Наступна">›</button></div>
        <div class="capt"></div>`;
      document.body.appendChild(lbEl);
      lbEl.querySelector(".cl").onclick = () => history.back();
      lbEl.querySelector(".nav.l").onclick = () => showLb(lbIdx - 1);
      lbEl.querySelector(".nav.r").onclick = () => showLb(lbIdx + 1);
      lbEl.querySelector(".rm").onclick = () => { const it = gallery[lbIdx]; if (it && it.cloud) remove(it.id, () => history.back()); };
      let x0 = null, y0 = null;
      lbEl.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
      lbEl.addEventListener("touchend", (e) => {
        if (x0 == null) return;
        const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) showLb(lbIdx + (dx < 0 ? 1 : -1));
        else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) history.back();   // свайп униз — закрити
      });
    }
    lbEl.classList.remove("hidden");
    document.body.style.overflow = "hidden";
    history.pushState({ lb: 1 }, "");
    showLb(i);
  }
  function showLb(i) {
    if (!gallery.length) return;
    lbIdx = (i + gallery.length) % gallery.length;
    const it = gallery[lbIdx];
    lbEl.querySelector("img").src = it.url;
    lbEl.querySelector(".n").textContent = `${lbIdx + 1} / ${gallery.length}`;
    lbEl.querySelector(".rm").classList.toggle("hidden", !it.cloud);
    const when = it.at ? new Date(it.at).toLocaleDateString("uk-UA", { day: "numeric", month: "short" }) : "";
    lbEl.querySelector(".capt").innerHTML = (it.text && game !== "memology" ? esc(it.text) : "")
      + `<small>${it.cloud ? `завантажено${it.by ? " · " + esc(it.by) : ""}${when ? " · " + when : ""}` : "вбудована"}</small>`;
    [lbIdx - 1, lbIdx + 1].forEach((j) => { const n = gallery[(j + gallery.length) % gallery.length]; if (n) { const im = new Image(); im.src = n.url; } });   // сусідні — наперед
  }
  function closeLb() { if (lbEl) lbEl.classList.add("hidden"); document.body.style.overflow = ""; lbIdx = -1; }
  window.addEventListener("popstate", () => { if (lbIdx >= 0) closeLb(); });
  document.addEventListener("keydown", (e) => {
    if (lbIdx < 0) return;
    if (e.key === "ArrowRight") showLb(lbIdx + 1); else if (e.key === "ArrowLeft") showLb(lbIdx - 1); else if (e.key === "Escape") history.back();
  });

  function remove(id, after) {
    const it = cloud[game].find((x) => x.id === id);
    if (!it || !confirm("Прибрати цю картинку з гри?")) return;
    // спершу запис (гра перестає її брати), потім сам файл
    db.collection(MP.COLLECTION).doc(id).delete()
      .then(() => firebase.storage().ref(MP.path(it.game, it.file)).delete().catch((e) => {
        if (e && e.code !== "storage/object-not-found") console.warn(e);
      }))
      .then(() => { cloud[game] = cloud[game].filter((x) => x.id !== id); renderTabs(); renderGrid(); toast("Прибрано"); if (after) after(); })
      .catch((e) => toast("Не вийшло: " + (e && e.code || e)));
  }

  // ------------------------- черга -------------------------
  function guessText(name) {
    const base = String(name || "").replace(/\.[^.]+$/, "");
    if (/^(img|dsc|pxl|photo|image|screenshot|скриншот|signal|telegram|viber|whatsapp)[\W_]|^\d[\d_\- ]{5,}$/i.test(base)) return "";
    return base.replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 80);
  }
  async function addFiles(files) {
    const list = Array.from(files || []).filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|heic|avif|bmp)$/i.test(f.name));
    if (!list.length) return;
    queue = queue.filter((q) => q.state !== "done");
    for (const f of list) {
      // games — куди вантажити (можна кілька), за замовчуванням відкрита вкладка; texts — підпис для кожної гри окремо
      const item = { id: Math.random().toString(36).slice(2), name: f.name, srcSize: f.size, state: "prep", pct: 0,
                     games: [game], done: [], texts: { fakenews: guessText(f.name), quiplash: "" } };   // для Fake News підказка з назви файлу
      queue.push(item); renderQueue();
      try {
        Object.assign(item, await compress(f));
        item.url = URL.createObjectURL(item.blob);
        item.state = "ready";
      } catch (e) {
        console.warn(e); item.state = "err"; item.error = "не вдалось відкрити фото";
      }
      renderQueue();
    }
  }
  const editable = (q) => q.state === "ready" || q.state === "err";
  const todoGames = (q) => q.games.filter((g) => !q.done.includes(g));
  function renderQueue() {
    $("queue").innerHTML = queue.map((q) => {
      const chips = Object.entries(MP.GAMES).map(([g, cfg]) => {
        const ok = q.done.includes(g), on = q.games.includes(g);
        return `<button class="g ${ok ? "ok" : on ? "on" : ""}" data-g="${g}" ${ok || !editable(q) ? "disabled" : ""}>${ok ? "✓ " : ""}${esc(cfg.label)}</button>`;
      }).join("");
      const inputs = q.games.filter((g) => MP.GAMES[g].text && !q.done.includes(g)).map((g) => {
        const cfg = MP.GAMES[g].text;
        return `<label class="tl"><span>${esc(MP.GAMES[g].label)} · ${esc(cfg.required ? cfg.label.toLowerCase() : "завдання (необов'язково)")}</span>
          <input type="text" data-t="${g}" maxlength="${cfg.max}" placeholder="${esc(cfg.placeholder || "Напр.: Кіт пішов на пенсію")}"
          value="${esc(q.texts[g] || "")}" ${editable(q) ? "" : "disabled"}></label>`;
      }).join("");
      return `
      <div class="q ${q.state === "done" ? "done" : ""} ${q.state === "err" ? "err" : ""}" data-id="${q.id}">
        <img alt="" src="${q.url || "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="}">
        <div class="info">
          <div class="gs">${chips}</div>
          ${inputs}
          <div class="meta">${q.state === "prep" ? "Стискаю…"
            : q.state === "err" ? `<span style="color:var(--danger)">${esc(q.error)}</span>`
            : `${kb(q.srcSize)} → <b>${kb(q.blob.size)}</b> · ${q.w}×${q.h}${q.ext === "jpg" ? " · JPEG" : ""}${q.state === "done" ? " · ✓ у грі" : ""}`}</div>
          <div class="bar"><i style="width:${q.state === "done" ? 100 : q.pct}%"></i></div>
        </div>
        <button class="x" aria-label="Прибрати" ${q.state === "up" ? "disabled" : ""}>✕</button>
      </div>`;
    }).join("");
    $("queue").querySelectorAll(".q").forEach((el) => {
      const q = queue.find((x) => x.id === el.dataset.id);
      el.querySelectorAll("input[data-t]").forEach((inp) => { inp.oninput = () => { q.texts[inp.dataset.t] = inp.value; inp.classList.remove("bad"); }; });
      el.querySelectorAll(".g[data-g]").forEach((b) => b.onclick = () => {
        const g = b.dataset.g;
        q.games = q.games.includes(g) ? q.games.filter((x) => x !== g) : q.games.concat(g);
        renderQueue();
      });
      el.querySelector(".x").onclick = () => { if (q.url) URL.revokeObjectURL(q.url); queue = queue.filter((x) => x !== q); renderQueue(); };
    });
    const pending = queue.filter((q) => q.blob && editable(q) && todoGames(q).length);
    const places = pending.reduce((n, q) => n + todoGames(q).length, 0);
    $("sendBar").classList.toggle("hidden", !pending.length && !busy);
    $("sendBtn").disabled = busy || !pending.length;
    const oneGame = pending.length && places === pending.length && pending.every((q) => todoGames(q)[0] === todoGames(pending[0])[0]);
    $("sendBtn").textContent = busy ? "Завантажую…" : !pending.length ? "Завантажити"
      : oneGame
        ? `Завантажити ${pending.length} в «${MP.GAMES[todoGames(pending[0])[0]].label}»`
        : `Завантажити ${pending.length} фото · ${places} ${places < 5 ? "місця" : "місць"}`;
  }

  // ------------------------- стиснення -------------------------
  function toBlob(canvas, type, q) { return new Promise((res) => canvas.toBlob(res, type, q)); }
  async function decode(file) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) {}
    }
    const url = URL.createObjectURL(file);
    try {
      const img = new Image(); img.decoding = "async"; img.src = url;
      await img.decode();
      return img;
    } finally { URL.revokeObjectURL(url); }
  }
  async function compress(file) {
    const src = await decode(file);
    const sw = src.width || src.naturalWidth, sh = src.height || src.naturalHeight;
    if (!sw || !sh) throw new Error("empty image");
    const k = Math.min(1, MAX_SIDE / Math.max(sw, sh));
    const w = Math.round(sw * k), h = Math.round(sh * k);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);   // прозорі PNG — на білому, як у мемах
    ctx.drawImage(src, 0, 0, w, h);
    if (src.close) src.close();
    let type = "image/webp", q = 0.82;
    let blob = await toBlob(c, type, q);
    if (!blob || blob.type !== "image/webp") { type = "image/jpeg"; q = 0.85; blob = await toBlob(c, type, q); }   // старий Safari не вміє WebP
    while (blob && blob.size > TARGET_BYTES && q > 0.5) { q -= 0.08; blob = await toBlob(c, type, q); }
    if (!blob || blob.size > MAX_BYTES) throw new Error("too big");
    return { blob, type, ext: type === "image/webp" ? "webp" : "jpg", w, h };
  }

  // ------------------------- завантаження -------------------------
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  async function uploadOne(q, g, step, steps) {
    const id = newId(), file = id + "." + q.ext;
    const ref = firebase.storage().ref(MP.path(g, file));
    const setPct = (k) => {
      q.pct = Math.max(3, Math.round(100 * (step + k) / steps));
      const bar = document.querySelector(`.q[data-id="${q.id}"] .bar i`); if (bar) bar.style.width = q.pct + "%";
    };
    setPct(0.03);
    const task = ref.put(q.blob, { contentType: q.type, cacheControl: "public, max-age=31536000, immutable" });
    task.on("state_changed", (s) => setPct(0.95 * s.bytesTransferred / (s.totalBytes || 1)));
    await task;
    try {
      await db.collection(MP.COLLECTION).doc(id).set({
        game: g, file, text: MP.GAMES[g].text ? (q.texts[g] || "").trim().slice(0, 120) : "", by: me.name, uid: me.uid,
        w: q.w, h: q.h, size: q.blob.size, createdAt: Date.now(),
      });
    } catch (e) {
      ref.delete().catch(() => {});   // без запису гра файл не побачить — не лишаємо сміття
      throw e;
    }
    setPct(1);
  }
  async function send() {
    if (busy) return;
    const todo = queue.filter((q) => q.blob && editable(q) && todoGames(q).length);
    // підпис обов'язковий там, де його бачать гравці (Fake News)
    const missing = [];
    todo.forEach((q) => todoGames(q).forEach((g) => {
      const cfg = MP.GAMES[g].text;
      if (cfg && cfg.required && !(q.texts[g] || "").trim()) missing.push([q, g]);
    }));
    if (missing.length) {
      renderQueue();
      missing.forEach(([q, g]) => { const i = document.querySelector(`.q[data-id="${q.id}"] input[data-t="${g}"]`); if (i) i.classList.add("bad"); });
      const first = document.querySelector(".q input.bad"); if (first) first.focus();
      toast("Підпиши фото для Fake News — гравці бачать підпис");
      return;
    }
    busy = true;
    todo.forEach((q) => { q.state = "up"; q.pct = 3; q.error = ""; });
    renderQueue();
    let ok = 0, fail = 0;
    const touched = new Set();
    for (const q of todo) {
      const gs = todoGames(q);
      try {
        for (let i = 0; i < gs.length; i++) { await uploadOne(q, gs[i], i, gs.length); q.done.push(gs[i]); touched.add(gs[i]); }
        q.state = "done"; q.pct = 100; ok++;
      } catch (e) {
        console.warn(e); fail++; q.state = "err";
        q.error = e && e.code === "storage/unauthorized" ? "Storage не пускає — встав правила з storage.rules"
          : e && e.code === "permission-denied" ? "Firestore не пускає — встав правила з firestore.rules"
          : "не завантажилось — спробуй ще" + (e && e.code ? " (" + e.code + ")" : "");
      }
      renderQueue();
    }
    busy = false;
    await Promise.all([...touched].map(loadCloud));
    renderQueue();
    toast(fail ? `Готово ${ok}, помилок ${fail}` : `Додано ${ok} — уже в грі`);
  }

  $("pickFiles").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
  $("pickCamera").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
  $("sendBtn").onclick = send;
  window.addEventListener("beforeunload", (e) => { if (busy) { e.preventDefault(); e.returnValue = ""; } });

  if (!window.firebaseReady || !firebase.storage) { showGate("<p>Немає з'єднання з Firebase. Перевір інтернет і онови сторінку.</p>"); return; }
  boot();
})();
</script>
</body>
