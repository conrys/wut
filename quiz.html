<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e2e;                 /* було --bg-void */
    --surface-1: #131a4d;          /* було --bg-panel */
    --surface-2: #202a70;          /* було --bg-tile */
    --line: rgba(255, 200, 71, 0.18); /* було --border-soft */

    --text: #f4f1ff;               /* було --text-primary */
    --text-muted: #8b90c4;

    --accent: #ffc847;             /* було --gold */
    --correct: #35d399;
    --danger: #ff5c7c;             /* було --wrong */

    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;

    --radius-xs: 4px;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-pill: 999px;

    --scrim: rgba(0,0,0,0.31);
    --scrim-strong: rgba(0,0,0,0.82);
    --blur-panel: 12px;
    --blur-bg: 3px;

    --z-bg-scene: 0;
    --z-content: 1;
    --z-sticky: 10;
    --z-banner: 20;
    --z-sidebar: 90;
    --z-modal: 100;
    --z-pause: 500;
    --z-fx: 900;
    --z-toast: 999;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; padding: 0; min-height: 100dvh; background: var(--bg);
    background-image: radial-gradient(circle at 15% 10%, rgba(123,97,255,0.16), transparent 45%), radial-gradient(circle at 85% 90%, rgba(255,200,71,0.10), transparent 40%);
    color: var(--text); font-family: var(--font-body); overflow-x: hidden; touch-action: manipulation; }
  .page { max-width: 480px; margin: 0 auto; min-height: 100dvh; position: relative;
      z-index: 0; overflow: hidden; display: flex; flex-direction: column; }
  .pad { flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 0 18px calc(30px + env(safe-area-inset-bottom)); }
  .hidden { display: none !important; }
  h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 14px; text-align: center; }
  .status-line { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 14px; }
  .pulse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .my-score { font-family: var(--font-display); font-size: 54px; color: var(--accent); }

  .panel { width: 100%; background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; }
  .scoreboard { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 14px; }
  .score-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 8px 14px; font-size: 14px; }
  .score-row.is-active { border-color: var(--accent); background: linear-gradient(90deg, rgba(255,200,71,0.14), var(--surface-1)); }
  .score-row .points { font-family: var(--font-display); font-weight: 700; color: var(--accent); }
  .score-row .points.negative { color: var(--danger); }
  .badge-turn { font-size: 10px; background: var(--accent); color: #201400; padding: 2px 8px; border-radius: var(--radius-pill); font-weight: 700; margin-left: 6px; }
  .dot-offline { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); display: inline-block; margin-right: 4px; }

  button.primary-btn { width: 100%; border: none; border-radius: var(--radius-lg); padding: 12px; font-weight: 700; font-size: 14px;
    cursor: pointer; background: var(--accent); color: #1a1200; margin-top: 10px; font-family: var(--font-display); }
  button.secondary-btn { width: 100%; border: none; border-radius: var(--radius-lg); padding: 10px; font-weight: 700; font-size: 13px;
    cursor: pointer; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); margin-top: 8px; }

  .select-cat { text-align: left; margin-bottom: 10px; }
  .select-cat .cat-name { color: var(--text-muted); font-size: 13px; margin-bottom: 6px; }
  .select-cat .vals { display: flex; gap: 8px; flex-wrap: wrap; }
  .val-btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 14px;
    font-family: var(--font-display); font-weight: 700; color: var(--accent); font-size: 15px; }
  .val-btn.played { opacity: 0.25; color: var(--text-muted); }

  .answer-value { font-family: var(--font-display); font-size: 18px; color: var(--accent); text-align: center; }
  .answer-timer { font-family: var(--font-display); font-size: 40px; margin: 6px 0; text-align: center; }
  .answer-timer.urgent { color: var(--danger); }
  .answer-q { font-size: 18px; font-weight: 600; line-height: 1.4; margin: 10px 0 18px; text-align: center; }
  .answer-options { display: grid; gap: 10px; width: 100%; }
  .opt-btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px;
    font-size: 16px; font-weight: 600; text-align: left; color: var(--text); display: flex; align-items: center; gap: 10px; width: 100%; }
  .opt-btn .letter { font-family: var(--font-display); color: var(--accent); font-weight: 700; }
  .opt-btn.chosen { border-color: var(--accent); background: rgba(255,200,71,0.18); }
  .opt-btn.locked { opacity: 0.5; }
  .opt-btn.is-correct { border-color: var(--correct); background: rgba(53,211,153,0.2); }
  .opt-btn.is-wrong-choice { border-color: var(--danger); background: rgba(255,92,124,0.2); }

  .result-banner { text-align: center; padding: 20px; border-radius: var(--radius-md); width: 100%; }
  .result-banner.correct { background: rgba(53,211,153,0.15); border: 1px solid var(--correct); }
  .result-banner.wrong { background: rgba(255,92,124,0.15); border: 1px solid var(--danger); }
  .result-banner .title { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin-bottom: 6px; }

  .podium-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface-2);
    border-radius: var(--radius-md); padding: 12px 18px; border: 1px solid var(--line); width: 100%; margin-bottom: 8px; }
  .podium-row.win { border-color: var(--accent); background: linear-gradient(90deg, rgba(255,200,71,0.18), var(--surface-2)); }
  .podium-rank { font-family: var(--font-display); font-weight: 700; width: 32px; color: var(--text-muted); }
  .podium-row.win .podium-rank { color: var(--accent); }
  .podium-name { flex: 1; font-weight: 600; }
  .podium-score { font-family: var(--font-display); font-weight: 700; color: var(--accent); }

  .host-controls { width: 100%; margin-top: 6px; }
  .host-controls .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); text-align: center; margin-bottom: 8px; opacity: 0.8; }
  .host-controls .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .host-controls button { flex: 1; min-width: 90px; }
  .danger-btn { background: transparent !important; border: 1px solid var(--danger) !important; color: var(--danger) !important; }

  /* --------- вхід у кімнату --------- */
  input.text-input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: var(--radius-md);
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    font-size: 16px; letter-spacing: 0.08em; text-align: center; text-transform: uppercase; }
  input.text-input:focus { outline: 1px solid var(--accent); }
  .divider { display: flex; align-items: center; gap: 10px; width: 100%; margin: 18px 0; color: var(--text-muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .rooms-list { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 4px; }
  .room-item { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; cursor: pointer; }
  .room-item:active { border-color: var(--accent); }
  .room-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .room-item-title { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.05em; }
  .room-item-phase { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--text-muted); }
  .room-item-count { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="page">
<div class="pad">

  <div id="view-locked" class="hidden">
    <h2>🎯 Quiz</h2>
    <div class="status-line">Увійди в профіль (кнопка зверху), щоб грати з друзями</div>
  </div>

  <div id="view-room-entry" class="hidden">
    <h2>🎯 Quiz</h2>
    <div class="status-line">Обери активну кімнату або введи код друга</div>
    <div class="rooms-list" id="activeRoomsList"></div>
    <div class="divider">або вручну</div>
    <input class="text-input" id="roomCodeInput" maxlength="5" placeholder="КОД КІМНАТИ" />
    <button class="primary-btn" id="joinRoomBtn">Приєднатись</button>
    <div class="divider">або</div>
    <button class="secondary-btn" id="createRoomBtn">Створити нову кімнату</button>
  </div>

  <div id="view-status" class="hidden">
    <h2>🎯 Quiz <span id="roomCodeLabel" style="font-size:12px; color: var(--text-muted);"></span></h2>
    <div class="my-score" id="myScore">0</div>
    <div class="status-line" id="statusLine"><span class="pulse-dot"></span> Очікуємо…</div>
    <div class="scoreboard" id="scoreboardStatus"></div>
  </div>

  <div id="view-select" class="hidden" style="width:100%;">
    <h2>🎯 Твій хід</h2>
    <div class="status-line">Вибери категорію та вартість</div>
    <div id="selectBoard" style="width:100%;"></div>
  </div>

  <div id="view-answer" class="hidden" style="width:100%;">
    <div class="answer-value" id="answerMeta">Категорія · 300</div>
    <div class="answer-timer" id="answerTimer">30</div>
    <div class="answer-q" id="answerQ"></div>
    <div class="answer-options" id="answerOptions"></div>
  </div>

  <div id="view-result" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <div class="result-banner" id="resultBanner">
      <div class="title" id="resultTitle">✅ Правильно!</div>
      <div id="resultDetail" style="color: var(--text-muted); font-size:14px;"></div>
    </div>
  </div>

  <div id="view-end" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <h2>🏆 Гру завершено</h2>
    <div id="podium" style="width:100%;"></div>
  </div>

  <div id="hostControls" class="host-controls hidden">
    <div class="eyebrow">Гост-контролі</div>
    <div class="btn-row">
      <button class="secondary-btn hidden" id="btnForceStart">Почати зараз</button>
      <button class="secondary-btn hidden" id="btnSkip">Пропустити питання</button>
      <button class="secondary-btn hidden" id="btnNextTurn">Наступний хід</button>
    </div>
    <button class="secondary-btn danger-btn" id="btnReset">🔄 Скинути гру</button>
  </div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app-settings.js"></script>
<link rel="stylesheet" href="js/game-header.css">
<script src="js/game-header.js"></script>
<script src="js/login.js"></script>
<script src="js/quiz-topics.js"></script>
<script src="js/online-engine.js"></script>
<script src="js/quiz-game.js"></script>
<script src="js/room-code-ui.js"></script>
<script src="js/score-connect.js"></script>
<script src="js/records.js"></script>
<script src="js/help.js"></script>
<script src="js/back-button.js"></script>
<script>
(function () {
  const VIEWS = ["locked", "room-entry", "status", "select", "answer", "result", "end"];
  function showView(name) {
    VIEWS.forEach((v) => document.getElementById("view-" + v).classList.toggle("hidden", v !== name));
  }
  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }

  function renderScoreboard(state, into) {
    const sorted = Object.entries(state.players || {}).sort((a, b) => (b[1].score || 0) - (a[1].score || 0));
    into.innerHTML = sorted
      .map(([name, p]) => {
        const online = window.QuizGame.connectedEntries(state.players).some(([n]) => n === name);
        const pts = p.score || 0;
        return `<div class="score-row ${name === state.currentPlayerUsername ? "is-active" : ""}">
          <div>${!online ? '<span class="dot-offline"></span>' : ""}${escapeHtml(name)}${name === state.currentPlayerUsername ? '<span class="badge-turn">ХІД</span>' : ""}</div>
          <div class="points ${pts < 0 ? "negative" : ""}">${pts}</div>
        </div>`;
      })
      .join("");
  }

  function renderSelectBoard(state) {
    const el = document.getElementById("selectBoard");
    el.innerHTML = state.board
      .map((t, ci) => {
        const btns = t.questions
          .map((q, qi) => {
            const value = window.QuizGame.QUIZ_TOPICS[ci].questions[qi].value;
            return q.played
              ? `<span class="val-btn played">—</span>`
              : `<button class="val-btn" data-ci="${ci}" data-qi="${qi}">${value}</button>`;
          })
          .join("");
        return `<div class="select-cat"><div class="cat-name">${escapeHtml(t.name)}</div><div class="vals">${btns}</div></div>`;
      })
      .join("");
    el.querySelectorAll("button[data-ci]").forEach((btn) => {
      btn.addEventListener("click", () => {
        window.QuizGame.selectQuestion(Number(btn.dataset.ci), Number(btn.dataset.qi));
      });
    });
  }

  let answeredThisQuestion = false;
  let lastQKey = null;

  function renderAnswerView(state) {
    const { categoryIndex, questionIndex } = state.currentQuestion;
    const q = window.QuizGame.QUIZ_TOPICS[categoryIndex].questions[questionIndex];
    const key = `${categoryIndex}-${questionIndex}`;
    if (key !== lastQKey) { answeredThisQuestion = false; lastQKey = key; }

    document.getElementById("answerMeta").textContent = `${state.board[categoryIndex].name} · ${q.value}`;
    if (state.phase === "questionActive") {
      const remaining = Math.max(0, Math.ceil((state.phaseDeadline - Date.now()) / 1000));
      const timerEl = document.getElementById("answerTimer");
      timerEl.textContent = remaining;
      timerEl.classList.toggle("urgent", remaining <= 5);
    }
    document.getElementById("answerQ").textContent = q.text;

    const locked = answeredThisQuestion || !!state.pendingAnswer || state.phase === "evaluating";
    const grid = document.getElementById("answerOptions");
    grid.innerHTML = q.options
      .map((opt, i) => `<button class="opt-btn ${locked ? "locked" : ""}" data-i="${i}"><span class="letter">${String.fromCharCode(65 + i)}</span>${escapeHtml(opt)}</button>`)
      .join("");

    if (!locked) {
      grid.querySelectorAll("button[data-i]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (answeredThisQuestion) return;
          answeredThisQuestion = true;
          [...grid.children].forEach((b) => b.classList.add("locked"));
          btn.classList.add("chosen");
          window.QuizGame.submitAnswer(Number(btn.dataset.i));
        });
      });
    }
  }

  function renderResultView(state) {
    const ev = state.lastEvaluation;
    if (!ev) return;
    const banner = document.getElementById("resultBanner");
    banner.className = "result-banner " + (ev.correct ? "correct" : "wrong");
    document.getElementById("resultTitle").textContent = ev.correct
      ? `✅ Правильно! +${ev.pointsAwarded}`
      : `❌ Неправильно (${ev.pointsAwarded})`;
    const { categoryIndex, questionIndex } = state.currentQuestion || {};
    const q = categoryIndex !== undefined ? window.QuizGame.QUIZ_TOPICS[categoryIndex].questions[questionIndex] : null;
    document.getElementById("resultDetail").textContent = q ? `Правильна відповідь: ${q.options[q.correctIndices[0]]}. ${q.answerText || ""}` : "";
  }

  function renderEnd(state) {
    const sorted = Object.entries(state.players || {}).sort((a, b) => (b[1].score || 0) - (a[1].score || 0));
    document.getElementById("podium").innerHTML = sorted
      .map(([name, p], i) => `<div class="podium-row ${i === 0 ? "win" : ""}">
        <div class="podium-rank">${i + 1}${i === 0 ? " 👑" : ""}</div>
        <div class="podium-name">${escapeHtml(name)}</div>
        <div class="podium-score">${p.score || 0}</div>
      </div>`)
      .join("");
  }

  function updateHostControls(state, ctx) {
    const panel = document.getElementById("hostControls");
    panel.classList.toggle("hidden", !ctx.host);
    if (!ctx.host) return;
    document.getElementById("btnForceStart").classList.toggle("hidden", !(state.phase === "lobby" || state.phase === "countdown"));
    document.getElementById("btnSkip").classList.toggle("hidden", state.phase !== "questionActive");
    document.getElementById("btnNextTurn").classList.toggle("hidden", !(state.phase === "evaluating" || state.phase === "resultDisplay"));
  }

  function onState(state, ctx) {
    if (!ctx.username) { showView("locked"); return; }

    document.getElementById("myScore").textContent = (state.players[ctx.username] || {}).score || 0;
    document.getElementById("roomCodeLabel").textContent = window.QuizGame.roomId ? `· ${window.QuizGame.roomId}` : "";
    updateHostControls(state, ctx);

    if (ctx.spectating) {
      showView("status");
      document.getElementById("statusLine").textContent = "Гра вже триває — приєднаєшся, коли почнеться нова";
      renderScoreboard(state, document.getElementById("scoreboardStatus"));
      return;
    }

    switch (state.phase) {
      case "lobby": {
        showView("status");
        scoreSentForGame = false;
        const conn = window.QuizGame.connectedEntries(state.players).length;
        document.getElementById("statusLine").innerHTML = `<span class="pulse-dot"></span> Очікуємо гравців (${conn}/${window.QuizGame.MIN_PLAYERS})`;
        renderScoreboard(state, document.getElementById("scoreboardStatus"));
        break;
      }
      case "countdown": {
        showView("status");
        const left = Math.max(0, Math.ceil((state.phaseDeadline - Date.now()) / 1000));
        document.getElementById("statusLine").textContent = `Гра почнеться через ${left} с`;
        renderScoreboard(state, document.getElementById("scoreboardStatus"));
        break;
      }
      case "categorySelect": {
        if (ctx.isActive) {
          showView("select");
          renderSelectBoard(state);
        } else {
          showView("status");
          document.getElementById("statusLine").textContent = `Хід гравця: ${state.currentPlayerUsername || "—"}`;
          renderScoreboard(state, document.getElementById("scoreboardStatus"));
        }
        break;
      }
      case "questionActive":
      case "evaluating": {
        if (ctx.isActive) {
          showView("answer");
          renderAnswerView(state);
        } else {
          showView("status");
          document.getElementById("statusLine").textContent = `Відповідає: ${state.currentPlayerUsername || "—"}`;
          renderScoreboard(state, document.getElementById("scoreboardStatus"));
        }
        break;
      }
      case "resultDisplay": {
        if (ctx.isActive) {
          showView("result");
          renderResultView(state);
        } else {
          showView("status");
          document.getElementById("statusLine").textContent = `${state.currentPlayerUsername || "—"} щойно відповідав(-ла)`;
          renderScoreboard(state, document.getElementById("scoreboardStatus"));
        }
        break;
      }
      case "game_over": {
        showView("end");
        renderEnd(state);
        if (!scoreSentForGame) {
          scoreSentForGame = true;
          const me = state.players && state.players[ctx.username];
          if (me && window.AppScore && window.AppScore.sendScore) {
            window.AppScore.sendScore("quiz", me.score || 0);
          }
        }
        break;
      }
    }
  }

  document.getElementById("btnForceStart").addEventListener("click", () => window.QuizGame.forceStart());
  document.getElementById("btnSkip").addEventListener("click", () => window.QuizGame.skipQuestion());
  document.getElementById("btnNextTurn").addEventListener("click", () => window.QuizGame.forceNextTurn());
  document.getElementById("btnReset").addEventListener("click", () => {
    if (confirm("Скинути гру для всіх?")) window.QuizGame.resetGame();
  });

  let lastState = null;
  let scoreSentForGame = false; // дедуп: щоб не слати рахунок повторно на кожен рендер game_over
  setInterval(() => {
    if (!lastState) return;
    if (lastState.phase === "countdown") {
      const el = document.getElementById("statusLine");
      if (el && !document.getElementById("view-status").classList.contains("hidden")) {
        const left = Math.max(0, Math.ceil((lastState.phaseDeadline - Date.now()) / 1000));
        el.textContent = `Гра почнеться через ${left} с`;
      }
    }
    if (lastState.phase === "questionActive" && !document.getElementById("view-answer").classList.contains("hidden")) {
      const remaining = Math.max(0, Math.ceil((lastState.phaseDeadline - Date.now()) / 1000));
      const timerEl = document.getElementById("answerTimer");
      if (timerEl) { timerEl.textContent = remaining; timerEl.classList.toggle("urgent", remaining <= 5); }
    }
  }, 250);

  function beginGame(username, roomId) {
    window.QuizGame.onStateChange = (state, ctx) => { lastState = state; onState(state, ctx); };
    window.QuizGame.start(username, roomId);
  }

  const session = window.AppAuth && window.AppAuth.getSession();
  if (session && window.rtdbReady) {
    RoomCodeUI.mount({
      containerId: "activeRoomsList",
      codeInputId: "roomCodeInput",
      joinBtnId: "joinRoomBtn",
      createBtnId: "createRoomBtn",
      watchActiveRooms: window.QuizGame.watchActiveRooms,
      renderRoomItem: (r) => `
        <div class="room-item-head">
          <span class="room-item-title">Кімната ${RoomCodeUI.escapeHtml(r.roomId)}</span>
          <span class="room-item-phase">${r.phase === "lobby" || r.phase === "countdown" ? "Лобі" : "Гра триває"}</span>
        </div>
        <div class="room-item-count">Онлайн: ${r.connectedCount} / ${r.playerCount}</div>`,
      onEnter: (roomId) => beginGame(session.username, roomId),
    });
    showView("room-entry");
  } else {
    showView("locked");
  }

  window.addEventListener("beforeunload", () => { if (window.QuizGame) window.QuizGame.stop(); });
})();
</script>
</body>
</html>
