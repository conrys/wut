<!-- Гра: Хто з нас? — неонове вечірнє шоу -->
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Хто з нас?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="js/styles/party-shared.css">
<link rel="stylesheet" href="js/styles/game-header.css">
<script src="js/core/game-header.js" defer></script>
<style>
:root {
  --bg: #14072b; --panel: rgba(255,255,255,.055); --panel-2: rgba(255,255,255,.1);
  --ink: #fff4fb; --muted: rgba(255,232,248,.62); --line: rgba(255,110,190,.22);
  --accent: #ff3d8b; --accent-ink: #fff; --good: #b4ff4a; --bad: #ff5470;
  --cyan: #33e1ff; --lime: #b4ff4a;
  --font-d: 'Unbounded', sans-serif; --font-b: 'Manrope', sans-serif;
  --hdr-bg: rgba(20,7,43,.72);
  --drink-bg: linear-gradient(135deg, #ff3d8b, #ff8a3d);
}
body { background: radial-gradient(130% 70% at 50% -10%, #561a80 0%, #22093f 45%, #0c0320 100%) fixed; }
/* прожектори */
.wf-lights { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.wf-lights i { position: absolute; top: -8vh; width: 46vmax; height: 120vh; transform-origin: 50% 0; filter: blur(10px); opacity: .55;
  clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); animation: wfSweep 11s ease-in-out infinite alternate; }
.wf-lights i:nth-child(1) { left: -18vmax; --a1: -32deg; --a2: -6deg; background: linear-gradient(180deg, rgba(255,61,139,.55), transparent 75%); }
.wf-lights i:nth-child(2) { right: -18vmax; --a1: 30deg; --a2: 8deg; background: linear-gradient(180deg, rgba(51,225,255,.45), transparent 75%); animation-duration: 13s; }
.wf-lights b { position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; background: radial-gradient(60% 100% at 50% 100%, rgba(255,61,139,.18), transparent 70%); }
@keyframes wfSweep { from { transform: rotate(var(--a1)); } to { transform: rotate(var(--a2)); } }
body[data-phase="round"] .wf-lights i { opacity: .38; }

.neon { color: #fff; text-shadow: 0 0 6px var(--accent), 0 0 18px var(--accent), 0 0 36px rgba(255,61,139,.6); }
.pp-hero h1 { font-size: 30px; text-transform: uppercase; } .pp-hero h1, .pp-lobby-head .t b { color: #fff; text-shadow: 0 0 10px var(--accent), 0 0 26px rgba(255,61,139,.7); }
.pp-primary { background: linear-gradient(135deg, #ff3d8b, #ff6a5c); box-shadow: 0 6px 22px rgba(255,61,139,.45); }
.pp-code b { color: var(--cyan); text-shadow: 0 0 12px rgba(51,225,255,.7); }

/* питання */
.wf-q { position: relative; text-align: center; padding: 18px 16px 20px; border-radius: 22px; background: rgba(12,3,32,.6);
  border: 2px solid var(--accent); box-shadow: 0 0 0 1px rgba(255,61,139,.25), 0 0 28px rgba(255,61,139,.35), inset 0 0 26px rgba(255,61,139,.18); }
.wf-q .kick { font: 900 13px var(--font-d); letter-spacing: .2em; text-transform: uppercase; color: var(--cyan); text-shadow: 0 0 10px rgba(51,225,255,.8); }
.wf-q .txt { margin-top: 10px; font: 800 22px/1.28 var(--font-d); text-wrap: balance; }
.wf-q.sm { padding: 12px 14px; } .wf-q.sm .txt { font-size: 15px; margin-top: 6px; }
.wf-q::after { content: ""; position: absolute; inset: -2px; border-radius: 22px; border: 2px solid var(--accent); animation: wfFlick 4s steps(1) infinite; pointer-events: none; }
@keyframes wfFlick { 0%, 7%, 9%, 100% { opacity: 0; } 8% { opacity: .9; } }

/* голосування */
.wf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
.wf-grid.n2 { grid-template-columns: repeat(2, 1fr); }
.wf-pick { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 16px;
  border: 2px solid transparent; background: var(--panel); font: 700 13px var(--font-b); transition: transform .15s, border-color .2s, box-shadow .2s, background .2s; }
.wf-pick span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wf-pick small { font-size: 10px; color: var(--muted); }
.wf-pick:active { transform: scale(.95); }
.wf-pick.selected { border-color: var(--cyan); background: rgba(51,225,255,.12); box-shadow: 0 0 18px rgba(51,225,255,.5), inset 0 0 14px rgba(51,225,255,.2); }
.wf-pick em { position: absolute; top: -9px; left: 50%; transform: translateX(-50%) scale(0); padding: 2px 8px; border-radius: 999px; background: var(--cyan); color: #04202a;
  font: 900 9px var(--font-d); font-style: normal; letter-spacing: .08em; white-space: nowrap; transition: transform .25s cubic-bezier(.2,1.6,.4,1); }
.wf-pick.selected em { transform: translateX(-50%) scale(1); }
.wf-grid.voted .wf-pick:not(.selected) { opacity: .62; }

/* результат: прожектор на переможця */
.wf-spot { position: relative; padding: 26px 10px 16px; text-align: center; overflow: hidden; border-radius: 22px; }
.wf-spot::before { content: ""; position: absolute; left: 50%; top: -40px; width: 340px; height: 340px; transform: translateX(-50%);
  background: conic-gradient(from 160deg at 50% 0, transparent 0deg, rgba(255,240,200,.32) 14deg, rgba(255,240,200,.32) 26deg, transparent 40deg);
  animation: wfBeamIn .9s ease-out both .2s; }
.wf-spot::after { content: ""; position: absolute; left: 50%; bottom: 8px; width: 220px; height: 34px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,240,200,.35), transparent); animation: wfBeamIn .9s ease-out both .2s; }
@keyframes wfBeamIn { from { opacity: 0; } }
.wf-wins { position: relative; z-index: 1; display: flex; justify-content: center; gap: 14px; }
.wf-win { display: flex; flex-direction: column; align-items: center; gap: 6px; animation: wfDrop .7s cubic-bezier(.2,1.5,.4,1) both .7s; }
.wf-win b { font: 900 20px var(--font-d); }
.wf-wins.many .pav { width: 76px; height: 76px; } .wf-wins.many b { font-size: 15px; }
.wf-votes { position: relative; z-index: 1; margin-top: 8px; display: inline-block; padding: 4px 12px; border-radius: 999px; font: 800 13px var(--font-d);
  background: var(--accent); color: #fff; animation: wfDrop .5s cubic-bezier(.2,1.5,.4,1) both 1.1s; }
@keyframes wfDrop { from { opacity: 0; transform: translateY(-30px) scale(.7); } }
.wf-none { text-align: center; padding: 18px 10px; }
.wf-none .ic { font-size: 40px; color: var(--cyan); }
.wf-none b { display: block; margin-top: 8px; font: 800 20px var(--font-d); }
.wf-none small { display: block; margin-top: 6px; color: var(--muted); }
.wf-lone { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.pp-bar .trk i { background: linear-gradient(90deg, var(--accent), #ff8ac0); box-shadow: 0 0 10px rgba(255,61,139,.6); }
.pp-bar.top .trk i { background: linear-gradient(90deg, var(--cyan), #9ff3ff); box-shadow: 0 0 12px rgba(51,225,255,.7); }
.wf-me { font-size: 13px; text-align: center; color: var(--muted); }
.wf-me b { color: var(--cyan); }
</style>
</head>
<body>
<div class="wf-lights" aria-hidden="true"><i></i><i></i><b></b></div>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/app-settings.js"></script>
<link rel="stylesheet" href="js/styles/reactions.css">
<script src="js/core/login.js"></script>
<script src="js/core/online-engine.js"></script>
<script src="js/quiplash-avatars.js"></script>
<script src="js/quiplash-sounds.js"></script>
<script src="js/promts/party-seed.js"></script>
<script src="js/party-modes.js"></script>
<script>window.PartyConfig = { mode: "whofrom", gameKey: "party_whofrom" };</script>
<script src="js/party-game.js"></script>
<script src="js/core/room-code-ui.js"></script>
<script src="js/party-ui.js"></script>
<script src="js/core/reactions.js"></script>
<script src="js/core/help.js"></script>
<script src="js/core/back-button.js"></script>
<script>
(function () {
  const { esc, icon } = window.PartyUI;
  const PREFIX = /^Хто з нас\s*/i;
  const votesWord = (n) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? "голос" : a >= 2 && a <= 4 && (b < 12 || b > 14) ? "голоси" : "голосів"; };
  function question(text, small) {
    const rest = String(text || "").replace(PREFIX, "");
    const cap = rest ? rest[0].toUpperCase() + rest.slice(1) : "";
    return `<div class="wf-q ${small ? "sm" : ""}"><div class="kick">Хто з нас…</div><div class="txt">${esc(PREFIX.test(text || "") ? "…" + rest : cap)}</div></div>`;
  }

  window.PartyUI.mount({
    title: "Хто з нас?",
    tagline: "Питання на всю компанію — і одне ім'я, яке назвуть найчастіше",
    emblem: `<svg class="pp-emblem" viewBox="0 0 120 120" aria-hidden="true"><defs><filter id="wfGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <g filter="url(#wfGlow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="60" cy="60" r="50" stroke="#ff3d8b" stroke-width="4.5"/>
        <path d="M27 62q11 8 22 0" stroke="#b4ff4a" stroke-width="6"/>
        <path d="M70 44a11 11 0 1 1 15 10c-3 1.5-4.5 3.5-4.5 7v2" stroke="#ff4040" stroke-width="7"/>
        <circle cx="80.5" cy="76" r="1.5" stroke="#ff4040" stroke-width="9"/></g></svg>`,
    rules: [
      "На екрані питання «Хто з нас найімовірніше…». Кожен таємно голосує за одного гравця, можна й за себе.",
      "Хто набрав найбільше голосів (від двох) — робить ковток.",
      "Голосував самотньо, за людину з одним голосом? Можеш теж отримати ковток.",
      "Не більше 6 ковтків на гравця за набір. Пити можна будь-що, хоч воду.",
    ],
    sliders: [{ key: "voteSeconds", label: "Час на голосування" }],
    stageTitle: (c) => c.st.kind === "reveal" ? "Результат" : "Голосування",

    build(c) {
      const { st, room } = c;
      if (st.kind === "pick-name") {
        if (!c.iExpected) return question(st.text) + '<div class="pp-note">Цей раунд голосують інші</div>';
        const names = st.names || [];
        return question(st.text) +
          `<div class="wf-grid ${names.length <= 4 ? "n2" : ""}">${names.map((n) =>
            `<button class="wf-pick" data-answer="${esc(n)}">${c.avatar(n, { size: names.length > 9 ? "md" : "lg" })}<span>${esc(n)}</span>${n === c.me ? "<small>це ти</small>" : ""}<em>ТВІЙ ГОЛОС</em></button>`).join("")}</div>`;
      }
      if (st.kind === "reveal") {
        const d = st.data || {}, winners = d.winners || [], bars = st.bars || [];
        const maxV = Math.max(1, ...bars.map((b) => b.value));
        const spot = winners.length
          ? `<div class="wf-spot"><div class="wf-wins ${winners.length > 1 ? "many" : ""}">${winners.map((n) =>
              `<div class="wf-win">${c.avatar(n, { size: "xl", mood: n === c.me ? "shock" : "happy" })}<b>${esc(n)}${n === c.me ? " (ти!)" : ""}</b></div>`).join("")}</div>
              <span class="wf-votes">${d.top} ${votesWord(d.top)}</span></div>`
          : `<div class="wf-none">${icon("users")}<b>${esc(st.headline || "")}</b><small>${esc((st.lines || [])[0] || "")}</small></div>`;
        const barsHtml = bars.length ? `<div class="pp-card"><div class="pp-bars">${bars.map((b, i) =>
          `<div class="pp-bar ${b.value === d.top && winners.length ? "top" : ""}" style="--i:${i}"><span class="lbl">${c.avatar(b.name, { size: "xs", still: true })}<span>${esc(b.name)}</span></span>
            <span class="trk"><i style="--w:${Math.round((b.value / maxV) * 100)}%"></i></span><span class="v">${b.value}</span></div>`).join("")}</div></div>` : "";
        const lone = (d.lone || []).length ? `<div class="wf-lone">Самотній вибір:${d.lone.map((n) => c.avatar(n, { size: "sm", mood: "sad", still: true })).join("")}</div>` : "";
        return question(st.text, true) + spot + barsHtml + lone;
      }
      return question(st.text);
    },
    update(el, c) {
      const grid = el.querySelector(".wf-grid");
      if (grid) grid.classList.toggle("voted", !!c.mine);
    },
    onStage(c) {
      if (c.st.kind !== "reveal") { c.sfx("whoosh"); return; }
      c.sfx("drum");
      const w = (c.st.data && c.st.data.winners) || [];
      setTimeout(() => c.sfx(w.includes(c.me) ? "wah" : w.length ? "fanfare" : "ding"), 800);
      if (w.includes(c.me)) c.buzz([60, 40, 60]);
    },
  });
})();
</script>
</body>
</html>
