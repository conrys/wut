<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Мафія</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Special+Elite&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e13;
    --tile-bg: #171a22;
    --tile-bg-2: #20242f;
    --line: rgba(255,255,255,0.08);
    --text-light: #e9e6dd;
    --text-muted: #8b90a0;
    --accent: #caa23a;      /* та сама змінна, яку читає auth-pill з login.js */
    --blood: #b3241f;
    --blood-dim: #4a1613;
    --gold: #caa23a;
    --gold-dim: #4a3a16;
    --commissar: #5b82ab;
    --commissar-dim: #223349;
    --teal: #3c8f7c;
    --teal-dim: #163d34;
    --paper: #efe3c8;
    --paper-dim: #d8cba8;
    --paper-ink: #2a2118;
    --font-display: 'Space Grotesk', sans-serif;
    --font-stamp: 'Special Elite', 'Courier New', monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none;
      -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; padding: 0; min-height: 100dvh; background: var(--bg);
      font-family: 'Inter', sans-serif; color: var(--text-light); overflow-x: hidden; touch-action: manipulation; }
  .bg-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-scene svg { width: 100%; height: 100%; display: block; }
  .page { max-width: 460px; margin: 0 auto; padding: 0 18px 30px; display: flex;
      flex-direction: column; align-items: center; min-height: 100dvh; position: relative; z-index: 1; }
  .hidden { display: none !important; }

  h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 4px; text-align: center; }
  .status-line { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 14px; line-height: 1.5; }
  .pulse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
      margin-right: 6px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ---------- фаза-таймер ---------- */
  .phase-bar { width: 100%; display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; font-size: 12.5px; color: var(--text-muted); }
  .phase-bar .timer { font-family: var(--font-display); font-size: 16px; color: var(--gold); }
  .phase-bar .timer.urgent { color: var(--blood); }

  /* ---------- кнопки / інпути (той самий стиль, що й в інших іграх) ---------- */
  button.primary-btn { width: 100%; border: none; border-radius: 20px; padding: 12px; font-weight: 700;
      font-size: 14px; cursor: pointer; background: var(--accent); color: #241d08; margin-top: 10px; }
  button.primary-btn:disabled { opacity: 0.35; cursor: default; }
  button.secondary-btn { width: 100%; border: none; border-radius: 20px; padding: 10px; font-weight: 700;
      font-size: 13px; cursor: pointer; background: var(--tile-bg-2); color: var(--text-light);
      border: 1px solid var(--line); margin-top: 8px; }
  button.danger-btn { background: var(--blood); color: #fff; }
  input.text-input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--tile-bg-2); color: var(--text-light);
      font-size: 16px; letter-spacing: 0.08em; text-align: center; text-transform: uppercase; }
  input.text-input:focus { outline: 1px solid var(--gold); }
  .hint-text { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 6px; min-height: 16px; }
  .divider { display: flex; align-items: center; gap: 10px; width: 100%; margin: 18px 0;
      color: var(--text-muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* ---------- список гравців (лобі) ---------- */
  .players-list { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 10px; }
  .player-chip { display: flex; justify-content: space-between; align-items: center;
      background: var(--tile-bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .player-chip.offline { opacity: 0.4; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px; margin-left: 6px; }
  .badge.host { background: var(--gold); color: #241d08; }
  .badge.ready { background: var(--teal-dim); color: #d6f0ea; }
  .badge.waiting { background: var(--tile-bg-2); color: var(--text-muted); }

  /* ---------- картка ролі ---------- */
  .role-card { background: linear-gradient(180deg, var(--tile-bg), var(--tile-bg-2));
      border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px;
      display: flex; gap: 14px; align-items: center; width: 100%; }
  .role-card .role-icon { width: 46px; height: 46px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .role-icon.mafia { background: var(--blood-dim); }
  .role-icon.doctor { background: var(--teal-dim); }
  .role-icon.commissar { background: var(--commissar-dim); }
  .role-icon.civilian { background: var(--tile-bg-2); }
  .role-card .role-name { font-family: var(--font-display); font-size: 16px; margin-bottom: 3px; }
  .role-card .role-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.4; }

  .sleeping-screen { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .sleeping-screen .moon { font-size: 40px; margin-bottom: 14px; opacity: 0.8; }

  /* ---------- сітка цілей (ніч / голосування) ---------- */
  .target-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px; width: 100%; margin-bottom: 6px; }
  .target-card { background: var(--paper); color: var(--paper-ink); border-radius: 8px;
      padding: 12px 10px; text-align: center; cursor: pointer; border: 2px solid transparent;
      transition: transform 0.15s ease, border-color 0.15s ease; }
  .target-card:active { transform: scale(0.97); }
  .target-card .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--tile-bg-2);
      color: var(--text-light); display: flex; align-items: center; justify-content: center;
      font-weight: 700; margin: 0 auto 8px; font-size: 14px; }
  .target-card .name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .target-card.selected { border-color: var(--blood); box-shadow: 0 0 0 1px var(--blood); }
  .target-card.selected.role-doctor { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal); }
  .target-card.selected.role-commissar { border-color: var(--commissar); box-shadow: 0 0 0 1px var(--commissar); }

  /* ---------- результат ночі ---------- */
  .result-card { background: var(--tile-bg); border: 1px solid var(--line); border-radius: 14px;
      padding: 22px 18px; text-align: center; margin-bottom: 14px; width: 100%; }
  .result-card .avatar-big { width: 60px; height: 60px; border-radius: 50%; background: var(--tile-bg-2);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
      font-size: 22px; font-weight: 700; border: 2px solid var(--blood); }
  .result-card.safe .avatar-big { border-color: var(--teal); }
  .result-card .result-title { font-family: var(--font-display); font-size: 16px; margin-bottom: 6px; }
  .result-card .result-sub { font-size: 12.5px; color: var(--text-muted); }
  .inspect-box { font-size: 12.5px; color: var(--text-muted); background: var(--tile-bg);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; width: 100%; }
  .inspect-box b { color: var(--text-light); }

  /* ---------- обговорення / чат ---------- */
  .chat-log { background: var(--tile-bg); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; height: 200px; overflow-y: auto; margin-bottom: 12px; font-size: 13px; width: 100%; }
  .chat-line { margin-bottom: 8px; line-height: 1.4; }
  .chat-line .who { font-weight: 700; color: var(--paper-dim); margin-right: 6px; }
  .chat-line.system { color: var(--text-muted); font-style: italic; }
  .chat-input-row { display: flex; gap: 8px; width: 100%; }
  .chat-input-row input { flex: 1; background: var(--tile-bg-2); border: 1px solid var(--line);
      border-radius: 20px; padding: 10px 14px; color: var(--text-light); font-size: 13.5px; text-transform: none; letter-spacing: normal; }
  .chat-input-row button { flex-shrink: 0; border: none; border-radius: 20px; padding: 10px 16px;
      background: var(--accent); color: #241d08; font-weight: 700; font-size: 13px; }

  /* ---------- фінал ---------- */
  .stamp-wrap { display: flex; align-items: center; justify-content: center; padding: 30px 10px 20px; width: 100%; }
  .stamp { font-family: var(--font-stamp); font-size: 20px; letter-spacing: 0.05em; text-align: center;
      padding: 14px 20px; border: 3px solid var(--blood); color: var(--blood); transform: rotate(-5deg);
      border-radius: 4px; opacity: 0; animation: stampIn 0.4s ease 0.1s forwards; }
  .stamp.win-civilians { border-color: var(--teal); color: var(--teal); }
  @keyframes stampIn { from { opacity: 0; transform: rotate(-5deg) scale(1.5); } to { opacity: 1; transform: rotate(-5deg) scale(1); } }

  .reveal-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; width: 100%; margin-bottom: 10px; }
  .reveal-row { display: flex; align-items: center; gap: 10px; background: var(--tile-bg);
      border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .reveal-row .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--tile-bg-2);
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .reveal-row.dead { opacity: 0.5; }
  .reveal-row .name { font-size: 13.5px; font-weight: 500; flex: 1; }
  .reveal-row .role-tag { font-size: 11px; padding: 2px 8px; border-radius: 3px; font-weight: 700; }
  .role-tag.mafia { background: var(--blood-dim); color: #ffd9d6; }
  .role-tag.doctor { background: var(--teal-dim); color: #d6f0ea; }
  .role-tag.commissar { background: var(--commissar-dim); color: #dbe9f5; }
  .role-tag.civilian { background: var(--tile-bg-2); color: var(--text-muted); }

  /* ---------- смуга досьє (низ екрана під час гри) ---------- */
  .dossier-strip { display: flex; gap: 8px; width: 100%; overflow-x: auto; padding: 4px 0 2px; margin-top: 6px; }
  .dossier-chip { flex-shrink: 0; display: flex; align-items: center; gap: 6px; background: var(--tile-bg);
      border: 1px solid var(--line); border-radius: 20px; padding: 5px 10px 5px 5px; }
  .dossier-chip .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--tile-bg-2);
      display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; }
  .dossier-chip .name { font-size: 11px; }
  .dossier-chip.dead { opacity: 0.4; text-decoration: line-through; }

  .room-code-display { font-family: var(--font-display); font-size: 22px; letter-spacing: 0.12em;
      background: var(--tile-bg); border: 1px dashed var(--line); border-radius: 10px;
      padding: 10px 16px; margin-bottom: 14px; text-align: center; }

  /* ---------- список активних кімнат ---------- */
  .rooms-list { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 4px; }
  .room-item { background: var(--tile-bg); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; cursor: pointer; transition: border-color 0.15s ease; }
  .room-item:active { border-color: var(--gold); }
  .room-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .room-item-title { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.05em; }
  .room-item-phase { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px;
      background: var(--tile-bg-2); color: var(--text-muted); }
  .room-item-phase.is-lobby { background: var(--teal-dim); color: #d6f0ea; }
  .room-item-avatars { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--tile-bg-2);
      display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
      color: var(--text-light); flex-shrink: 0; }
  .mini-avatar.more { background: transparent; border: 1px dashed var(--line); color: var(--text-muted); }

  /* ---------- налаштування лобі (хост) ---------- */
  .settings-box { background: var(--tile-bg); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; width: 100%; margin-bottom: 12px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
  .settings-row + .settings-row { border-top: 1px solid var(--line); }
  .settings-label { font-size: 13px; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--tile-bg-2); color: var(--text-light); font-size: 15px; font-weight: 700; cursor: pointer; }
  .stepper .val { font-family: var(--font-display); font-size: 15px; min-width: 18px; text-align: center; }
  .timer-select { background: var(--tile-bg-2); border: 1px solid var(--line); border-radius: 8px;
      color: var(--text-light); font-size: 13px; padding: 5px 8px; }
  .mode-toggle { display: flex; gap: 6px; }
  .mode-btn { background: var(--tile-bg-2); border: 1px solid var(--line); border-radius: 8px;
      color: var(--text-muted); font-size: 12px; padding: 6px 10px; cursor: pointer; }
  .mode-btn.active { color: var(--text-light); border-color: var(--accent); background: var(--tile-bg-2); }
  .mode-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .turn-label { font-size: 12px; color: var(--text-muted); margin-left: 6px; }

  /* ---------- напарники по мафії (ніч) ---------- */
  .teammates-box { font-size: 12.5px; color: var(--text-muted); background: var(--tile-bg);
      border: 1px solid var(--blood-dim); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; width: 100%; }
  .teammates-box b { color: var(--text-light); }
</style>
</head>
<body>
<div class="bg-scene" aria-hidden="true">
<svg viewBox="0 0 400 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1420"/>
      <stop offset="55%" stop-color="#0c0e13"/>
      <stop offset="100%" stop-color="#09090d"/>
    </linearGradient>
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#caa23a" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#caa23a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#caa23a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lampBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#caa23a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#caa23a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="900" fill="url(#sky)"/>

  <!-- місяць у серпанку хмар -->
  <circle cx="300" cy="150" r="160" fill="url(#moonHalo)"/>
  <circle cx="300" cy="150" r="42" fill="#e9d9a8"/>
  <circle cx="300" cy="150" r="42" fill="#caa23a" opacity="0.22"/>
  <ellipse cx="268" cy="138" rx="72" ry="17" fill="#0c0e13" opacity="0.55"/>
  <ellipse cx="332" cy="176" rx="56" ry="13" fill="#0c0e13" opacity="0.4"/>

  <!-- дальній силует міста -->
  <g fill="#0a0b0f">
    <rect x="-10" y="560" width="50" height="340"/>
    <rect x="70"  y="500" width="45" height="400"/>
    <rect x="150" y="540" width="38" height="360"/>
    <rect x="210" y="480" width="55" height="420"/>
    <rect x="280" y="530" width="42" height="370"/>
    <rect x="345" y="500" width="60" height="400"/>
  </g>

  <!-- ближній силует, трохи світліший (глибина) -->
  <g fill="#12141b">
    <rect x="0"   y="690" width="58" height="210"/>
    <rect x="55"  y="640" width="42" height="260"/>
    <rect x="95"  y="710" width="36" height="190"/>
    <rect x="128" y="660" width="50" height="240"/>
    <rect x="176" y="730" width="30" height="170"/>
    <rect x="204" y="650" width="46" height="250"/>
    <rect x="248" y="700" width="38" height="200"/>
    <rect x="284" y="670" width="32" height="230"/>
    <rect x="314" y="720" width="44" height="180"/>
    <rect x="356" y="655" width="44" height="245"/>
  </g>

  <!-- поодинокі освітлені вікна -->
  <g fill="#caa23a" opacity="0.5">
    <rect x="18" y="720" width="6" height="8"/>
    <rect x="18" y="750" width="6" height="8"/>
    <rect x="140" y="700" width="6" height="8"/>
    <rect x="218" y="690" width="6" height="8"/>
    <rect x="218" y="730" width="6" height="8"/>

    <rect x="368" y="690" width="6" height="8"/>

  <!-- ліхтар зі снопом світла -->
    <polygon points="30,747 -90,900 160,900" fill="url(#lampBeam)"/>

</div>
<div class="page">

  <div id="view-locked" class="hidden">
    <h2>🔪 Мафія</h2>
    <div class="status-line">Увійди в профіль (кнопка зверху), щоб грати з друзями</div>
  </div>

  <div id="view-room-entry" class="hidden">
    <h2>🔪 Мафія</h2>
    <div class="status-line">Обери активну кімнату або введи код друга</div>
    <div class="rooms-list" id="activeRoomsList"></div>
    <div class="divider">або вручну</div>
    <input class="text-input" id="roomCodeInput" maxlength="5" placeholder="КОД КІМНАТИ" />
    <button class="primary-btn" id="joinRoomBtn">Приєднатись</button>
    <div class="divider">або</div>
    <button class="secondary-btn" id="createRoomBtn">Створити нову кімнату</button>
  </div>

  <div id="view-waiting" class="hidden">
    <h2>🔪 Мафія</h2>
    <div class="status-line">Гра вже триває — зайдеш, щойно відкриється лобі</div>
  </div>

  <div id="view-lobby" class="hidden">
    <h2>🔪 Мафія</h2>
    <div class="room-code-display" id="roomCodeDisplay"></div>
    <div class="status-line" id="lobbyStatus"></div>
    <div class="players-list" id="playersList"></div>
    <div class="settings-box hidden" id="hostSettingsBox">
      <div class="settings-row">
        <span class="settings-label">Режим ночі</span>
        <div class="mode-toggle" id="nightModeToggle">
          <button type="button" class="mode-btn" data-value="simultaneous">Онлайн</button>
          <button type="button" class="mode-btn" data-value="sequential">За столом</button>
        </div>
      </div>
      <div class="mode-hint" id="nightModeHint"></div>
      <div class="settings-row">
        <span class="settings-label">Мафія</span>
        <div class="stepper">
          <button id="mafiaCountMinus">−</button>
          <span class="val" id="mafiaCountVal">авто</span>
          <button id="mafiaCountPlus">+</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">Ніч</span>
        <select class="timer-select" id="timerNight">
          <option value="20000">20с</option><option value="30000">30с</option>
          <option value="45000">45с</option><option value="60000">60с</option>
        </select>
      </div>
      <div class="settings-row">
        <span class="settings-label">Обговорення</span>
        <select class="timer-select" id="timerDiscussion">
          <option value="60000">1хв</option><option value="90000">1.5хв</option>
          <option value="120000">2хв</option><option value="180000">3хв</option>
        </select>
      </div>
      <div class="settings-row">
        <span class="settings-label">Голосування</span>
        <select class="timer-select" id="timerVoting">
          <option value="30000">30с</option><option value="45000">45с</option>
          <option value="60000">60с</option>
        </select>
      </div>
    </div>
    <button class="secondary-btn" id="toggleReadyBtn">Готовий</button>
    <button class="primary-btn hidden" id="startGameBtn">Почати гру</button>
    <div class="hint-text" id="startHint"></div>
  </div>

  <div id="view-night" class="hidden">
    <div class="phase-bar">
      <span><span class="pulse-dot"></span>Ніч <span id="nightNumberLabel"></span><span class="turn-label" id="nightTurnLabel"></span></span>
      <span class="timer" id="nightTimer"></span>
    </div>
    <div id="nightContent"></div>
    <button class="secondary-btn hidden" id="hostSkipNightBtn">Хост: завершити ніч достроково</button>
  </div>

  <div id="view-night_result" class="hidden">
    <h2>Ранок</h2>
    <div id="nightResultContent"></div>
    <button class="primary-btn hidden" id="hostSkipNightResultBtn">Хост: до обговорення</button>
  </div>

  <div id="view-day_discussion" class="hidden">
    <div class="phase-bar">
      <span>Обговорення</span>
      <span class="timer" id="discussionTimer"></span>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Написати місту…" maxlength="300" />
      <button id="chatSendBtn">➤</button>
    </div>
    <button class="secondary-btn hidden" id="hostSkipDiscussionBtn">Хост: до голосування</button>
  </div>

  <div id="view-day_voting" class="hidden">
    <div class="phase-bar">
      <span>Голосування</span>
      <span class="timer" id="votingTimer"></span>
    </div>
    <div id="votingContent"></div>
    <button class="secondary-btn hidden" id="hostSkipVotingBtn">Хост: завершити голосування достроково</button>
  </div>

  <div id="view-voting_result" class="hidden">
    <h2>Вирок</h2>
    <div id="votingResultContent"></div>
    <button class="secondary-btn hidden" id="hostSkipVotingResultBtn">Хост: далі</button>
  </div>

  <div id="view-game_over" class="hidden">
    <div id="gameOverContent"></div>
    <button class="primary-btn hidden" id="resetGameBtn">Нова гра</button>
  </div>

  <div class="dossier-strip" id="dossierStrip"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app-settings.js"></script>
<link rel="stylesheet" href="js/game-header.css">
<script src="js/game-header.js"></script>
<script src="js/login.js"></script>
<script src="js/online-engine.js"></script>
<script src="js/mafia-game.js"></script>
<script src="js/help.js"></script>
<script src="js/back-button.js"></script>
<script src="js/refresh-button.js"></script>
<script>
(function () {
  const VIEWS = ["locked", "room-entry", "waiting", "lobby", "night", "night_result", "day_discussion", "day_voting", "voting_result", "game_over"];
  const NIGHT_SUBPHASES = ["night_mafia", "night_doctor", "night_commissar"];
  function showView(name) {
    const mapped = NIGHT_SUBPHASES.includes(name) ? "night" : name;
    VIEWS.forEach((v) => document.getElementById("view-" + v).classList.toggle("hidden", v !== mapped));
    document.getElementById("dossierStrip").classList.toggle("hidden", !["night", ...NIGHT_SUBPHASES, "night_result", "day_discussion", "day_voting", "voting_result", "game_over"].includes(name));
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }
  function initials(name) { return (name || "?").slice(0, 1).toUpperCase(); }

  const PHASE_LABELS = {
    lobby: "Лобі", night: "Ніч", night_result: "Ранок",
    day_discussion: "Обговорення", day_voting: "Голосування", voting_result: "Вирок", game_over: "Фінал"
  };

  // Єдине джерело правди для ролей — і mafia.html, і mafia-host.html
  // читають window.MafiaGame.ROLE_META, а не тримають власні копії.
  const ROLE_META = window.MafiaGame.ROLE_META;
  const ROLE_CLASS = { mafia: "mafia", doctor: "doctor", commissar: "commissar", civilian: "civilian" };

  const ROOM_CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // без 0/O/1/I/L, щоб не плутати на слух
  function randomRoomCode() {
    let s = "";
    for (let i = 0; i < 5; i++) s += ROOM_CODE_CHARS[Math.floor(Math.random() * ROOM_CODE_CHARS.length)];
    return s;
  }

  let currentRoomId = null;
  let countdownTimer = null;
  let lastState = null, lastCtx = null;
  let pendingMafiaCount = null;

  // ------------------------- звук/вібро: під'язано до AppSettings -------------------------
  // Кожен гравець сидить за спільним столом зі своїм телефоном — звук і є
  // "ведучим": підказує особисто йому, коли настала ніч/його роль/день/пора
  // розплющити очі, без потреби озвучувати це вголос. Просто поклади файли
  // за цими шляхами — самі звуки нічого не знають про AppSettings, лише
  // грають/вібрують через нього.
  const SND = {
    night: "snd/mafia/night.mp3",                     // ніч настає — усім, заплющити очі
    nightResultDead: "snd/mafia/night-result-dead.mp3", // ранок настав, хтось загинув
    nightResultSafe: "snd/mafia/night-result-safe.mp3", // ранок настав, усі живі
    day: "snd/mafia/day.mp3",                          // початок обговорення
    votingStart: "snd/mafia/voting-start.mp3",         // спікер відкриває голосування (звук сесії ВР)
    votingTick: "snd/mafia/voting-tick.mp3",           // тік таймера голосування, як у ВР — останні секунди
    votingResultEliminated: "snd/mafia/voting-result-eliminated.mp3", // вирок: когось вигнали
    votingResultSafe: "snd/mafia/voting-result-safe.mp3",             // вирок: нічия — нікого не вигнали
    gameOverMafia: "snd/mafia/game-over-mafia.mp3",    // перемогла мафія
    gameOverCivilians: "snd/mafia/game-over-civilians.mp3", // перемогли мирні
    role: {
      mafia: "snd/mafia/role-mafia.mp3",
      doctor: "snd/mafia/role-doctor.mp3",
      commissar: "snd/mafia/role-commissar.mp3",
    },
  };

  // ------------------------- лог послідовності звуків (для дебагу) -------------------------
  // Постав false, коли доробиш моніторинг — це просто console.log, на гру
  // не впливає. Кожен рядок: час від зміни фази (з) + що саме грає.
  // Для сигналів ролі, які стартують не одразу, а через setTimeout(900),
  // додатково видно, чи фаза до моменту спрацювання ВЖЕ змінилась
  // ("⚠ ЗАПІЗНИВСЯ") — це і є підозрюваний баг із 900мс.
  const SND_DEBUG = true;
  let sndDebugPhaseAt = 0;
  const sndSessionStart = performance.now(); // з моменту завантаження сторінки — щоб бачити, коли САМЕ (хв:с.мс ігрового сеансу) щось увімкнулось, а не лише відносно попередньої фази

  function sndClock() {
    const ms = performance.now() - sndSessionStart;
    const totalSec = Math.floor(ms / 1000);
    const mm = String(Math.floor(totalSec / 60)).padStart(2, "0");
    const ss = String(totalSec % 60).padStart(2, "0");
    const mmm = String(Math.floor(ms % 1000)).padStart(3, "0");
    return `${mm}:${ss}.${mmm}`;
  }

  function sndLog(msg) {
    if (!SND_DEBUG) return;
    const t = ((performance.now() - sndDebugPhaseAt) / 1000).toFixed(2);
    console.log(`[snd ${sndClock()} | +${t}s] ${msg}`);
  }

  function playAndLog(path, label) {
    sndLog(`▶ ${label} → ${path}`);
    window.AppSettings.playSound(path);
  }

  // Грає роль-звук + вібро ТІЛЬКИ на телефоні власника цієї ролі (якщо він
  // живий) — використовується для simultaneous "night", де в кожного своя
  // роль одночасно і транслювати "чию це чергу" нема сенсу (черги нема).
  function cueOwnRoleTurn(expectedRole, state, ctx, scheduledPhase) {
    const stale = lastState && scheduledPhase && lastState.phase !== scheduledPhase;
    sndLog(
      `${stale ? "⚠ ЗАПІЗНИВСЯ (фаза вже \"" + lastState.phase + "\", а планувався під \"" + scheduledPhase + "\")" : "спрацював вчасно"} — cueOwnRoleTurn(${expectedRole})`
    );
    const me = ctx.username && (state.players || {})[ctx.username];
    if (!me || !me.alive || me.role !== expectedRole || !SND.role[expectedRole]) {
      sndLog(`  (пропущено: моя роль "${me && me.role}" ≠ "${expectedRole}", або мертвий/немає файлу)`);
      return;
    }
    playAndLog(SND.role[expectedRole], `role-${expectedRole} (own turn)`);
    window.AppSettings.vibrate(200);
  }

  // Послідовний режим ("За столом"): night_mafia/night_doctor/night_commissar
  // — тут черга РЕАЛЬНО одна на всіх (фаза й так уже видно кожному, це не
  // секрет), тож звук грає в усіх ОДНАКОВИЙ — "зараз хід мафії" чують усі,
  // а не тільки сама мафія. Вібро лишаємо адресним: воно особисто підказує
  // власнику ролі, що йти саме йому.
  function cueRoleTurnForAll(role, state, ctx, scheduledPhase) {
    const stale = lastState && scheduledPhase && lastState.phase !== scheduledPhase;
    sndLog(
      `${stale ? "⚠ ЗАПІЗНИВСЯ (фаза вже \"" + lastState.phase + "\", а планувався під \"" + scheduledPhase + "\")" : "спрацював вчасно"} — cueRoleTurnForAll(${role})`
    );
    if (SND.role[role]) playAndLog(SND.role[role], `role-${role} (для всіх)`);
    const me = ctx.username && (state.players || {})[ctx.username];
    if (me && me.alive && me.role === role) window.AppSettings.vibrate(200);
  }

  function playPhaseSounds(prevPhase, state, ctx) {
    if (!window.AppSettings || prevPhase === state.phase) return; // грати лише на ЗМІНУ фази, не на кожен heartbeat
    const AS = window.AppSettings;
    sndDebugPhaseAt = performance.now();
    sndLog(`══ фаза: "${prevPhase}" → "${state.phase}" ══`);

    switch (state.phase) {
      case "night": {
        // Simultaneous-режим: немає окремих послідовних "ходів" ролей у
        // стейт-машині — мафія/лікар/комісар подають нічні дії одночасно в
        // межах однієї фази "night" (див. resolveNightPatch у mafia-game.js).
        // Але для гравця це виглядає так само, ніби "хід настав": вібрує
        // ТІЛЬКИ той телефон, чия роль щось вирішує цієї ночі.
        playAndLog(SND.night, "night (загальне)"); // усім — не розкриває роль
        const me = ctx.username && (state.players || {})[ctx.username];
        // Невелика пауза, щоб загальний сигнал не наклався на особистий.
        if (me && me.alive && me.role) {
          sndLog(`  … cueOwnRoleTurn(${me.role}) заплановано через 900мс`);
          setTimeout(() => cueOwnRoleTurn(me.role, state, ctx, "night"), 900);
        }
        break;
      }
      case "night_mafia":
        // Перша під-фаза послідовної ночі — тут лунає загальний "ніч
        // настає" для всіх, а вже потім — сигнал ролі "мафія", теж усім.
        playAndLog(SND.night, "night (night_mafia)");
        sndLog(`  … cueRoleTurnForAll("mafia") заплановано через 900мс`);
        setTimeout(() => cueRoleTurnForAll("mafia", state, ctx, "night_mafia"), 900);
        break;
      case "night_doctor":
        cueRoleTurnForAll("doctor", state, ctx, "night_doctor");
        break;
      case "night_commissar":
        cueRoleTurnForAll("commissar", state, ctx, "night_commissar");
        break;
      case "night_result":
        playAndLog(
          state.nightResult && state.nightResult.deadPlayer ? SND.nightResultDead : SND.nightResultSafe,
          "night_result"
        );
        AS.vibrate([100, 80, 100]);
        break;
      case "day_discussion":
        playAndLog(SND.day, "day_discussion");
        break;
      case "day_voting":
        playAndLog(SND.votingStart, "day_voting (start)");
        AS.vibrate(150);
        break;
      case "voting_result":
        playAndLog(
          state.lastEliminated ? SND.votingResultEliminated : SND.votingResultSafe,
          "voting_result"
        );
        AS.vibrate([100, 80, 100]);
        break;
      case "game_over":
        playAndLog(
          state.winner === "mafia" ? SND.gameOverMafia : SND.gameOverCivilians,
          "game_over"
        );
        break;

    }
  }

  function autoMafiaCount(n) { return n <= 5 ? 1 : n <= 7 ? 2 : 3; }
  function maxMafiaCount(n) { return Math.max(1, Math.ceil(n / 2) - 1); }

  function fmtSeconds(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return s + "с";
  }

  // Останній "тікнутий" цілий рахунок секунд голосування — щоб тік грав
  // рівно раз на секунду (updateCountdowns викликається setInterval'ом
  // раз/сек, але дедуп все одно рятує, якщо цей інтервал колись пришвидшать).
  let lastVotingTickSecond = null;

  function updateCountdowns() {
    if (!lastState) return;
    const remaining = (lastState.phaseDeadline || 0) - window.MafiaGame.now();
    const label = fmtSeconds(remaining);
    const urgent = remaining < 10000;
    ["nightTimer", "discussionTimer", "votingTimer"].forEach((id) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = lastState.phaseDeadline ? label : "";
      el.classList.toggle("urgent", urgent);
    });

    // Останні 10с голосування — тік-звук/вібро в стилі таймера сесії ВР.
    if (window.AppSettings && lastState.phase === "day_voting" && urgent && remaining > 0) {
      const sec = Math.ceil(remaining / 1000);
      if (sec !== lastVotingTickSecond) {
        lastVotingTickSecond = sec;
        sndLog(`▶ voting-tick (${sec}с лишилось) → ${SND.votingTick}`);
        window.AppSettings.playSound(SND.votingTick);
        window.AppSettings.vibrate(40);
      }
    } else {
      lastVotingTickSecond = null;
    }
  }

  // ------------------------- рендер лобі -------------------------
  function renderLobby(state, ctx) {
    document.getElementById("roomCodeDisplay").textContent = currentRoomId || "";
    const players = state.players || {};
    const conn = window.MafiaGame.connectedEntries(players);
    document.getElementById("lobbyStatus").innerHTML =
      `<span class="pulse-dot"></span> Онлайн: ${conn.length} з ${Object.keys(players).length} (потрібно від ${window.MafiaGame.MIN_PLAYERS} до ${window.MafiaGame.MAX_PLAYERS})`;

    document.getElementById("playersList").innerHTML = Object.entries(players).map(([name, p]) => {
      const online = conn.some(([n]) => n === name);
      const isHostRow = state.hostUsername === name;
      return `<div class="player-chip ${online ? "" : "offline"}">
        <span>${escapeHtml(name)}</span>
        <span>
          ${isHostRow ? '<span class="badge host">ХОСТ</span>' : ""}
          <span class="badge ${p.ready ? "ready" : "waiting"}">${p.ready ? "Готовий" : "Очікує"}</span>
        </span>
      </div>`;
    }).join("") || '<div class="status-line">Ще нікого немає</div>';

    const me = players[ctx.username];
    const readyBtn = document.getElementById("toggleReadyBtn");
    readyBtn.textContent = me && me.ready ? "Я не готовий" : "Я готовий";

    const n = Object.keys(players).length;
    const enough = n >= window.MafiaGame.MIN_PLAYERS && n <= window.MafiaGame.MAX_PLAYERS;
    const startBtn = document.getElementById("startGameBtn");
    startBtn.classList.toggle("hidden", !ctx.host);
    startBtn.disabled = !enough;
    document.getElementById("startHint").textContent = ctx.host && !enough
      ? (n < window.MafiaGame.MIN_PLAYERS ? `Потрібно ще ${window.MafiaGame.MIN_PLAYERS - n} гравців(я)` : "Забагато гравців для однієї кімнати")
      : "";

    const settingsBox = document.getElementById("hostSettingsBox");
    settingsBox.classList.toggle("hidden", !ctx.host);
    if (ctx.host) {
      const nightMode = state.nightMode === "sequential" ? "sequential" : "simultaneous";
      document.querySelectorAll("#nightModeToggle .mode-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.value === nightMode);
      });
      document.getElementById("nightModeHint").textContent = nightMode === "sequential"
        ? "Ролі ходять по черзі (мафія → лікар → комісар) — для гри всіма за одним столом."
        : "Усі нічні ролі ходять одночасно — для гри, коли гравці не бачать і не чують одне одного.";

      pendingMafiaCount = state.mafiaCount == null ? null : state.mafiaCount;
      document.getElementById("mafiaCountVal").textContent = pendingMafiaCount == null ? "авто" : String(pendingMafiaCount);
      const timers = state.timers || {};
      const T = window.MafiaGame.DEFAULT_TIMERS;
      document.getElementById("timerNight").value = timers.night || T.night;
      document.getElementById("timerDiscussion").value = timers.day_discussion || T.day_discussion;
      document.getElementById("timerVoting").value = timers.day_voting || T.day_voting;
    }
  }

  // ------------------------- рендер ночі -------------------------
  // "night" (simultaneous) чи одна з трьох послідовних під-фаз — null у
  // simultaneous-режимі, бо там усі ролі ходять одночасно.
  function activeNightRole(phase) {
    if (phase === "night_mafia") return "mafia";
    if (phase === "night_doctor") return "doctor";
    if (phase === "night_commissar") return "commissar";
    return null;
  }

  function renderNight(state, ctx) {
    document.getElementById("nightNumberLabel").textContent = state.nightNumber || 1;
    const seqRole = activeNightRole(state.phase);
    document.getElementById("nightTurnLabel").textContent = seqRole
      ? ` · Хід: ${(ROLE_META[seqRole] || {}).name || seqRole}` : "";

    const players = state.players || {};
    const me = players[ctx.username];
    const content = document.getElementById("nightContent");

    if (!me || !me.alive) {
      content.innerHTML = `<div class="sleeping-screen"><div class="moon">🌙</div>Ти вибув з гри. Спостерігай за розслідуванням мовчки.</div>`;
      return;
    }

    // Послідовний режим: зараз хід не моєї ролі — просто чекаю, заплющивши
    // очі, як за фізичним столом. Публічно видно ЧИЙ це хід (ROLE_META name
    // у шапці вище), але не хто саме ця людина — так само, як ведучий вголос
    // каже "мафіє, прокинься", не називаючи імен.
    if (seqRole && me.role !== seqRole) {
      const waitingText = me.role === "civilian" || !me.role
        ? "У тебе немає нічної дії. Зачекай на ранок."
        : `Зараз хід ролі «${(ROLE_META[seqRole] || {}).name || seqRole}». Твоя черга ще прийде цієї ж ночі.`;
      content.innerHTML = `<div class="sleeping-screen"><div class="moon">🌙</div>${waitingText}</div>`;
      return;
    }

    const roleMeta = ROLE_META[me.role] || ROLE_META.civilian;
    const roleCardHtml = `
      <div class="role-card">
        <div class="role-icon ${me.role || "civilian"}">${roleMeta.icon}</div>
        <div><div class="role-name">${roleMeta.name}</div><div class="role-desc">${roleMeta.desc}</div></div>
      </div>`;

    if (me.role === "civilian" || !me.role) {
      content.innerHTML = roleCardHtml + `<div class="sleeping-screen"><div class="moon">🌙</div>У тебе немає нічної дії. Місто спить — зачекай на ранок.</div>`;
      return;
    }

    const pool = Object.entries(players).filter(([u, p]) => p.alive && u !== ctx.username);

    let teammatesHtml = "";
    if (me.role === "mafia") {
      const teammates = Object.entries(players).filter(([u, p]) => p.role === "mafia" && p.alive && u !== ctx.username);
      if (teammates.length) {
        const picks = teammates.map(([u, p]) => `${escapeHtml(u)}: ${p.nightAction ? escapeHtml(p.nightAction) : "ще обирає"}`).join(" · ");
        teammatesHtml = `<div class="teammates-box">Напарники: ${picks}</div>`;
      }
    }

    content.innerHTML = roleCardHtml + teammatesHtml + `
      <div class="target-grid">
        ${pool.map(([u]) => `
          <div class="target-card ${me.nightAction === u ? "selected role-" + me.role : ""}" data-id="${escapeHtml(u)}">
            <div class="avatar">${initials(u)}</div><div class="name">${escapeHtml(u)}</div>
          </div>`).join("")}
      </div>
      <div class="hint-text">${me.nightAction ? "Вибір зроблено." : "Обери ціль."}</div>`;

    content.querySelectorAll(".target-card").forEach((el) => {
      el.addEventListener("click", () => window.MafiaGame.submitNightAction(el.dataset.id));
    });
  }

  function toggleHostSkipButtons(ctx) {
    ["hostSkipNightBtn", "hostSkipNightResultBtn", "hostSkipDiscussionBtn", "hostSkipVotingBtn", "hostSkipVotingResultBtn"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.classList.toggle("hidden", !ctx.host);
    });
  }

  // ------------------------- рендер ранку -------------------------
  function renderNightResult(state, ctx) {
    const players = state.players || {};
    const result = state.nightResult || {};
    const dead = result.deadPlayer ? { username: result.deadPlayer } : null;
    const me = players[ctx.username];

    let inspectHtml = "";
    if (me && me.role === "commissar" && result.inspected) {
      inspectHtml = `<div class="inspect-box">Перевірка: <b>${escapeHtml(result.inspected.username)}</b> — ${result.inspected.isMafia ? "у складі мафії." : "не пов'язаний з мафією."}</div>`;
    }

    document.getElementById("nightResultContent").innerHTML = `
      <div class="result-card ${dead ? "" : "safe"}">
        <div class="avatar-big">${dead ? initials(dead.username) : "🌅"}</div>
        <div class="result-title">${dead ? `Загинув(ла): ${escapeHtml(dead.username)}` : "Ніхто не загинув"}</div>
      </div>
      ${inspectHtml}`;
  }

  // ------------------------- рендер вироку голосування -------------------------
  function renderVotingResult(state) {
    const eliminated = state.lastEliminated;
    document.getElementById("votingResultContent").innerHTML = `
      <div class="result-card ${eliminated ? "" : "safe"}">
        <div class="avatar-big">${eliminated ? initials(eliminated) : "⚖️"}</div>
        <div class="result-title">${eliminated ? `Вигнано: ${escapeHtml(eliminated)}` : "Нічия — нікого не вигнано"}</div>
      </div>`;
  }

  // ------------------------- рендер обговорення -------------------------
  function renderDayDiscussion(state, ctx) {
    const chat = state.chat || {};
    const rows = Object.values(chat).sort((a, b) => (a.at || 0) - (b.at || 0));
    const log = document.getElementById("chatLog");
    log.innerHTML = rows.length
      ? rows.map((c) => `<div class="chat-line"><span class="who">${escapeHtml(c.username)}:</span>${escapeHtml(c.text)}</div>`).join("")
      : `<div class="chat-line system">Обговорення почалось — хто здається підозрілим?</div>`;
    log.scrollTop = log.scrollHeight;
  }

  // ------------------------- рендер голосування -------------------------
  function renderDayVoting(state, ctx) {
    const players = state.players || {};
    const me = players[ctx.username];
    const content = document.getElementById("votingContent");

    if (!me || !me.alive) {
      content.innerHTML = `<div class="sleeping-screen">Ти вибув з гри — спостерігай за голосуванням.</div>`;
      return;
    }

    const pool = Object.entries(players).filter(([u, p]) => p.alive && u !== ctx.username);
    content.innerHTML = `
      <div class="target-grid">
        ${pool.map(([u]) => `
          <div class="target-card ${me.vote === u ? "selected" : ""}" data-id="${escapeHtml(u)}">
            <div class="avatar">${initials(u)}</div><div class="name">${escapeHtml(u)}</div>
          </div>`).join("")}
      </div>
      <div class="hint-text">${me.vote ? "Голос враховано — чекаємо на інших." : "Обери, кого підозрюєш."}</div>`;

    content.querySelectorAll(".target-card").forEach((el) => {
      el.addEventListener("click", () => window.MafiaGame.submitVote(el.dataset.id));
    });
  }

  // ------------------------- рендер фіналу -------------------------
  function renderGameOver(state, ctx) {
    const players = state.players || {};
    const won = state.winner === "mafia" ? "МАФІЯ ПЕРЕМОГЛА" : "МИРНІ ПЕРЕМОГЛИ";
    const stampCls = state.winner === "mafia" ? "" : "win-civilians";

    document.getElementById("gameOverContent").innerHTML = `
      <div class="stamp-wrap"><div class="stamp ${stampCls}">${won}</div></div>
      <div class="reveal-list">
        ${Object.entries(players).map(([name, p]) => `
          <div class="reveal-row ${p.alive ? "" : "dead"}">
            <span class="avatar">${initials(name)}</span>
            <span class="name">${escapeHtml(name)}</span>
            <span class="role-tag ${p.role}">${(ROLE_META[p.role] || {}).name || "?"}</span>
          </div>`).join("")}
      </div>`;
    document.getElementById("resetGameBtn").classList.toggle("hidden", !ctx.host);
  }

  function renderDossierStrip(state) {
    const players = state.players || {};
    document.getElementById("dossierStrip").innerHTML = Object.entries(players).map(([name, p]) => `
      <div class="dossier-chip ${p.alive ? "" : "dead"}">
        <span class="avatar">${initials(name)}</span><span class="name">${escapeHtml(name)}</span>
      </div>`).join("");
  }

  // ------------------------- головний диспетчер стану -------------------------
  function onState(state, ctx) {
    const prevPhase = lastState ? lastState.phase : null;
    lastState = state; lastCtx = ctx;
    if (!ctx.username) { showView("locked"); return; }

    const players = state.players || {};
    const iAmIn = !!players[ctx.username];
    if (!iAmIn && state.phase !== "lobby") { showView("waiting"); return; }

    playPhaseSounds(prevPhase, state, ctx);

    showView(state.phase);
    renderDossierStrip(state);
    toggleHostSkipButtons(ctx);

    switch (state.phase) {
      case "lobby": renderLobby(state, ctx); break;
      case "night":
      case "night_mafia":
      case "night_doctor":
      case "night_commissar":
        renderNight(state, ctx); break;
      case "night_result": renderNightResult(state, ctx); break;
      case "day_discussion": renderDayDiscussion(state, ctx); break;
      case "day_voting": renderDayVoting(state, ctx); break;
      case "voting_result": renderVotingResult(state); break;
      case "game_over": renderGameOver(state, ctx); break;
    }
  }

  // ------------------------- дії гравця -------------------------
  document.getElementById("toggleReadyBtn").addEventListener("click", () => {
    const me = lastState && lastState.players && lastState.players[lastCtx.username];
    window.MafiaGame.setReady(!(me && me.ready));
  });
  document.getElementById("startGameBtn").addEventListener("click", () => window.MafiaGame.startGame());

  document.querySelectorAll("#nightModeToggle .mode-btn").forEach((b) => {
    b.addEventListener("click", () => window.MafiaGame.setNightMode(b.dataset.value));
  });

  document.getElementById("mafiaCountMinus").addEventListener("click", () => {
    const n = lastState ? Object.keys(lastState.players || {}).length : 4;
    const current = pendingMafiaCount == null ? autoMafiaCount(n) : pendingMafiaCount;
    const next = current - 1 < 1 ? null : current - 1;
    window.MafiaGame.setMafiaCount(next);
  });
  document.getElementById("mafiaCountPlus").addEventListener("click", () => {
    const n = lastState ? Object.keys(lastState.players || {}).length : 4;
    const current = pendingMafiaCount == null ? autoMafiaCount(n) : pendingMafiaCount;
    const next = Math.min(maxMafiaCount(n), current + 1);
    window.MafiaGame.setMafiaCount(next);
  });
  ["timerNight", "timerDiscussion", "timerVoting"].forEach((id) => {
    document.getElementById(id).addEventListener("change", () => {
      window.MafiaGame.setTimers({
        night: Number(document.getElementById("timerNight").value),
        day_discussion: Number(document.getElementById("timerDiscussion").value),
        day_voting: Number(document.getElementById("timerVoting").value),
      });
    });
  });

  ["hostSkipNightBtn", "hostSkipNightResultBtn", "hostSkipDiscussionBtn", "hostSkipVotingBtn", "hostSkipVotingResultBtn"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", () => window.MafiaGame.forceAdvance());
  });

  document.getElementById("chatSendBtn").addEventListener("click", sendChat);
  document.getElementById("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });
  function sendChat() {
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;
    window.MafiaGame.sendChatMessage(text);
    input.value = "";
  }
  document.getElementById("resetGameBtn").addEventListener("click", () => {
    if (confirm("Почати нову гру з тими самими гравцями?")) window.MafiaGame.resetGame();
  });

  // ------------------------- вхід у кімнату -------------------------
  let unsubscribeRooms = null;

  function stopWatchingRoomsList() {
    if (unsubscribeRooms) { unsubscribeRooms(); unsubscribeRooms = null; }
  }

  function renderRoomsList(rooms) {
    const el = document.getElementById("activeRoomsList");
    if (!rooms.length) {
      el.innerHTML = '<div class="hint-text">Активних кімнат поки нема — створи нову.</div>';
      return;
    }
    el.innerHTML = rooms.map((r) => `
      <div class="room-item" data-room="${r.roomId}">
        <div class="room-item-head">
          <span class="room-item-title">Кімната ${escapeHtml(r.roomId)}</span>
          <span class="room-item-phase ${r.phase === "lobby" ? "is-lobby" : ""}">${PHASE_LABELS[r.phase] || r.phase}</span>
        </div>
        <div class="room-item-avatars">
          ${r.usernames.slice(0, 8).map((u) => `<span class="mini-avatar">${initials(u)}</span>`).join("")}
          ${r.usernames.length > 8 ? `<span class="mini-avatar more">+${r.usernames.length - 8}</span>` : ""}
        </div>
      </div>`).join("");

    el.querySelectorAll(".room-item").forEach((item) => {
      item.addEventListener("click", () => {
        const session = window.AppAuth.getSession();
        const roomId = item.dataset.room;
        stopWatchingRoomsList();
        setRoomInUrl(roomId);
        beginGame(session.username, roomId);
      });
    });
  }

  // history.replaceState на file:// Chrome відкидає з помилкою в консолі
  // ("'file:' URLs are treated as unique security origins") — і, що гірше,
  // кидає SecurityError, який обриває решту обробника кліку. У Capacitor
  // сторінка теж може відкриватись як file://, тому просто пропускаємо
  // оновлення адреси там, де воно недоступне: на роботу гри воно не
  // впливає (roomId усе одно передається в beginGame напряму).
  function setRoomInUrl(roomId) {
    if (location.protocol === "file:") return;
    try {
      setRoomInUrl(roomId);
    } catch (e) {}
  }

  function beginGame(username, roomId) {
    stopWatchingRoomsList();
    currentRoomId = roomId;
    window.MafiaGame.onStateChange = onState;
    window.MafiaGame.start(username, roomId);
    countdownTimer = setInterval(updateCountdowns, 1000);
  }

  document.getElementById("createRoomBtn").addEventListener("click", () => {
    const session = window.AppAuth.getSession();
    const code = randomRoomCode();
    setRoomInUrl(code);
    beginGame(session.username, code);
  });
  document.getElementById("joinRoomBtn").addEventListener("click", () => {
    const session = window.AppAuth.getSession();
    const code = document.getElementById("roomCodeInput").value.trim().toUpperCase();
    if (!code) return;
    setRoomInUrl(code);
    beginGame(session.username, code);
  });
  document.getElementById("roomCodeInput").addEventListener("input", (e) => {
    e.target.value = e.target.value.toUpperCase();
  });

  // ------------------------- старт сторінки -------------------------
  const session = window.AppAuth && window.AppAuth.getSession();
  if (session && window.rtdbReady) {
    const urlRoom = new URLSearchParams(location.search).get("room");
    if (urlRoom) {
      beginGame(session.username, urlRoom.toUpperCase());
    } else {
      showView("room-entry");
      unsubscribeRooms = window.MafiaGame.watchActiveRooms(renderRoomsList);
    }
  } else {
    showView("locked");
  }

  // pagehide — на відміну від beforeunload, значно надійніше спрацьовує в
  // Android WebView на file://-навігаціях (у т.ч. коли фрейм намагається
  // перезавантажити сам себе). Без цього стара сесія може лишитись живою
  // (Firebase-підключення + hostTick далі тікає) паралельно з новою — обидві
  // з тим самим username, обидві намагаються бути хостом → нескінченний
  // пінг-понг фаз. persisted:true (bfcache) сюди не має потрапляти — тоді
  // сторінку не вивантажують, і стопати рушій не треба.
  function teardownGame() {
    if (countdownTimer) clearInterval(countdownTimer);
    stopWatchingRoomsList();
    if (window.MafiaGame) window.MafiaGame.stop();
  }
  window.addEventListener("beforeunload", teardownGame);
  window.addEventListener("pagehide", (e) => { if (!e.persisted) teardownGame(); });
})();
</script>
</body>
</html>
