<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<script src="js/core/native.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Стрибунець</title>
<link rel="stylesheet" href="./vendor/fonts/fredoka.css">
<meta name="theme-color" content="#8fd3ff" />
<style>
  :root {
    --sky: #f2e9d8;
    --grid: rgba(120, 100, 70, 0.12);
    --bar-bg: #cdd6d6;
    --text-dark: #23261f;
    --text-muted: #5a6652;
    --platform: #6fbd4f;
    --platform-dark: #3f8a2a;
    --platform-move: #4fa8d6;
    --platform-move-dark: #2c7aa8;
    --platform-break: #b98a52;
    --platform-break-dark: #8a6238;
  }
  * {
    box-sizing: border-box; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #14161a; font-family: 'Inter', sans-serif;
    touch-action: none; overscroll-behavior: none;
    display: flex; align-items: stretch; justify-content: center;
  }
  .page {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #gameArea {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
    background: var(--sky);
    touch-action: none;
  }
  #game {
    position: absolute; inset: 0; display: block; touch-action: none;
  }
  .hud-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 46px;
    background: var(--bar-bg);
    border-bottom: 3px solid var(--text-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 5;
    font-weight: bold;
    color: var(--text-dark);
    font-family: 'Space Grotesk', sans-serif;
  }
  .hud-bar span { font-size: 20px; letter-spacing: 0.02em; }
  .hud-bar button {
    background: none; border: none; color: var(--text-dark);
    font-size: 20px; font-family: inherit; font-weight: bold;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    padding: 4px 8px;
  }
  #overlay {
    position: absolute; inset: 0;
    background: rgba(242, 233, 216, 0.94);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    text-align: center;
    color: var(--text-dark);
    font-weight: bold;
    padding: 20px;
    z-index: 10;
  }
  #overlayTitle { font-size: 24px; font-family: 'Space Grotesk', sans-serif; }
  #overlayScores { font-size: 14px; color: var(--text-muted); font-weight: normal; line-height: 1.6; }
  #overlayMsg { font-size: 12px; color: var(--text-muted); font-weight: normal; max-width: 240px; }
  #overlayBtn {
    margin-top: 6px;
    background: var(--platform-dark);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: bold;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  /* ===== тема «небо»: висота змінює небо, рахунок і вікна — круглі картки ===== */
  html, body { background: #0f1830; font-family: 'Fredoka', 'Inter', sans-serif; }
  #gameArea { background: #8fd3ff; }
  .hud-bar { height: 54px; background: transparent; border-bottom: 0; padding: 8px 12px 0; pointer-events: none; }
  .hud-bar span { pointer-events: auto; font: 700 24px/1 'Fredoka', sans-serif; color: #1d2b4a; padding: 7px 16px 6px; background: rgba(255,255,255,.92);
    border-radius: 999px; box-shadow: 0 3px 0 rgba(29,43,74,.18); font-variant-numeric: tabular-nums; }
  .hud-bar button { pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; padding: 0; display: grid; place-items: center;
    background: rgba(255,255,255,.92); border: 0; box-shadow: 0 3px 0 rgba(29,43,74,.18); }
  .hud-bar button svg { width: 16px; height: 16px; fill: #1d2b4a; }
  #overlay { background: rgba(15,24,48,.55); }
  #overlay > * { position: relative; z-index: 1; }
  #overlay::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(80%, 320px); height: 270px; transform: translate(-50%, -52%);
    background: #fff; border-radius: 26px; box-shadow: 0 8px 0 rgba(29,43,74,.25), 0 20px 40px rgba(0,0,0,.3); }
  #overlayTitle { font: 700 30px/1 'Fredoka', sans-serif; color: #1d2b4a; }
  #overlayScores { font: 500 19px/1.5 'Fredoka', sans-serif; color: #3e6fd8; }
  #overlayMsg { font: 500 14px/1.3 'Fredoka', sans-serif; }
  #overlayBtn { font: 700 19px 'Fredoka', sans-serif; border-radius: 999px; padding: 11px 28px; background: #4cc04a; box-shadow: 0 4px 0 #2e8a2c; }
  #overlayBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2e8a2c; }
</style>
<link rel="stylesheet" href="js/styles/game-header.css">
<script src="js/core/game-header.js" defer></script>
</head>
<body>
<div class="page">
  <div id="gameArea">
    <div class="hud-bar">
      <span id="scoreVal">0</span>
      <button id="pauseBtn" aria-label="Пауза"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
    </div>
    <canvas id="game"></canvas>
    <div id="overlay">
      <div id="overlayTitle">ГРА ЗАКІНЧЕНА</div>
      <div id="overlayScores">Рахунок: 0<br/>Рекорд: 0</div>
      <div id="overlayMsg"></div>
      <button id="overlayBtn">Нова гра</button>

  </div>
</div>

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.height = H + 'px';

    jetpack: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40">
        <rect x="2" y="10" width="28" height="20" rx="3" fill="#4a5568"/>
        <rect x="4" y="4" width="10" height="28" rx="5" fill="#e53e3e" stroke="#9b2c2c" stroke-width="1.5"/>

  };

  function svgToImage(svgString) {
    const img = new Image();
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
    return img;
  }
  const ASSETS = {};
  for (const key in ASSET_SVG) ASSETS[key] = svgToImage(ASSET_SVG[key]);

  const JETPACK_UNLOCK_SCORE = 500;
  const SPRING_UNLOCK_SCORE = 200;
  const ENEMY_UNLOCK_SCORE = 600;
  const JETPACK_DURATION = 1.3;
  const JETPACK_VY = -900;
  const JETPACK_PERIOD_MIN = 260, JETPACK_PERIOD_MAX = 520;
  const SPRING_BOUNCE_MULT = 1.6;
  const SPRING_CHANCE = 0.15;
  const ENEMY_R = 18;
  const ENEMY_SPAWN_CHANCE = 0.12;
  // постріли: жабка сама стріляє насінинами в найближчого монстра над собою
  const SHOT_PERIOD = 0.65, SHOT_SPEED = 950, SHOT_RANGE = 300, KILL_BONUS = 50;

  let best = 0;
  try {
    const s = localStorage.getItem('doodleBest');
    if (s) best = parseInt(s, 10) || 0;
  } catch (e) {}

  const rootStyle = getComputedStyle(document.documentElement);
  const COLORS = {
    normal: [rootStyle.getPropertyValue('--platform').trim(), rootStyle.getPropertyValue('--platform-dark').trim()],
    move: [rootStyle.getPropertyValue('--platform-move').trim(), rootStyle.getPropertyValue('--platform-move-dark').trim()],
    break: [rootStyle.getPropertyValue('--platform-break').trim(), rootStyle.getPropertyValue('--platform-break-dark').trim()],
  };

  let player, platforms, camTop, score, phase, moveDir, touchDir, sparkles, enemies, jetpackTimer, nextJetpackScore, landT = 0, dust = [], T = 0, shots = [], shotT = 0, bonus = 0, height = 0, booms = [], shake = 0;
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function heightScore(y) {
    return Math.max(0, Math.floor((H - 140 - y) / 8));
  }

  function resetGame() {
    player = { x: W / 2, y: H - 140, vx: 0, vy: -JUMP_V, r: PLAYER_R, facing: 1 };
    camTop = 0;
    score = 0;
    phase = 'playing';
    moveDir = 0;
    touchDir = 0;
    jetpackTimer = 0;
    nextJetpackScore = JETPACK_UNLOCK_SCORE + JETPACK_PERIOD_MIN + Math.random() * (JETPACK_PERIOD_MAX - JETPACK_PERIOD_MIN);
    platforms = [];
    sparkles = [];
    enemies = [];
    dust = [];
    landT = 0;
    shots = []; shotT = 0; bonus = 0; height = 0; booms = []; shake = 0;

    platforms.push(makePlatform(W / 2 - PLATFORM_W / 2, H - 90, 'normal'));
    let y = H - 90;
    while (y > -H * 1.5) {
      y -= MIN_GAP + Math.random() * (MAX_GAP - MIN_GAP);
      spawnPlatformAt(y);
    }
    scoreVal.textContent = '0';
    hideOverlay();
  }

  function pickType() {
    const r = Math.random();
    if (r < 0.18) return 'break';
    if (r < 0.36) return 'move';
    return 'normal';
  }

  function makePlatform(x, y, type) {
    const p = { x, y, w: PLATFORM_W, h: PLATFORM_H, type, alive: true, breakT: 0 };
    if (type === 'move') {
      const desiredRange = 30 + Math.random() * 50;
      const minX = 4 + desiredRange;
      const maxX = (W - p.w - 4) - desiredRange;
      if (maxX > minX) {
        p.baseX = Math.min(Math.max(x, minX), maxX);
        p.range = desiredRange;
      } else {
        p.baseX = (W - p.w) / 2;
        p.range = Math.max(0, (W - p.w - 8) / 2);
      }
      p.x = p.baseX;
      p.speed = 0.7 + Math.random() * 0.6;
      p.phase = Math.random() * Math.PI * 2;
    }

  function makeEnemy(x, y, kind) {

      phase: Math.random() * Math.PI * 2,

  }

  function spawnPlatformAt(y) {
    const type = pickType();

    const p = makePlatform(px, y, type);
    const hs = heightScore(y);

    if (type === 'normal') {

  function ensurePlatformsAbove() {

      spawnPlatformAt(minY);
    }
  }

  function cullPlatforms() {
    platforms = platforms.filter((p) => p.alive && p.y - camTop < H + 80);
  }

  }

  function killEnemy(en) {

    overlayBtn.textContent = 'Нова гра';
    overlay.style.display = 'flex';

    if (window.AppScore) window.AppScore.sendScore('doodle', score);

  function hideOverlay() { overlay.style.display = 'none'; }

    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      cloud(c.x * (W + 80) - 60, y, c.s, ca);

  }

  function drawPlatform(p) {

    if (sy < -40 || sy > H + 40) return;
    const breaking = p.type === 'break' && p.breakT > 0;
    const k = breaking ? 1 - Math.max(0, p.breakT / 0.18) : 0;
    ctx.save();
    if (p.type === 'break') {

  }

  }

      outlined(() => { ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); }, '#8b3fd6', '#240046');
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.5, r * 0.3, r * 0.16, -0.5, 0, 6.283); ctx.fill();
      enemyEyes(r, look, false);
      ctx.fillStyle = '#240046'; ctx.beginPath(); ctx.moveTo(-r * 0.45, r * 0.35); ctx.quadraticCurveTo(0, r * 0.75, r * 0.45, r * 0.35); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * r * 0.3, r * 0.37); ctx.lineTo(sd * r * 0.2, r * 0.5); ctx.lineTo(sd * r * 0.1, r * 0.4); ctx.fill(); }
    }
    ctx.restore();
  }
  function drawShots() {
    for (const sh of shots) { const y = sh.y - camTop, a = Math.atan2(sh.vy, sh.vx);
      ctx.save(); ctx.translate(sh.x, y); ctx.rotate(a);
      ctx.fillStyle = 'rgba(255,240,150,.35)'; ctx.beginPath(); ctx.ellipse(-8, 0, 12, 4, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#7ad04f'; ctx.strokeStyle = '#2f5e1f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, 6, 4, 0, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.restore(); }
  }
  function drawBooms() {
    ctx.textAlign = 'center';
    for (const b of booms) { const k = b.t / 0.7, y = b.y - camTop;
      if (!b.small) { ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4 * (1 - k); ctx.beginPath(); ctx.arc(b.x, y, 10 + k * 40, 0, 6.283); ctx.stroke();
        for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283; ctx.fillStyle = ['#8b3fd6', '#e0485f', '#8aa0b4', '#ffe066'][i % 4]; ctx.beginPath(); ctx.arc(b.x + Math.cos(a) * k * 46, y + Math.sin(a) * k * 46, 4 * (1 - k), 0, 6.283); ctx.fill(); }
        ctx.font = "700 18px 'Fredoka', sans-serif"; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,30,50,.7)'; ctx.strokeText('+' + KILL_BONUS, b.x, y - 20 - k * 30); ctx.fillStyle = '#ffe066'; ctx.fillText('+' + KILL_BONUS, b.x, y - 20 - k * 30); }
      else { ctx.globalAlpha = 1 - k; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, y, 6 + k * 14, 0, 6.283); ctx.fill(); }
      ctx.globalAlpha = 1; }
    ctx.textAlign = 'left';
  }

  function spawnSparkles(worldX, worldY) {
    const n = 3;
    for (let i = 0; i < n; i++) {
      sparkles.push({
        x: worldX + (Math.random() - 0.5) * 40,
        y: worldY + (Math.random() - 0.5) * 18 - 6,
        life: 0,
        maxLife: 0.3 + Math.random() * 0.15,
        size: 3 + Math.random() * 3,
      });
    }
  }

  function drawStarShape(cx, cy, r) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.quadraticCurveTo(cx, cy, cx + r, cy);
    ctx.quadraticCurveTo(cx, cy, cx, cy + r);
    ctx.quadraticCurveTo(cx, cy, cx - r, cy);
    ctx.quadraticCurveTo(cx, cy, cx, cy - r);
    ctx.closePath();
    ctx.fill();
  }

  function drawSparkles() {
    ctx.save();
    ctx.fillStyle = '#ffe066';
    for (const s of sparkles) {
      const t = s.life / s.maxLife;
      ctx.globalAlpha = Math.max(0, 1 - t);
      drawStarShape(s.x, s.y - camTop, s.size * (1 - t * 0.3));
    }
    ctx.restore();
  }

  function drawMotionLines() {
    const speed = Math.hypot(player.vx, player.vy);
    const THRESH = 260;
    if (speed < THRESH) return;
    const intensity = Math.min(1, (speed - THRESH) / 500);
    const dirX = -player.vx / speed;
    const dirY = -player.vy / speed;
    const perpX = -dirY, perpY = dirX;

    ctx.save();
    ctx.strokeStyle = '#2f5e1f';
    ctx.lineCap = 'round';
    const marks = 3;
    for (let i = 0; i < marks; i++) {
      const spread = (i - (marks - 1) / 2) * 9;
      const dist = PLAYER_R + 8 + i * 7;
      const cx = dirX * dist + perpX * spread;
      const cy = dirY * dist + perpY * spread;
      const len = 9 + intensity * 9;
      ctx.globalAlpha = (0.55 - i * 0.15) * intensity;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + dirX * len, cy + dirY * len);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawJetpackFlame() {
    if (jetpackTimer <= 0) return;

    const flicker = 0.7 + Math.random() * 0.3;
    const jpW = 20;
    const jpH = 26;

    const flameX = (player.facing === 1) ? -PLAYER_R - 8 + jpW / 2 : PLAYER_R - 12 + jpW / 2;
    const flameY = jpH / 2;

    ctx.save();
    ctx.fillStyle = '#f5c542';
    ctx.beginPath();
    ctx.moveTo(flameX - 7, flameY);
    ctx.lineTo(flameX, flameY + 18 * flicker);
    ctx.lineTo(flameX + 7, flameY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#e0522f';
    ctx.beginPath();
    ctx.moveTo(flameX - 4, flameY);
    ctx.lineTo(flameX, flameY + 10 * flicker);
    ctx.lineTo(flameX + 4, flameY);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawPlayer() {
    const sy = player.y - camTop;
    ctx.save();
    ctx.translate(player.x, sy);

    drawMotionLines();

    const vy = player.vy || 0; 
    let scaleX = 1;
    let scaleY = 1;

    if (landT > 0 && !reduceMotion) { const q = landT / 0.14; scaleX = 1 + 0.22 * q; scaleY = 1 - 0.2 * q; }
    else if (vy < -3) { 
      scaleX = 0.92;
      scaleY = 1.08;
    } else if (vy > 3) { 
      scaleX = 1.04;
      scaleY = 0.96;
    }

    // Джетпак
    if (jetpackTimer > 0) {
      const jpW = 22;
      const jpH = 28;
      const jpX = (player.facing === 1) ? -PLAYER_R - 12 : PLAYER_R - 10;
      const jpY = -jpH / 2;

      drawJetpackFlame();

      const imgJp = ASSETS.jetpack;
      if (imgJp && imgJp.complete) {
        ctx.save();
        if (player.facing === -1) {
          ctx.translate(jpX + jpW / 2, jpY + jpH / 2);
          ctx.scale(-1, 1);
          ctx.drawImage(imgJp, -jpW / 2, -jpH / 2, jpW, jpH);
        } else {
          ctx.drawImage(imgJp, jpX, jpY, jpW, jpH);
        }
        ctx.restore();
      }
    }

    // Тіло
    ctx.save();
    ctx.scale(scaleX, scaleY);

    const imgBody = ASSETS.playerBody;
    const size = PLAYER_R * 2.4;
    if (imgBody && imgBody.complete) {
      ctx.save();
      if (player.facing === -1) {
        ctx.scale(-1, 1);
      }
      // темний «ореол» + тінь — герой читається і на світлому небі, і на темному
      ctx.shadowColor = 'rgba(12,30,10,.55)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
      ctx.drawImage(imgBody, -size / 2, -size / 2, size, size);
      ctx.shadowColor = 'transparent';
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,120,120,.45)';
    ctx.beginPath(); ctx.ellipse(-13 + player.facing * 2, 6, 4, 2.5, 0, 0, 6.283); ctx.ellipse(13 + player.facing * 2, 6, 4, 2.5, 0, 0, 6.283); ctx.fill();

    // Очі
    // Очі
    const eyeDx = 6 * player.facing;
    let eyeDy = -4; 
    if (vy < -2) eyeDy = -9;
    if (vy > 2)  eyeDy = 2;

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#2f5e1f';
    ctx.lineWidth = 2.5;

    // Ліве око
    ctx.beginPath(); ctx.arc(-8 + eyeDx * 0.3, eyeDy, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // Праве око
    ctx.beginPath(); ctx.arc(6 + eyeDx * 0.3, eyeDy, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // Зіниці
    ctx.fillStyle = '#23261f';
    ctx.beginPath(); ctx.arc(-7 + eyeDx * 0.6, eyeDy + (vy < -2 ? -1.5 : vy > 2 ? 1.5 : 0), 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7 + eyeDx * 0.6, eyeDy + (vy < -2 ? -1.5 : vy > 2 ? 1.5 : 0), 2.8, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
    ctx.restore();
  }

  function drawDust() {
    for (const d of dust) { ctx.fillStyle = `rgba(255,255,255,${d.l * 1.6})`; ctx.beginPath(); ctx.arc(d.x, d.y - camTop - 3, 4 + (0.4 - d.l) * 14, 0, 6.283); ctx.fill(); }
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBackground();
    for (const p of platforms) drawPlatform(p);
    drawDust();
    for (const en of enemies) if (en.alive) drawEnemy(en);
    drawShots();
    drawBooms();
    drawSparkles();
    drawPlayer();
    ctx.restore();
  }

  // для автотестів
  window.DoodleGame = { get player() { return player; }, get enemies() { return enemies; }, get shots() { return shots; }, get score() { return score; }, get bonus() { return bonus; }, get phase() { return phase; },
    get camTop() { return camTop; }, spawn: (kind, dx, dy) => { const en = makeEnemy(player.x + (dx || 0), player.y + (dy || -150), kind); if (kind !== 'bat' && kind !== 'spike') { en.range = 0; en.baseX = en.x; } enemies.push(en); return en; } };
  let lastT = null;
  function loop(t) {
    if (lastT === null) lastT = t;
    const dt = Math.min((t - lastT) / 1000, 0.033);
    lastT = t;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function togglePause() {
    if (phase === 'playing') {
      phase = 'paused';
      overlayTitle.textContent = 'ПАУЗА';
      overlayScores.innerHTML = `Рахунок: ${score}<br/>Рекорд: ${best}`;
      overlayMsg.textContent = '';
      overlayBtn.textContent = 'Продовжити';
      overlay.style.display = 'flex';
    } else if (phase === 'paused') {
      phase = 'playing';
      hideOverlay();
    }
  }

  pauseBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); togglePause(); });
  pauseBtn.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

  overlayBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (phase === 'paused') { phase = 'playing'; hideOverlay(); }
    else resetGame();
  });
  overlayBtn.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

  function touchXToDir(clientX) {
    const rect = gameAreaEl.getBoundingClientRect();
    const localX = clientX - rect.left;
    return localX < W / 2 ? -1 : 1;
  }
  canvas.addEventListener('touchstart', (e) => {
    touchDir = touchXToDir(e.touches[0].clientX);
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    touchDir = touchXToDir(e.touches[0].clientX);
  }, { passive: true });
  canvas.addEventListener('touchend', () => { touchDir = 0; }, { passive: true });
  canvas.addEventListener('touchcancel', () => { touchDir = 0; }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft') moveDir = -1;
    else if (e.code === 'ArrowRight') moveDir = 1;
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' && moveDir === -1) moveDir = 0;
    else if (e.code === 'ArrowRight' && moveDir === 1) moveDir = 0;
  });

  document.addEventListener('selectstart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  resetGame();
  requestAnimationFrame(loop);
})();
