<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Витягни шпильку</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../../vendor/fonts/lilita-one.css"><link rel="stylesheet" href="../../vendor/fonts/rubik.css">
<style>
/* Layout: one canvas holds the dungeon tank scaled to fit; HUD row on top; tip line under the tank; centered card for start/win/lose.
   Single torch-lit dungeon look in both themes. */
:root{
  --stone:#2A3445; --deep:#141A24; --ink:#1B1410; --paper:#FFF6E6;
  --gold:#FFC23D; --gold-deep:#B9780C; --lava:#FF6A1F; --water:#3FA7FF;
  --display:'Lilita One','Arial Black',Impact,sans-serif;
  --body:'Rubik',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--deep);color:var(--paper);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px}
.chip{font-family:var(--display);font-size:17px;letter-spacing:.02em;background:rgba(0,0,0,.45);color:var(--paper);padding:6px 11px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.lv{flex:1}
.chip.coins{color:var(--gold);font-variant-numeric:tabular-nums}
.icon{font-family:var(--display);font-size:18px;background:rgba(0,0,0,.45);color:var(--paper);border:0;border-radius:10px;width:40px;height:34px;cursor:pointer}
.icon:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.tip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);text-align:center;font-size:14px;opacity:.75;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(8,10,16,.55)}
.card{background:var(--paper);color:var(--ink);border-radius:20px;padding:26px 22px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.35);display:grid;gap:12px}
.card h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;margin:0;color:var(--gold-deep);text-wrap:balance}
.card h1.lose{color:#C2361B}
.card p{margin:0;font-size:15px;line-height:1.45}
.card .hint{font-size:13px;opacity:.7}
.btn{font-family:var(--display);font-size:22px;letter-spacing:.02em;background:var(--gold);color:var(--ink);border:0;border-radius:14px;padding:13px 30px;box-shadow:0 5px 0 var(--gold-deep);cursor:pointer;justify-self:center;margin-top:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.stars{display:flex;justify-content:center;gap:6px;margin:2px 0}
.stars svg{width:42px;height:42px}
.stars svg.on{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.stars svg:nth-child(2).on{animation-delay:.15s}.stars svg:nth-child(3).on{animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.stars svg.on{animation:none}}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.lvbtn{font-family:var(--display);font-size:20px;border:0;border-radius:12px;padding:8px 0 6px;background:#F3E3C3;color:var(--ink);cursor:pointer;display:grid;justify-items:center;gap:2px}
.lvbtn.cur{outline:3px solid var(--gold-deep)}
.lvbtn:disabled{opacity:.35;cursor:default}
.lvbtn .mini{display:flex;gap:1px}.lvbtn .mini svg{width:12px;height:12px}
.icon svg{width:18px;height:18px;vertical-align:-3px}
</style>
</head>
<body>


<canvas id="c"></canvas>
<div class="hud">
  <span class="chip lv" id="lvName">Рівень 1</span>
  <span class="chip coins" id="coins">0/0</span>
  <button class="icon" id="levels" type="button" aria-label="Вибір рівня"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
  <button class="icon" id="restart" type="button" aria-label="Почати рівень заново">↻</button>
</div>
<div class="tip" id="tip"></div>
<div class="overlay" id="ov">
  <div class="card">
    <h1 id="ovTitle">Витягни шпильку</h1>
    <div class="stars" id="ovStars" hidden></div>
    <p id="ovText">Та сама гра з реклами, де лицар чекає на золото, а лава чекає на лицаря.</p>
    <p class="hint" id="ovHint">Торкнись шпильки, щоб витягти її. Вода й лава стають каменем, лава спалює монстрів. Порядок важливий.</p>
    <button class="btn" id="ovBtn" type="button">Грати</button>
  </div>
</div>
<div class="overlay" id="lvSel" hidden>
  <div class="card">
    <h1>Рівні</h1>
    <div class="lvgrid" id="lvGrid"></div>
    <button class="btn" id="lvClose" type="button">Назад</button>
  </div>
</div>

<script src="pinsim.js" charset="utf-8"></script>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const {Sim,LEVELS,R}=PinSim;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,S=1,OX=0,OY=0;
function resize(){
  const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  const top=58,bot=34;S=Math.min(W/360,(H-top-bot)/650);OX=(W-360*S)/2;OY=top+((H-top-bot)-650*S)/2-60*S;
}
addEventListener('resize',resize);resize();

let lvl=0,sim=null,state='menu',T=0,fx=[],endT=0,stars={},maxLvl=0;
try{lvl=Math.min(LEVELS.length-1,Math.max(0,parseInt(localStorage.getItem('pin_level'))||0));stars=JSON.parse(localStorage.getItem('pin_stars'))||{};maxLvl=Math.max(lvl,parseInt(localStorage.getItem('pin_max'))||0)}catch(e){}
/* зірки: скільки золота з усього, що було на рівні, дісталося лицарю */
const starSvg=(on,cls)=>`<svg viewBox="0 0 24 24" class="${cls||''}"><path d="M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.9l-5.8 3.2 1.4-6.4-4.9-4.4 6.5-.7z" fill="${on?'#FFC23D':'#D9C7A3'}" stroke="${on?'#B9780C':'#B8A47E'}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
function starsFor(s){const k=s.got/Math.max(1,s.gold);return k>=0.85?3:k>=0.65?2:1}
function openLevels(){
  $('lvGrid').innerHTML=LEVELS.map((L,i)=>`<button class="lvbtn${i===lvl?' cur':''}" data-i="${i}" ${i>maxLvl?'disabled':''} aria-label="Рівень ${i+1}">${i+1}<span class="mini">${[0,1,2].map(k=>starSvg(k<(stars[i]||0))).join('')}</span></button>`).join('');
  $('lvSel').hidden=false;
}
$('levels').addEventListener('click',openLevels);
$('lvClose').addEventListener('click',()=>{$('lvSel').hidden=true});
$('lvGrid').addEventListener('click',e=>{const b=e.target.closest('.lvbtn');if(!b||b.disabled)return;$('lvSel').hidden=true;load(+b.dataset.i)});

function load(i){
  lvl=i;sim=new Sim(i);fx=[];endT=0;state='play';$('ov').hidden=true;$('ovStars').hidden=true;
  $('lvName').textContent='Рівень '+(i+1)+' · '+LEVELS[i].name;$('tip').textContent=LEVELS[i].tip;updCoins();
}
function updCoins(){$('coins').textContent=Math.min(sim.got,sim.target)+'/'+sim.target}
$('restart').addEventListener('click',()=>{if(sim)load(lvl)});
$('ovBtn').addEventListener('click',()=>{
  if(state==='won'){if(lvl+1<LEVELS.length)load(lvl+1);else load(0)}else load(lvl);
});

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  const x=(e.clientX-OX)/S,y=(e.clientY-OY)/S;let best=-1,bd=30;
  sim.pins.forEach((p,i)=>{if(p.state!=='in')return;
    const hx=p.x2+p.ux*14,hy=p.y2+p.uy*14,dh=Math.hypot(x-hx,y-hy);
    const dx=p.x2-p.x1,dy=p.y2-p.y1,l=dx*dx+dy*dy;let t=((x-p.x1)*dx+(y-p.y1)*dy)/l;t=Math.max(0,Math.min(1,t));
    const ds=Math.hypot(x-(p.x1+dx*t),y-(p.y1+dy*t));const d=Math.min(dh,ds+4);if(d<bd){bd=d;best=i}});
  if(best>=0){sim.pull(best);hint=false}
});
let hint=true;

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
  if(sim&&(state==='play'||state==='lost'||state==='won')){acc+=dt;let n=0;while(acc>=1/120&&n<8){sim.step(1/120);acc-=1/120;n++}if(n>=8)acc=0;handleEvents()}
  for(const f of fx){f.l-=dt;f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt;if(f.g)f.vy+=f.g*dt}fx=fx.filter(f=>f.l>0);
  draw();requestAnimationFrame(frame);
}
function handleEvents(){
  for(const e of sim.events){
    if(e.e==='coin'){fx.push({k:'txt',t:'+1',x:e.x,y:e.y-10,vy:-50,l:0.8});if(!reduce)for(let i=0;i<3;i++){const a=Math.random()*6.283;fx.push({k:'spark',x:e.x,y:e.y,vx:Math.cos(a)*70,vy:Math.sin(a)*70-40,g:200,l:0.5})}updCoins()}
    else if(e.e==='steam'&&Math.random()<0.5)for(let i=0;i<2;i++)fx.push({k:'puff',x:e.x,y:e.y,vx:(Math.random()-.5)*40,vy:-30-Math.random()*40,l:0.9,r:6+Math.random()*6});
    else if(e.e==='monster')for(let i=0;i<14;i++)fx.push({k:'puff',x:e.x+(Math.random()-.5)*30,y:e.y+(Math.random()-.5)*30,vx:(Math.random()-.5)*60,vy:-40-Math.random()*40,l:1.2,r:8+Math.random()*10,c:'rgba(60,40,40,'});
    else if(e.e==='lose'){state='lost';endT=0;setTimeout(()=>showEnd(false,e.r),1100)}
    else if(e.e==='win'){state='won';const st=starsFor(sim);stars[lvl]=Math.max(stars[lvl]||0,st);maxLvl=Math.max(maxLvl,Math.min(LEVELS.length-1,lvl+1));
      try{localStorage.setItem('pin_level',Math.min(LEVELS.length-1,lvl+1));localStorage.setItem('pin_stars',JSON.stringify(stars));localStorage.setItem('pin_max',maxLvl)}catch(_){};
      for(let i=0;i<60;i++)fx.push({k:'conf',x:180+(Math.random()-.5)*200,y:120,vx:(Math.random()-.5)*220,vy:-Math.random()*200,g:420,l:2.2,c:['#FFC23D','#3FA7FF','#FF6A1F','#7BE07B','#FFFFFF'][i%5],r:Math.random()*6});
      setTimeout(()=>showEnd(true),1200)}
  }
  sim.events.length=0;
}
function showEnd(won,r){
  $('ov').hidden=false;$('ovTitle').classList.toggle('lose',!won);$('ovHint').hidden=true;
  if(won){const st=starsFor(sim);$('ovStars').innerHTML=[0,1,2].map(k=>starSvg(k<st,k<st?'on':'')).join('');$('ovStars').hidden=false;}else $('ovStars').hidden=true;
  if(won){const last=lvl+1>=LEVELS.length;$('ovTitle').textContent=last?'Усі скарби твої':'Скарб зібрано';
    $('ovText').textContent=last?'Ти пройшов усі '+LEVELS.length+' рівнів. Можна почати спочатку.':'Лицар забрав '+sim.got+' з '+sim.gold+' монет.'+(starsFor(sim)<3?' Збери більше — буде три зірки.':' Ідеально!');$('ovBtn').textContent=last?'Спочатку':'Далі'}
  else{$('ovTitle').textContent=r==='lava'?'Лава!':'Монстр!';
    $('ovText').textContent=r==='lava'?'Лава дісталася лицаря. Спробуй спершу перетворити її на камінь.':'Монстр дістався лицаря. Розберися з ним, перш ніж відчиняти шлях.';$('ovBtn').textContent='Ще раз'}
  setTimeout(()=>$('ovBtn').focus({preventScroll:true}),50);
}

/* ---------- drawing ---------- */
const COL={gold:['#FFD54A','#C98A12'],lava:['#FF7A22','#E0420E'],water:['#46AFFF','#1F78D6'],stone:['#8A8F99','#5E636D']};
function bricks(x,y,w,h,base,line){
  ctx.fillStyle=base;ctx.fillRect(x,y,w,h);ctx.strokeStyle=line;ctx.lineWidth=1;ctx.beginPath();
  for(let r=0,yy=y;yy<y+h;yy+=18,r++){ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);for(let xx=x+(r&1?18:0);xx<x+w;xx+=36){ctx.moveTo(xx,yy);ctx.lineTo(xx,Math.min(y+h,yy+18))}}
  ctx.stroke();
}
function wallRect(w){
  const g=ctx.createLinearGradient(0,w.y,0,w.y+w.h);g.addColorStop(0,'#7D869A');g.addColorStop(1,'#5A6273');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(w.x,w.y,w.w,w.h,3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(w.x+1,w.y+1,w.w-2,3);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(w.x+1,w.y+w.h-3,w.w-2,2);
}
function drawPin(p){
  const [x1,y1,x2,y2]=sim.pinSeg(p),hx=x2+p.ux*14,hy=y2+p.uy*14;
  ctx.lineCap='round';
  ctx.strokeStyle='#6E4A08';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const g=ctx.createLinearGradient(x1-p.uy*5,y1+p.ux*5,x1+p.uy*5,y1-p.ux*5);g.addColorStop(0,'#FFE58A');g.addColorStop(0.5,'#F2B52A');g.addColorStop(1,'#B9780C');
  ctx.strokeStyle=g;ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1-p.uy*2,y1+p.ux*2);ctx.lineTo(x2-p.uy*2,y2+p.ux*2);ctx.stroke();
  ctx.strokeStyle='#6E4A08';ctx.lineWidth=8;ctx.beginPath();ctx.arc(hx,hy,10,0,6.283);ctx.stroke();
  ctx.strokeStyle='#F2B52A';ctx.lineWidth=5;ctx.beginPath();ctx.arc(hx,hy,10,0,6.283);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(hx,hy,10,3.6,5.2);ctx.stroke();
}
function particles(){
  const ps=sim.ps;
  liquid(ps);
  for(const p of ps)if(p.t==='stone'){ctx.fillStyle=p.f>0?'#B9604A':'#7E838D';ctx.beginPath();ctx.roundRect(p.x-R,p.y-R,R*2,R*2,3);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(p.x-R+2,p.y-R+2,R,2)}
  for(const p of ps)if(p.t==='gold'){
    ctx.fillStyle='#A86E0A';ctx.beginPath();ctx.arc(p.x,p.y+1,R,0,6.283);ctx.fill();
    ctx.fillStyle='#FFC93C';ctx.beginPath();ctx.arc(p.x,p.y,R-0.5,0,6.283);ctx.fill();
    ctx.fillStyle='#FFE89A';ctx.beginPath();ctx.arc(p.x-1.5,p.y-1.5,R*0.45,0,6.283);ctx.fill();
  }
  if(!reduce){const ph=Math.floor(T*4);ctx.fillStyle='rgba(255,255,255,.9)';let i=0;
    for(const p of ps)if(p.t==='gold'&&(i++*7+ph)%29===0){const k=1-((T*4)%1);ctx.fillRect(p.x-0.6,p.y-4*k,1.2,8*k);ctx.fillRect(p.x-4*k,p.y-0.6,8*k,1.2)}}
}
/* liquids as one surface: splat drops into a coarse density field, threshold it, upscale smoothly */
const FC=3,FX=40,FY=60,FW=94,FH=188,fcv=document.createElement('canvas');fcv.width=FW;fcv.height=FH;
const fctx=fcv.getContext('2d'),img=fctx.createImageData(FW,FH),fWat=new Float32Array(FW*FH),fLav=new Float32Array(FW*FH);
const KR=13.5,KC=Math.ceil(KR/FC);
function liquid(ps){
  fWat.fill(0);fLav.fill(0);let any=false;
  for(const p of ps){if(p.t!=='water'&&p.t!=='lava')continue;any=true;
    const F=p.t==='water'?fWat:fLav,gx=(p.x-FX)/FC,gy=(p.y-FY)/FC,ix=Math.round(gx),iy=Math.round(gy);
    for(let y=iy-KC;y<=iy+KC;y++){if(y<0||y>=FH)continue;for(let x=ix-KC;x<=ix+KC;x++){if(x<0||x>=FW)continue;
      const dx=(x-gx)*FC,dy=(y-gy)*FC,q=1-(dx*dx+dy*dy)/(KR*KR);if(q>0)F[y*FW+x]+=q*q}}}
  if(!any)return;
  const d=img.data,ph=reduce?0:T*2.2;
  for(let y=0;y<FH;y++)for(let x=0;x<FW;x++){
    const i=y*FW+x,w=fWat[i],l=fLav[i],t=Math.max(w,l),o=i*4;
    if(t<0.42){d[o+3]=0;continue}
    const a=Math.min(1,(t-0.42)/0.22),lava=l>w,F=lava?fLav:fWat,above=y>2?F[i-2*FW]:0,surf=above<0.55;
    let r,g,b;
    if(lava){const n=0.5+0.5*Math.sin(x*0.45+ph)*Math.sin(y*0.38-ph*0.7);
      if(surf){r=255;g=190;b=70}else{r=232+n*23;g=70+n*70;b=18+n*20}}
    else{const n=0.5+0.5*Math.sin(x*0.3-ph*0.6+y*0.12);
      if(surf){r=170;g=225;b=255}else{r=38+n*20;g=132+n*30;b=232+n*15}}
    d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=a*255;
  }
  fctx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;ctx.drawImage(fcv,FX,FY,FW*FC,FH*FC);
}
function lavaGlow(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of sim.ps)if(p.t==='lava'&&((p.x+p.y)|0)%3===0){const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,26);g.addColorStop(0,'rgba(255,110,30,.16)');g.addColorStop(1,'rgba(255,110,30,0)');ctx.fillStyle=g;ctx.fillRect(p.x-26,p.y-26,52,52)}
  ctx.restore();
}
function knight(h){
  const x=h.x+h.w/2,y=h.y+h.h,won=state==='won',burnt=!h.alive;
  const jump=won&&!reduce?-Math.abs(Math.sin(T*8))*14:0,shake=sim.state==='play'&&nearLava()&&!reduce?Math.sin(T*50)*1.2:0;
  ctx.save();ctx.translate(x+shake,y+jump);
  if(sim.reason==='monster')ctx.rotate(-1.2*Math.min(1,endT*3));
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,-jump,16,4,0,0,6.283);ctx.fill();
  const body=burnt?'#2B2B2B':'#2F7BFF',dark=burnt?'#151515':'#1A4DB3',skin=burnt?'#3A3A3A':'#F1C27D',steel=burnt?'#444':'#C3CAD4';
  ctx.fillStyle='#3A2A20';ctx.fillRect(-10,-12,7,12);ctx.fillRect(3,-12,7,12);
  ctx.fillStyle=body;ctx.strokeStyle=dark;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-13,-34,26,24,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#5A3A22';ctx.fillRect(-13,-15,26,4);ctx.fillStyle='#FFC23D';ctx.fillRect(-3,-16,6,6);
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-41,10,0,6.283);ctx.fill();
  ctx.fillStyle=steel;ctx.beginPath();ctx.arc(0,-43,11.5,Math.PI,0);ctx.lineTo(11.5,-41);ctx.lineTo(-11.5,-41);ctx.fill();
  ctx.fillStyle=burnt?'#333':'#1E5BD8';ctx.beginPath();ctx.ellipse(0,-57,3.5,6,0,0,6.283);ctx.fill();
  if(!burnt){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-39,2.6,0,6.283);ctx.arc(4,-39,2.6,0,6.283);ctx.fill();
