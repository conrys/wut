<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<script src="../../js/core/native.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Хутір</title>
<link rel="stylesheet" href="../../vendor/fonts/baloo-2.css"><link rel="stylesheet" href="../../vendor/fonts/rubik.css">
<style>
/* Хутір: нескінченне господарство. Соло — на телефоні, спільний — один хутір на компанію в RTDB (khutir/<код>). */
:root{
  --ink:#F4F1EA; --dim:#B9B3A6; --night:#14121A; --card:#1E1B25; --card2:#272330; --line:#36313F;
  --gold:#FFC93C; --green:#7BD389; --red:#FF6B6B; --sky:#59C3FF;
  --display:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Rubik',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#2E4A2A;color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
/* --- верх --- */
.hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;gap:6px;align-items:center;pointer-events:none}
.chip{pointer-events:auto;font-family:var(--display);font-weight:800;font-size:16px;line-height:1;background:rgba(12,10,16,.74);border:0;padding:9px 11px 7px;border-radius:12px;white-space:nowrap;display:flex;gap:5px;align-items:center}
.chip.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;justify-content:flex-start}
.chip.name span{overflow:hidden;text-overflow:ellipsis}
.chip.coins{color:var(--gold)}
.lvl{position:relative;overflow:hidden}
.lvl i{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);width:var(--w,0%);transition:width .4s}
.back{width:38px;justify-content:center;padding:9px 0 7px;text-decoration:none;color:var(--ink)}
.tipline{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);margin:0 auto;width:max-content;max-width:calc(100% - 32px);text-align:center;background:rgba(12,10,16,.7);font-size:14px;line-height:1.3;padding:7px 12px;border-radius:12px;pointer-events:none}
.place{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);margin:0 auto;width:max-content;max-width:calc(100% - 24px);display:flex;gap:8px;align-items:center;background:rgba(12,10,16,.85);padding:6px 6px 6px 14px;border-radius:14px;font-size:15px}
.place button{border:0;border-radius:10px;background:var(--card2);padding:8px 12px;font-size:14px}
/* --- низ --- */
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:6px;pointer-events:none}
.bb{pointer-events:auto;position:relative;border:0;border-radius:16px;background:rgba(20,18,26,.88);padding:8px 1px 7px;display:grid;gap:2px;justify-items:center;font-size:11px;min-width:0;overflow:hidden;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.bb b{font-size:24px;line-height:1;font-weight:400}
.bb:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.bb .dot{position:absolute;top:4px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:800;line-height:18px;padding:0 4px;box-sizing:border-box}
/* --- шторка --- */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:72vh;display:flex;flex-direction:column;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.45);transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom,0px);touch-action:pan-y}
.sheet.open{transform:none}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sh-h h2{margin:0;flex:1;font-family:var(--display);font-size:22px;line-height:1.1}
.sh-h .x{border:0;background:var(--card2);width:36px;height:36px;border-radius:12px;font-size:16px}
.sh-b{overflow-y:auto;padding:4px 16px 16px;display:grid;gap:8px;overscroll-behavior:contain}
.row{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:14px;padding:10px 12px;border:0;text-align:left;width:100%;box-sizing:border-box;font-size:14px}
.row .ic{font-size:28px;width:34px;text-align:center;flex:none}
.row .tx{flex:1;min-width:0;display:grid;gap:2px}
.row .tx b{font-size:16px}
.row .tx small{color:var(--dim);font-size:13px;line-height:1.3}
.row.off{opacity:.5}
.row .pr{font-family:var(--display);font-weight:800;color:var(--gold);white-space:nowrap;font-size:15px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 140px;border:0;border-radius:14px;padding:12px 10px 10px;font-family:var(--display);font-weight:800;font-size:16px;background:var(--gold);color:#241C05;box-shadow:0 4px 0 #A9811A}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 #0E0C12}
.btn.red{background:var(--red);color:#2A0808;box-shadow:0 4px 0 #9E3434}
.btn:disabled{opacity:.45;box-shadow:none}
.btn small{display:block;font-family:var(--body);font-weight:500;font-size:12px;opacity:.85}
.note{color:var(--dim);font-size:13px;line-height:1.4;margin:0}
.it{display:inline-flex;gap:2px;align-items:center;background:rgba(0,0,0,.25);border-radius:8px;padding:2px 6px;margin:1px 4px 1px 0;font-weight:600}
.it.ok{color:var(--green)}.it.no{color:var(--red)}
.sell{border:0;border-radius:10px;background:#3A3446;padding:7px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.sell:disabled{opacity:.35}
.cap{height:6px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:3px}
.cap i{display:block;height:100%;background:var(--green)}
.cap i.full{background:var(--red)}
/* --- меню --- */
.overlay{position:fixed;inset:0;display:grid;place-items:start center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(180deg,rgba(20,18,26,.55),rgba(20,18,26,.9))}
.card{margin-block:auto;width:100%;max-width:380px;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 18px 18px;display:grid;gap:10px;box-shadow:0 10px 0 rgba(0,0,0,.4)}
.card h1{margin:0;font-family:var(--display);font-size:42px;line-height:1;text-align:center}
.card .sub{margin:0 0 4px;text-align:center;color:var(--dim);font-size:14px;line-height:1.4}
.card h3{margin:8px 0 0;font-size:13px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.inp{display:flex;gap:8px}
.inp input{flex:1;min-width:0;background:#0F0D14;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:17px;padding:11px 12px;font-family:var(--body)}
.inp input.code{text-transform:uppercase;letter-spacing:.2em;font-family:var(--display);font-weight:800}
.inp .btn{flex:none}
.err{color:var(--red);font-size:14px;margin:0;text-align:center;min-height:0}
/* --- повідомлення --- */
.toast{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);margin:0 auto;width:max-content;max-width:calc(100% - 32px);text-align:center;background:rgba(12,10,16,.9);color:#fff;font-size:15px;line-height:1.35;padding:10px 16px;border-radius:14px;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.toast.bad{color:#FFC2C2}
.say{position:fixed;left:0;right:0;top:30%;text-align:center;font-family:var(--display);font-weight:800;font-size:46px;line-height:1.05;color:var(--gold);pointer-events:none;opacity:0;text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 24px rgba(0,0,0,.6);padding:0 16px}
.say small{display:block;font-size:18px;color:#fff;margin-top:8px;font-family:var(--body);font-weight:600}
.say.show{animation:say 2.6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes say{0%{opacity:0;transform:scale(.4)}10%{opacity:1;transform:scale(1.06)}18%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.say.show{animation:sayR 2.6s linear forwards}@keyframes sayR{0%,85%{opacity:1}100%{opacity:0}}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Карта хутора"></canvas>

<div class="hud" id="hud" hidden>
  <a class="chip back" href="../../index.html" aria-label="На головну">←</a>
  <button class="chip name" id="hName" aria-label="Меню хутора"><span id="hNameT">Хутір</span></button>
  <button class="chip" id="hOn" hidden aria-label="Хто зараз на хуторі">👥 <span id="hOnN">1</span></button>
  <div class="chip coins" id="hCoins">💰 0</div>
  <button class="chip lvl" id="hLvl" aria-label="Рівень хутора">⭐ <span id="hLvlN">1</span><i id="hLvlBar"></i></button>
</div>
<div class="tipline" id="tip" hidden></div>
<div class="place" id="place" hidden><span id="placeT">Обери місце</span><button id="placeX">Скасувати</button></div>

<div class="bar" id="bar" hidden>
  <button class="bb" id="bBuild"><b>🏗</b>Будувати</button>
  <button class="bb" id="bAll"><b>🧺</b>Зібрати<span class="dot" id="dAll" hidden></span></button>
  <button class="bb" id="bOrders"><b>📋</b>Замовлення<span class="dot" id="dOrders" hidden></span></button>
  <button class="bb" id="bStore"><b>📦</b>Комора</button>
  <button class="bb" id="bVill"><b>🧑‍🌾</b>Селянин</button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="shT">
  <div class="sh-h"><h2 id="shT"></h2><button class="x" id="shX" aria-label="Закрити">✕</button></div>
  <div class="sh-b" id="shB"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="say" id="say" aria-live="polite"></div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>🏡 Хутір</h1>
    <p class="sub">Сій, будуй, вари сир і медовуху. Хутір живе, навіть коли тебе нема: заходь коли хочеш — урожай чекатиме.</p>
    <button class="btn" id="mSolo">Мій хутір<small id="mSoloI">почати з одного поля</small></button>
    <h3>Спільний хутір</h3>
    <p class="note">Один хутір на всю компанію: спільні гроші, комора й замовлення. Кожен заходить, коли зручно.</p>
    <div id="mFarms" style="display:grid;gap:8px"></div>
    <div id="mNet" style="display:grid;gap:8px">
      <div class="inp"><input id="mNick" maxlength="16" placeholder="Твоє імʼя" autocomplete="off" aria-label="Твоє імʼя"></div>
      <button class="btn sec" id="mNew">＋ Створити спільний</button>
      <div class="inp"><input id="mCode" class="code" maxlength="6" placeholder="КОД" autocomplete="off" aria-label="Код хутора"><button class="btn sec" id="mJoin">Увійти</button></div>
      <p class="err" id="mErr"></p>
    </div>
    <p class="note" id="mOff" hidden>Без інтернету — лише свій хутір.</p>
  </div>
</div>

<script src="../../vendor/firebase/10.13.0/firebase-app-compat.js"></script>
<script src="../../vendor/firebase/10.13.0/firebase-auth-compat.js"></script>
<script src="../../vendor/firebase/10.13.0/firebase-database-compat.js"></script>
<script src="../../js/core/firebase-config.js"></script>
<script src="sim.js" charset="utf-8"></script>
<script src="game.js" charset="utf-8"></script>
<script src="../../js/core/back-button.js"></script>
</body>
</html>
