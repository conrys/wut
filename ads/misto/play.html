<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<script src="../../js/core/native.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Містечко</title>
<link rel="stylesheet" href="../../vendor/fonts/baloo-2.css"><link rel="stylesheet" href="../../vendor/fonts/rubik.css">
<style>
/* Містечко: виробництва, стрічки, жолоби й підйомники на терасах. Гра йде лише поки відкрита. */
:root{
  --ink:#1F2328; --dim:#5C636B; --paper:#FFFFFF; --panel:rgba(255,255,255,.94); --line:#DDE2E7;
  --accent:#2F7FD0; --accent-ink:#FFFFFF; --good:#2E9E5B; --bad:#D9423A;
  --display:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Rubik',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#9ED3F2;color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.chip{pointer-events:auto;font-family:var(--display);font-weight:800;font-size:15px;line-height:1;background:var(--panel);border:0;padding:9px 11px 7px;border-radius:12px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.back{text-decoration:none;color:var(--ink);width:36px;text-align:center;padding:9px 0 7px}
.chip.st{margin-left:auto}
.side{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 100px);display:grid;gap:8px}
.side button{width:44px;height:44px;border-radius:14px;border:0;background:var(--panel);font-size:20px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.tip,.mode{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);text-align:center;background:var(--panel);font-size:14px;line-height:1.35;padding:8px 12px;border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.tip{bottom:calc(env(safe-area-inset-bottom,0px) + 92px);pointer-events:none}
.mode{top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;gap:10px;align-items:center;text-align:left}
.mode button{border:0;border-radius:10px;background:#EEF1F4;padding:8px 12px;font-size:14px;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(7,1fr);gap:5px;pointer-events:none}
.tb{pointer-events:auto;border:0;border-radius:14px;background:var(--panel);padding:7px 0 6px;display:grid;gap:2px;justify-items:center;font-size:10.5px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.14);min-width:0;overflow:hidden}
.tb b{font-size:21px;line-height:1;font-weight:400}
.tb.on{background:var(--accent);color:var(--accent-ink)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:70vh;display:flex;flex-direction:column;background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom,0px);touch-action:pan-y}
.sheet.open{transform:none}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sh-h h2{margin:0;flex:1;font-family:var(--display);font-size:22px;line-height:1.1}
.sh-h .x{border:0;background:#EEF1F4;width:36px;height:36px;border-radius:12px;font-size:16px}
.sh-b{overflow-y:auto;padding:4px 16px 16px;display:grid;gap:8px;overscroll-behavior:contain}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card2{border:1px solid var(--line);background:#F7F9FB;border-radius:14px;padding:10px;display:grid;gap:3px;text-align:left;font-size:13px}
.card2 .ic{font-size:26px;line-height:1}.card2 b{font-size:15px}.card2 small{color:var(--dim);line-height:1.3}.card2 .pr{font-weight:700;font-size:13px}
.card2.off{opacity:.5}
.row{display:flex;gap:10px;align-items:center;background:#F7F9FB;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
.row .ic{font-size:26px;flex:none}.row .tx{display:grid;gap:2px;min-width:0}.row small{color:var(--dim);line-height:1.35}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 140px;border:0;border-radius:14px;padding:12px 10px 10px;font-family:var(--display);font-weight:800;font-size:16px;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 #1F5E9E}
.btn small{display:block;font-family:var(--body);font-weight:500;font-size:12px;opacity:.9}
.btn.sec{background:#EEF1F4;color:var(--ink);box-shadow:0 3px 0 #C8CED4}
.btn.red{background:var(--bad);box-shadow:0 3px 0 #9E2E28}
.btn:disabled{opacity:.45}
.note{color:var(--dim);font-size:13px;line-height:1.4;margin:0}
.toast{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);margin:0 auto;width:max-content;max-width:calc(100% - 32px);text-align:center;background:rgba(20,24,28,.9);color:#fff;font-size:15px;padding:10px 16px;border-radius:14px;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}.toast.bad{background:rgba(160,30,30,.92)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<canvas id="gl" aria-label="Карта міста"></canvas>
<div class="hud">
  <a class="chip back" href="../../index.html" aria-label="На головну">←</a>
  <div class="chip" id="hCu">🪙 0</div>
  <div class="chip" id="hPop" title="Вільні носії / усі жителі">👷 0/0</div>
  <div class="chip" id="hHp" title="Щастя міста">😐 0%</div>
  <button class="chip st" id="hSt" aria-label="Склад міста">🪵 0</button>
</div>
<div class="side"><button id="rotL" aria-label="Повернути камеру ліворуч">⟲</button><button id="rotR" aria-label="Повернути камеру праворуч">⟳</button></div>
<div class="mode" id="mode" hidden><span id="modeT"></span><button id="modeX">Готово</button></div>
<div class="tip" id="tip" hidden></div>
<div class="bar">
  <button class="tb" data-t="look"><b>👆</b>Огляд</button>
  <button class="tb" data-t="build"><b>🏗</b>Будувати</button>
  <button class="tb" data-t="belt"><b>➡</b>Стрічка</button>
  <button class="tb" data-t="chute"><b>⤵</b>Жолоб</button>
  <button class="tb" data-t="lift"><b>⏫</b>Підйом</button>
  <button class="tb" data-t="path"><b>🟫</b>Стежка</button>
  <button class="tb" data-t="erase"><b>🧹</b>Знести</button>
</div>
<div class="sheet" id="sheet" role="dialog" aria-labelledby="shT">
  <div class="sh-h"><h2 id="shT"></h2><button class="x" id="shX" aria-label="Закрити">✕</button></div>
  <div class="sh-b" id="shB"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../../vendor/firebase/10.13.0/firebase-app-compat.js"></script>
<script src="../../vendor/firebase/10.13.0/firebase-auth-compat.js"></script>
<script src="../../vendor/firebase/10.13.0/firebase-database-compat.js"></script>
<script src="../../js/core/firebase-config.js"></script>
<script src="../vendor/three.min.js"></script>
<script src="sim.js" charset="utf-8"></script>
<script src="game.js" charset="utf-8"></script>
<script src="../../js/core/back-button.js"></script>
</body>
</html>
