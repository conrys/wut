<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<script src="../../js/core/native.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Тісна парковка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../../vendor/fonts/bowlby-one.css"><link rel="stylesheet" href="../../vendor/fonts/rubik.css">
<style>
/* Layout: canvas holds a top-down parking lot ringed by road and grass; HUD row on top; centered card.
   Single sunny asphalt look in both themes. */
:root{
  --grass:#7CC35A; --asphalt:#4A4F5C; --ink:#17161C; --paper:#FFFDF5;
  --yellow:#FFD23F; --yellow-deep:#C99A00;
  --display:'Bowlby One','Arial Black',Impact,sans-serif;
  --body:'Rubik',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--grass);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px}
.chip{font-family:var(--display);font-size:17px;background:rgba(23,22,28,.78);color:var(--paper);padding:7px 12px 5px;border-radius:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.lv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip.left{background:var(--yellow);color:var(--ink)}
.icon{font-family:var(--display);font-size:19px;background:rgba(23,22,28,.78);color:var(--paper);border:0;border-radius:12px;width:42px;height:34px;cursor:pointer}
.icon:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(23,22,28,.35)}
.card{background:var(--paper);border-radius:22px;padding:24px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(23,22,28,.25);display:grid;gap:10px}
.card h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;margin:0;color:var(--ink);text-wrap:balance}
.card p{margin:0;font-size:15px;line-height:1.45}
.card .hint{font-size:13px;opacity:.7}
.btn{font-family:var(--display);font-size:20px;background:var(--yellow);color:var(--ink);border:0;border-radius:16px;padding:12px 30px 10px;box-shadow:0 5px 0 var(--yellow-deep);cursor:pointer;justify-self:center;margin-top:6px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--yellow-deep)}
</style>
</head>
<body>


<canvas id="c"></canvas>
<div class="hud">
  <span class="chip lv" id="lv">Рівень 1</span>
  <span class="chip left" id="left">0 / 0</span>
  <button class="icon" id="restart" type="button" aria-label="Почати рівень заново">↻</button>
</div>
<div class="overlay" id="ov">
  <div class="card">
    <h1 id="ovTitle">Тісна парковка</h1>
    <p id="ovText">Тебе підперли. Виведи червону машину до виїзду.</p>
    <p class="hint" id="ovHint">Тягни машини вздовж їхнього ряду, щоб звільнити дорогу. З парковки виїжджає лише червона. Кожен рівень перевірено: розв'язок є, а лічильник показує мінімум ходів.</p>
    <button class="btn" id="ovBtn" type="button">Грати</button>
  </div>
</div>

<script src="parkcore.js" charset="utf-8"></script>
<script src="levels.js" charset="utf-8"></script>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const {N,EXIT,generate,decode,occ,range,goal}=ParkCore;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,S=40,OX=0,OY=0,level=1,C=N,R=N,cars=[],par=0,state='menu',T=0,moves=0,fx=[];
try{level=Math.max(1,parseInt(localStorage.getItem('park2_level'))||1)}catch(e){}
function resize(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);fit()}
function fit(){S=Math.min((W-24)/(C+2.6),(H-90)/(R+2.4));OX=(W-C*S)/2-S*0.3;OY=64+(H-64-R*S)/2}
addEventListener('resize',resize);

function levelData(l){const P=window.PARK_LEVELS||[];return l<=P.length?decode(P[l-1][0],P[l-1][1],l):generate(l)}
function load(l){
  // рівні після заготовлених генеруються на пристрої (до кількох секунд) — показати, що гра думає
  if(l>(window.PARK_LEVELS||[]).length&&!load.ready){state='busy';$('ov').hidden=false;$('ovTitle').textContent='Завантаження…';
    $('ovText').textContent='Генерую рівень '+l+'. Це кілька секунд.';$('ovHint').hidden=true;$('ovBtn').hidden=true;
    setTimeout(()=>{load.ready=true;load(l);load.ready=false;$('ovBtn').hidden=false},60);return}
  level=l;const g=levelData(l);par=g.par;
  cars=g.cars.map((c,i)=>Object.assign({},c,{id:i,px:c.x,py:c.y,leaving:null,gone:false,wob:0}));
  moves=0;fx=[];drag=null;state='play';$('ov').hidden=true;$('lv').textContent='Рівень '+l;fit();upd();
}
function upd(){$('left').textContent='Ходи '+moves+' · мін '+par}
$('restart').addEventListener('click',()=>{if(state==='play')load(level)});
$('ovBtn').addEventListener('click',()=>load(state==='won'?level+1:level));

/* стан для ParkCore: fixed + pos */
const fixedOf=()=>cars.map(c=>({h:c.h,len:c.len,line:c.h?c.y:c.x}));
const posOf=()=>cars.map(c=>c.h?c.x:c.y);
function laneRange(i){const f=fixedOf(),p=posOf();return range(f,p,occ(f,p),i)}

/* ---------- input: тягни машину вздовж її осі; торкання — їде капотом до упору ---------- */
let drag=null;
function carAt(x,y){const gx=(x-OX)/S,gy=(y-OY)/S;for(const c of cars){if(c.leaving)continue;const w=c.h?c.len:1,h=c.h?1:c.len;if(gx>=c.px&&gx<c.px+w&&gy>=c.py&&gy<c.py+h)return c}return null}
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;const c=carAt(e.clientX,e.clientY);if(!c)return;
  const [lo,hi]=laneRange(c.id);drag={c,x:e.clientX,y:e.clientY,from:c.h?c.x:c.y,lo,hi,moved:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const {c}=drag,d=(c.h?e.clientX-drag.x:e.clientY-drag.y)/S;
  if(Math.abs(d)>0.15)drag.moved=true;const v=Math.max(drag.lo,Math.min(drag.hi,drag.from+d));if(c.h)c.px=v;else c.py=v;
  if((v===drag.lo&&drag.from+d<drag.lo-0.3)||(v===drag.hi&&drag.from+d>drag.hi+0.3))c.wob=Math.max(c.wob,0.15)});
const release=()=>{if(!drag)return;const {c}=drag;let to;
  if(drag.moved)to=Math.round(c.h?c.px:c.py);
  else{const s=c.nose,far=s>0?drag.hi:drag.lo;to=far!==drag.from?far:(s>0?drag.lo:drag.hi);if(to===drag.from)c.wob=0.35}
  if(c.h)c.x=to;else c.y=to;if(to!==drag.from){moves++;upd()}drag=null;checkExit()};
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

function checkExit(){
  const f=fixedOf(),p=posOf();if(state!=='play'||!goal(f,p,occ(f,p)))return;
  const r=cars[0];if(r.x+r.len<N)moves++;upd();
  state='won';r.leaving={speed:0};try{localStorage.setItem('park2_level',level+1)}catch(e){}
  for(let k=0;k<8;k++)fx.push({x:OX+(r.x)*S,y:OY+(r.y+0.5)*S,vx:-60+(Math.random()-.5)*30,vy:(Math.random()-.5)*30,l:0.7,r:5+Math.random()*4});
  setTimeout(()=>{$('ov').hidden=false;$('ovTitle').textContent='Вирвався!';
    $('ovText').textContent='Рівень '+level+' за '+moves+' ходів'+(moves<=par?' — ідеально, це мінімум.':' (мінімум — '+par+').');
    $('ovHint').hidden=true;$('ovBtn').textContent='Далі';setTimeout(()=>$('ovBtn').focus({preventScroll:true}),50)},900);
}
function carCenter(c){return[OX+(c.px+(c.h?c.len:1)/2)*S,OY+(c.py+(c.h?1:c.len)/2)*S]}

/* ---------- update ---------- */
function update(dt){
  T+=dt;
  for(const c of cars){
    if(c.gone)continue;
    if(c.leaving){const L=c.leaving;L.speed=Math.min(26,L.speed+dt*50);c.px+=L.speed*dt;if(c.px>C+8)c.gone=true;continue}
    if(!drag||drag.c!==c){const tx=c.x,ty=c.y,sp=dt*18;
      if(Math.abs(c.px-tx)>0.001)c.px+=Math.sign(tx-c.px)*Math.min(Math.abs(tx-c.px),sp);
      if(Math.abs(c.py-ty)>0.001)c.py+=Math.sign(ty-c.py)*Math.min(Math.abs(ty-c.py),sp)}
    if(c.wob>0)c.wob-=dt;
  }
  for(const f of fx){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.r+=dt*14}fx=fx.filter(f=>f.l>0);
}

/* ---------- drawing ---------- */
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.round(k>0?v+(255-v)*k:v*(1+k));return`rgb(${f(r)},${f(g)},${f(b)})`}
function drawCar(c){
  const len=c.len*S,wid=S,[cx,cy]=carCenter(c);
  let ang=c.h?(c.nose>0?0:Math.PI):(c.nose>0?Math.PI/2:-Math.PI/2);
  let ox=0,oy=0;
  if(c.wob>0&&!reduce){const k=Math.sin(c.wob*50)*c.wob*6;if(c.h)ox=k;else oy=k}
  ctx.save();ctx.translate(cx+ox,cy+oy);ctx.rotate(ang);
  const L=len-S*0.16,Wd=wid*0.74,col=c.color,truck=c.len===3;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.roundRect(-L/2+3,-Wd/2+4,L,Wd,S*0.18);ctx.fill();
  // wheels
  ctx.fillStyle='#1B1C20';for(const fx_ of[-L*0.32,L*0.3])for(const sy of[-1,1])ctx.fillRect(fx_-S*0.12,sy*Wd/2-S*0.05-(sy<0?0:S*0.02),S*0.24,S*0.08);
  if(truck){
    ctx.fillStyle=shade(col,-0.25);ctx.beginPath();ctx.roundRect(-L/2,-Wd/2,L*0.66,Wd,S*0.08);ctx.fill();
    ctx.fillStyle='#EEF0F4';ctx.beginPath();ctx.roundRect(-L/2+3,-Wd/2+3,L*0.66-6,Wd-6,S*0.06);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=1;for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(-L/2+i*L*0.13,-Wd/2+4);ctx.lineTo(-L/2+i*L*0.13,Wd/2-4);ctx.stroke()}
    ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(L*0.18,-Wd/2,L*0.32,Wd,[S*0.08,S*0.2,S*0.2,S*0.08]);ctx.fill();
    ctx.fillStyle='#9FD3F2';ctx.beginPath();ctx.roundRect(L*0.33,-Wd*0.38,L*0.1,Wd*0.76,3);ctx.fill();
  }else{
    const g=ctx.createLinearGradient(0,-Wd/2,0,Wd/2);g.addColorStop(0,shade(col,0.2));g.addColorStop(0.5,col);g.addColorStop(1,shade(col,-0.2));
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-L/2,-Wd/2,L,Wd,[S*0.2,S*0.3,S*0.3,S*0.2]);ctx.fill();
    ctx.strokeStyle=shade(col,-0.35);ctx.lineWidth=1.5;ctx.stroke();
    // windows + roof
    ctx.fillStyle='#2D3A4A';ctx.beginPath();ctx.roundRect(-L*0.28,-Wd*0.38,L*0.56,Wd*0.76,S*0.12);ctx.fill();
    ctx.fillStyle='#9FD3F2';ctx.beginPath();ctx.moveTo(L*0.08,-Wd*0.34);ctx.lineTo(L*0.25,-Wd*0.3);ctx.lineTo(L*0.25,Wd*0.3);ctx.lineTo(L*0.08,Wd*0.34);ctx.fill();
    ctx.fillStyle='#7FB6D8';ctx.fillRect(-L*0.26,-Wd*0.3,L*0.08,Wd*0.6);
    ctx.fillStyle=shade(col,0.08);ctx.beginPath();ctx.roundRect(-L*0.16,-Wd*0.33,L*0.24,Wd*0.66,S*0.08);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-L*0.12,-Wd*0.28,L*0.14,Wd*0.08);
    // mirrors
    ctx.fillStyle=shade(col,-0.2);ctx.fillRect(L*0.06,-Wd/2-S*0.06,S*0.1,S*0.08);ctx.fillRect(L*0.06,Wd/2-S*0.02,S*0.1,S*0.08);
  }
  // lights
  ctx.fillStyle='#FFF2A8';ctx.beginPath();ctx.ellipse(L/2-S*0.06,-Wd*0.3,S*0.05,S*0.08,0,0,6.283);ctx.ellipse(L/2-S*0.06,Wd*0.3,S*0.05,S*0.08,0,0,6.283);ctx.fill();
  ctx.fillStyle='#D83A3A';ctx.fillRect(-L/2,-Wd*0.38,S*0.05,Wd*0.18);ctx.fillRect(-L/2,Wd*0.2,S*0.05,Wd*0.18);
  if(c.leaving&&!reduce){ctx.fillStyle='rgba(255,242,168,.25)';ctx.beginPath();ctx.moveTo(L/2,-Wd*0.35);ctx.lineTo(L/2+S*1.4,-Wd*0.7);ctx.lineTo(L/2+S*1.4,Wd*0.7);ctx.lineTo(L/2,Wd*0.35);ctx.fill()}
  ctx.restore();
}
function draw(){
  ctx.fillStyle='#7CC35A';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<40;i++){const x=(i*97)%W,y=(i*173)%H;ctx.beginPath();ctx.arc(x,y,14+(i%5)*4,0,6.283);ctx.fill()}
  if(!cars.length)return;
  // ring road
  const pad=S*0.9;ctx.fillStyle='#3E424D';ctx.beginPath();ctx.roundRect(OX-pad,OY-pad,C*S+2*pad,R*S+2*pad,S*0.7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.setLineDash([S*0.3,S*0.3]);ctx.beginPath();ctx.roundRect(OX-pad/2,OY-pad/2,C*S+pad,R*S+pad,S*0.45);ctx.stroke();ctx.setLineDash([]);
  // lot
  ctx.fillStyle='#545A68';ctx.fillRect(OX,OY,C*S,R*S);
  ctx.strokeStyle='#F2E9C9';ctx.lineWidth=2;ctx.strokeRect(OX,OY,C*S,R*S);
  // виїзд: проріз у правому борті + стрілки
  const ey=OY+EXIT*S;ctx.fillStyle='#545A68';ctx.fillRect(OX+C*S-2,ey+2,S*0.9+4,S-4);
  ctx.fillStyle='#FFD23F';ctx.fillRect(OX+C*S-1,ey,4,3);ctx.fillRect(OX+C*S-1,ey+S-3,4,3);
  const k=reduce?0:(T*1.5)%1;ctx.fillStyle='rgba(255,210,63,.85)';
  for(let a=0;a<2;a++){const x=OX+C*S+S*(0.18+a*0.32+k*0.12);ctx.beginPath();ctx.moveTo(x,ey+S*0.3);ctx.lineTo(x+S*0.18,ey+S*0.5);ctx.lineTo(x,ey+S*0.7);ctx.lineTo(x+S*0.07,ey+S*0.5);ctx.fill()}
  ctx.font=Math.round(S*0.26)+'px Bowlby One, "Arial Black", sans-serif';ctx.textAlign='center';ctx.fillStyle='#FFFDF5';ctx.fillText('ВИЇЗД',OX+C*S+S*0.45,ey-S*0.12);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1.5;
  for(let x=1;x<C;x++){ctx.beginPath();ctx.moveTo(OX+x*S,OY+4);ctx.lineTo(OX+x*S,OY+R*S-4);ctx.stroke()}
  for(let y=1;y<R;y++){ctx.beginPath();ctx.moveTo(OX+4,OY+y*S);ctx.lineTo(OX+C*S-4,OY+y*S);ctx.stroke()}
  ctx.fillStyle='rgba(0,0,0,.08)';for(let i=0;i<30;i++){ctx.beginPath();ctx.arc(OX+((i*53)%(C*S)),OY+((i*89)%(R*S)),2+i%3,0,6.283);ctx.fill()}
  // trees in corners
  for(const [x,y] of[[OX-pad-S*0.3,OY-pad-S*0.3],[OX+C*S+pad+S*0.3,OY-pad-S*0.3],[OX-pad-S*0.3,OY+R*S+pad+S*0.3],[OX+C*S+pad+S*0.3,OY+R*S+pad+S*0.3]]){
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.arc(x+4,y+5,S*0.55,0,6.283);ctx.fill();ctx.fillStyle='#3E8F3E';ctx.beginPath();ctx.arc(x,y,S*0.55,0,6.283);ctx.fill();ctx.fillStyle='#5BB35B';ctx.beginPath();ctx.arc(x-S*0.15,y-S*0.15,S*0.35,0,6.283);ctx.fill()}
  for(const c of cars)if(!c.gone&&!c.leaving&&!(drag&&drag.c===c))drawCar(c);
  if(drag)drawCar(drag.c);
  for(const c of cars)if(c.leaving&&!c.gone)drawCar(c);
  for(const f of fx){ctx.fillStyle='rgba(230,230,230,'+Math.max(0,f.l)*0.7+')';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill()}
  if(level<=2&&moves===0&&state==='play'&&!reduce){const [x,y]=carCenter(cars[0]),k=(Math.sin(T*4)+1)/2;
    ctx.strokeStyle='rgba(255,210,63,'+(0.9-k*0.6)+')';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,S*1.1+k*S*0.25,S*0.6+k*S*0.2,0,0,6.283);ctx.stroke()}
}
let last=performance.now();
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
resize();load(level);state='menu';$('ov').hidden=false;
if(level>1)$('ovText').textContent='Продовжуємо з рівня '+level+'. Виведи червону машину до виїзду.';
requestAnimationFrame(frame);
</script>
