<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<script src="../../js/core/native.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Релакс</title>
<link rel="stylesheet" href="../../vendor/fonts/baloo-2.css"><link rel="stylesheet" href="../../vendor/fonts/rubik.css">
<style>
:root{--ink:#F4F1EA;--night:#14121A;--card:#1E1B25;--line:#33303D;--gold:#FFC93C;--gold-deep:#C99716;--sky:#59C3FF;
  --display:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',sans-serif;--body:'Rubik',system-ui,-apple-system,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 calc(max(10px,env(safe-area-inset-left,0px)) + 44px);display:flex;align-items:center;gap:8px;transition:opacity .6s}
.chip{font-family:var(--display);font-weight:800;font-size:17px;line-height:1;background:rgba(12,10,16,.62);padding:8px 12px 6px;border-radius:12px;white-space:nowrap}
.chip small{font-size:12px;opacity:.7;margin-left:3px}
.grow{flex:1}
.icon{border:0;border-radius:12px;min-width:44px;height:44px;background:rgba(12,10,16,.62);color:#fff;font-size:18px;cursor:pointer;font-family:var(--display);font-weight:800}
.icon.active{background:var(--gold);color:#2A2000}
.icon:focus-visible,.btn:focus-visible,.btn2:focus-visible,.pad:focus-visible,.dot:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.tools{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 66px);display:grid;gap:8px;transition:opacity .6s}
.pad{position:fixed;width:76px;height:76px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:30px;cursor:pointer;touch-action:none;transition:opacity .6s,transform .12s,background .12s}
.pad.on{transform:scale(.93);background:rgba(255,201,60,.65)}
.pad small{font-family:var(--display);font-weight:800;font-size:15px}
#left{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
#right{left:calc(max(16px,env(safe-area-inset-left,0px)) + 90px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
#gas{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);background:rgba(61,214,163,.42)}
#brake{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:rgba(255,92,92,.42)}
.track{position:fixed;touch-action:none;cursor:pointer;transition:opacity .6s}
.track::before{content:"";position:absolute;background:rgba(255,255,255,.26);border-radius:6px}
.track:focus-visible{outline:3px solid var(--sky);outline-offset:6px;border-radius:8px}
#wheelS{left:calc(max(16px,env(safe-area-inset-left,0px)) + 38px);width:min(210px,calc(100vw - 166px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);height:76px}
#wheelS::before{left:0;right:0;top:34px;height:8px}
#wheelS::after{content:"";position:absolute;left:50%;top:26px;width:2px;height:24px;background:rgba(255,255,255,.6)}
#wheelS .thumb{top:0;margin-left:-38px;width:76px;height:76px;border-radius:50%;background:rgba(12,10,16,.68);display:grid;place-items:center;position:absolute}
#wheelS .thumb i{display:block;width:50px;height:50px;box-sizing:border-box;border:7px solid #fff;border-radius:50%;background:linear-gradient(#fff,#fff) center/100% 6px no-repeat,linear-gradient(#fff,#fff) 50% 100%/6px 50% no-repeat}
#speedS{right:calc(max(16px,env(safe-area-inset-right,0px)) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 42px);width:48px;height:200px}
#speedS::before{top:0;bottom:0;left:20px;width:8px}
#speedS .thumb{position:absolute;left:-6px;margin-bottom:-22px;width:60px;height:44px;border-radius:12px;background:var(--gold);color:#2A2000;font-family:var(--display);font-weight:800;font-size:19px;line-height:44px;text-align:center}
body:not([data-steer=buttons]) #left,body:not([data-steer=buttons]) #right,body:not([data-steer=slider]) #wheelS{display:none}
body:not([data-speed=pedals]) #gas,body:not([data-speed=pedals]) #brake,body:not([data-speed=slider]) #speedS{display:none}
#gears{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);display:flex;align-items:center;gap:6px;transition:opacity .6s}
#gears b{font-family:var(--display);font-size:22px;min-width:30px;text-align:center;background:rgba(12,10,16,.62);border-radius:10px;line-height:44px}
body:not([data-gears=manual]) #gears,body.autopilot #gears{display:none}
body.calm #gears{opacity:.4}
.opt{display:grid;gap:5px;text-align:left}.opt>span{font-size:13px;opacity:.75}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:42px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:600 14px var(--body);cursor:pointer;padding:4px}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#2A2000}
.seg button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (max-height:480px){.tools{grid-auto-flow:column;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(max(16px,env(safe-area-inset-right,0px)) + 52px)}}
body.calm .top,body.calm .tools{opacity:0}
body.calm .__back{opacity:0}
body.calm.autopilot .pad{opacity:0}
body.calm .pad,body.calm .track{opacity:.4}
body.calm.autopilot .track{opacity:0}
.say{position:fixed;left:0;right:0;top:24%;text-align:center;font-family:var(--display);font-weight:800;font-size:30px;color:#fff;pointer-events:none;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.5);padding:0 16px}
.say.show{animation:say 1.8s ease forwards}
@keyframes say{0%{opacity:0;transform:translateY(8px)}15%,75%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.say.show{animation:sayR 1.8s linear forwards}@keyframes sayR{0%,75%{opacity:1}100%{opacity:0}}}
.overlay{position:fixed;inset:0;display:grid;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:rgba(8,6,12,.32);overflow-y:auto;place-items:start center;touch-action:pan-y}
.card{margin-block:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 22px 22px;max-width:360px;width:100%;box-sizing:border-box;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.4);display:grid;gap:12px}
.card h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;margin:0;color:var(--gold)}
.card p{margin:0;font-size:15px;line-height:1.45}
.hint{font-size:13px;opacity:.72}
.dots{display:flex;gap:10px;justify-content:center}
.dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.dot.on{box-shadow:0 0 0 3px var(--gold)}
.btn{font-family:var(--display);font-weight:800;font-size:22px;background:var(--gold);color:#2A2000;border:0;border-radius:16px;padding:10px 26px 8px;box-shadow:0 5px 0 var(--gold-deep);cursor:pointer;justify-self:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.btn2{font-family:var(--display);font-weight:800;font-size:19px;background:transparent;color:var(--ink);border:2.5px solid var(--gold);border-radius:16px;padding:7px 22px 5px;cursor:pointer;justify-self:center}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="say" id="say" aria-live="polite"></div>

<div id="hud" hidden>
  <div class="top">
    <span class="chip"><span id="speed">0</span><small>км/год</small></span>
    <span class="chip"><span id="km">0.0</span><small>км</small></span>
    <span class="grow"></span>
    <button class="icon" id="menuBtn" type="button" aria-label="Меню">☰</button>
  </div>
  <div class="tools">
    <button class="icon" id="radio" type="button" aria-label="Радіо">📻</button>
    <button class="icon" id="cam" type="button" aria-label="Змінити камеру">🎥</button>
    <button class="icon" id="auto" type="button" aria-label="Автопілот" aria-pressed="false">A</button>
  </div>
  <div class="track" id="wheelS" role="slider" tabindex="0" aria-label="Кермо" aria-valuemin="-1" aria-valuemax="1"><div class="thumb"><i></i></div></div>
  <div id="gears"><button class="icon" id="gDn" type="button" aria-label="Передача нижче">−</button><b id="gearV">1</b><button class="icon" id="gUp" type="button" aria-label="Передача вище">+</button></div>
  <button class="pad" id="left" type="button" aria-label="Кермо ліворуч">←</button>
  <button class="pad" id="right" type="button" aria-label="Кермо праворуч">→</button>
  <div class="track" id="speedS" role="slider" tabindex="0" aria-label="Швидкість" aria-valuemin="0" aria-valuemax="33"><div class="thumb">90</div></div>
  <button class="pad" id="gas" type="button" aria-label="Газ"><small>Газ</small></button>
  <button class="pad" id="brake" type="button" aria-label="Гальмо"><small>Стоп</small></button>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>Релакс</h1>
    <p>Дорога без кінця, день і ніч, дощ і сніг. Ані цілі, ані аварій.</p>
    <div class="dots" id="colors"></div>
    <div class="opt"><span>Кермо</span><div class="seg"><button type="button" data-set="steerMode" data-val="slider">Повзунок</button><button type="button" data-set="steerMode" data-val="buttons">Кнопки</button><button type="button" data-set="steerMode" data-val="tilt">Нахил</button></div></div>
    <div class="opt"><span>Швидкість</span><div class="seg"><button type="button" data-set="speedMode" data-val="slider">Повзунок</button><button type="button" data-set="speedMode" data-val="pedals">Педалі</button></div></div>
    <div class="opt"><span>Передачі</span><div class="seg"><button type="button" data-set="gearMode" data-val="off">Без передач</button><button type="button" data-set="gearMode" data-val="manual">Ручні</button></div></div>
    <button class="btn" id="go" type="button">Їхати</button>
    <button class="btn2" id="watch" type="button">Просто дивитись</button>
    <p class="hint">Радіо вбудоване. Хочеш своє — увімкни 🎧 «Своя музика» й запусти її в іншому застосунку.</p>
    <p class="hint" id="kmTotal"></p>
  </div>
</div>

<script src="../vendor/three.min.js"></script>
<script src="../vendor/engine.js"></script>
<script src="../drive/core.js" charset="utf-8"></script>
<script src="../drive/scene.js" charset="utf-8"></script>
<script src="music.js" charset="utf-8"></script>
<script src="game.js" charset="utf-8"></script>
<a href="../../index.html" class="__back" aria-label="До списку ігор" style="position:fixed;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 12px);z-index:50;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;text-decoration:none;font:700 18px system-ui;transition:opacity .6s">←</a>
<script src="../../js/core/back-button.js"></script>
</body>
</html>
