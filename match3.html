<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<script src="js/core/native.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Три в ряд</title>
<link rel="stylesheet" href="./vendor/fonts/philosopher.css">
<link rel="stylesheet" href="./vendor/fonts/nunito.css">
<meta name="theme-color" content="#0f2b27" />
<style>
  /* Фішки — полив'яна кераміка з орнаментом; усе навколо тихе, щоб дивились на поле */
  :root {
    --bg: #0f2b27; --bg2: #174039; --tile-a: #1b4a41; --tile-b: #164037;
    --ivory: #f6e8cc; --muted: #a9c0b4; --ochre: #efb02e; --clay: #c9542f; --dark: #17241f;
    --display: 'Philosopher', Georgia, serif; --body: 'Nunito', system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--ivory); font-family: var(--body); }
  .page { height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center;
    padding: 0 12px calc(12px + env(safe-area-inset-bottom));
    background: radial-gradient(120% 70% at 50% 42%, var(--bg2), var(--bg) 75%); }
  .col { width: 100%; max-width: 480px; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }

  .top { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
  .lvl { font: 700 21px/1 var(--display); }
  .score { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--ochre); }

  .task { display: flex; align-items: center; gap: 12px; padding: 0 4px; min-height: 52px; }
  .goals { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; }
  .goal { display: flex; align-items: center; gap: 7px; font: 800 16px/1 var(--body); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .goal img { width: 34px; height: 34px; display: block; }
  .goal.done { color: var(--ochre); }
  .goal.wide { flex: 1; min-width: 0; display: grid; gap: 6px; }
  .goal small { font: 700 14px/1 var(--body); color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: rgba(246,232,204,.14); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--ochre); transition: width .2s; }
  .moves { flex: none; width: 60px; text-align: center; }
  .moves b { display: block; font: 700 34px/.95 var(--display); font-variant-numeric: tabular-nums; }
  .moves span { font: 700 12px/1 var(--body); color: var(--muted); }
  .moves.low b { color: #ff8a66; }

  .wrap { flex: 0 1 auto; width: 100%; aspect-ratio: 1; min-height: 0; position: relative; display: grid; place-items: center; }
  #c { display: block; touch-action: none; cursor: pointer; border-radius: 14px; }
  #c.armed { cursor: crosshair; outline: 3px solid var(--ochre); outline-offset: 3px; }
  .banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: max-content; max-width: 86%; pointer-events: none; text-align: center;
    padding: 12px 20px; border-radius: 16px; background: rgba(10,30,26,.9); opacity: 0; transition: opacity .18s; z-index: 3; }
  .banner.on { opacity: 1; }
  .banner b { display: block; font: 700 24px/1.15 var(--display); }
  .banner span { display: block; margin-top: 4px; font: 700 15px/1.3 var(--body); color: var(--muted); }

  .tools { display: flex; justify-content: center; gap: 16px; padding-top: 2px; }
  .tool { position: relative; width: 56px; height: 56px; padding: 0; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: var(--ivory); background: rgba(246,232,204,.11); touch-action: manipulation; }
  .tool svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tool .n { position: absolute; right: -3px; top: -3px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--ochre); color: var(--dark); font: 800 13px/22px var(--body); text-align: center; }
  .tool[disabled] { opacity: .35; cursor: default; }
  .tool.on { background: var(--ochre); color: var(--dark); }
  .tool.on .n { background: var(--dark); color: var(--ochre); }
  .tool:active:not([disabled]) { transform: scale(.93); }
  button:focus-visible { outline: 3px solid var(--ivory); outline-offset: 2px; }

  #ov { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 72px 16px 16px; background: rgba(10,30,26,.94); overflow-y: auto; }
  #ov[hidden] { display: none; }
  .card { width: 100%; max-width: 360px; display: grid; gap: 12px; text-align: center; }
  .card h1 { margin: 0; font: 700 44px/1.05 var(--display); }
  .card h2 { margin: 0; font: 700 30px/1.1 var(--display); }
  .card p { margin: 0; font: 600 16px/1.4 var(--body); color: var(--muted); }
  .hero { display: flex; justify-content: center; }
  .hero img { width: 88px; height: 88px; margin: 0 -3px; }
  .big { font: 700 54px/1 var(--display); color: var(--ochre); font-variant-numeric: tabular-nums; }
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; padding: 11px 16px; border: 0; border-radius: 16px; background: rgba(246,232,204,.1); color: var(--ivory); text-align: left; cursor: pointer; font-family: var(--body); touch-action: manipulation; }
  .opt:active { background: rgba(246,232,204,.2); }
  .opt svg { flex: none; width: 30px; height: 30px; fill: none; stroke: var(--ochre); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .opt img { flex: none; width: 40px; height: 40px; }
  .opt div { flex: 1; min-width: 0; }
  .opt b { display: block; font: 700 21px/1.15 var(--display); }
  .opt span { display: block; margin-top: 2px; font: 600 14px/1.3 var(--body); color: var(--muted); }
  .opt.main { background: var(--ochre); color: var(--dark); }
  .opt.main span { color: #5b4208; }
  .opt[disabled] { opacity: .45; cursor: default; }
  .opt em { flex: none; font: 700 21px/1 var(--display); font-style: normal; color: var(--ochre); }
  .link { justify-self: center; min-height: 44px; padding: 0 14px; border: 0; background: none; color: var(--muted); font: 700 15px var(--body); cursor: pointer; }
  @media (max-height: 620px) { .score { font-size: 24px; } .moves b { font-size: 28px; } .tool { width: 48px; height: 48px; } .task { min-height: 42px; } .goal img { width: 28px; height: 28px; } .hero img { width: 64px; height: 64px; } }
</style>
<link rel="stylesheet" href="js/styles/game-header.css">
<script src="js/core/game-header.js" defer></script>
</head>
<body>
<div class="page">
  <div class="col">
    <div class="top"><div class="lvl" id="lvl">Рівень 1</div><div class="score" id="score">0</div></div>
    <div class="task"><div class="goals" id="goals"></div><div class="moves" id="movesBox"><b id="moves">0</b><span id="movesW">ходів</span></div></div>
    <div class="wrap" id="wrap"><canvas id="c"></canvas><div class="banner" id="banner" role="status"><b></b><span></span></div></div>
    <div class="tools">
      <button class="tool" id="hammer" type="button" aria-label="Молот: розбити клітинку"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-3 3-6-6zM12.5 8.5L4 17a2 2 0 0 0 3 3l8.5-8.5"/></svg><span class="n">0</span></button>
      <button class="tool" id="shuffle" type="button" aria-label="Перемішати поле"><svg viewBox="0 0 24 24"><path d="M3 7h4c5 0 5 10 10 10h4M3 17h4c1.700 0 2.900-1.200 4-2.800M21 7h-4c-1.700 0-2.900 1.200-4 2.800M18 4l3 3-3 3M18 14l3 3-3 3"/></svg><span class="n">0</span></button>
      <button class="tool" id="plus" type="button" aria-label="Додати 5 ходів"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="n">0</span></button>
      <button class="tool" id="shop" type="button" aria-label="Крамниця"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500v9M9.500 9.500h3.700a1.700 1.700 0 0 1 0 3.400h-2.400a1.700 1.700 0 0 0 0 3.400h3.700"/></svg><span class="n">0</span></button>
    </div>
  </div>
</div>
<div id="ov"><div class="card" id="card"></div></div>

<script src="js/match3-core.js?v=20261109c"></script>
<script src="js/match3-game.js?v=20261109b"></script>
<script src="./vendor/firebase/10.13.0/firebase-app-compat.js"></script>
<script src="./vendor/firebase/10.13.0/firebase-auth-compat.js"></script>
<script src="./vendor/firebase/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/app-settings.js"></script>
<script src="js/core/login.js"></script>
<script src="js/core/score-connect.js"></script>
<script src="js/core/records.js"></script>
<script src="js/core/back-button.js"></script>
</body>
</html>
