<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Косинка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg: #14161a; --tile-bg: #22252b; --card-bg: #f4f5f1; --card-back: #2f5d4f;
          --text-light: #f4f5f1; --text-muted: #8b909c; --accent: #38cfa0;
          --red: #d9455f; --black: #1a1c21;
          --ease-smooth: cubic-bezier(0.42, 0, 0.58, 1);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none;
            -webkit-user-select: none; -webkit-touch-callout: none; }
        html, body {
            margin: 0; padding: 0; min-height: 100dvh;
            /* Додаємо легкий радіальний акцент і сітку з точок */
            background:
                radial-gradient(circle at 50% 20%, #1f242d 0%, #14161a 70%),
                radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100%, 24px 24px;
            font-family: 'Inter', sans-serif; color: var(--text-light); overflow: hidden;
            touch-action: manipulation;
        }
        .page { max-width: 480px; margin: 0 auto; padding: 60px 8px 24px; display: flex;
            flex-direction: column; align-items: center; min-height: 100dvh; position: relative; z-index: 1;
            padding-bottom: calc(var(--actions-h, 132px) + 12px); }

        .stats { display: flex; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--text-muted); }
        .stats b { color: var(--text-light); font-family: 'Space Grotesk', sans-serif; }

        .top-row { display: flex; gap: 4px; width: 100%; max-width: 332px; justify-content: flex-start; margin-bottom: 12px; }
        .pile-slot { width: 44px; height: 62px; border: 1px dashed rgba(255,255,255,0.2); border-radius: 5px;
            display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }

        #wasteSlot { width: 44px; height: 62px; border: none; position: relative; flex-shrink: 0; }
        .waste-card {
          position: absolute !important;
          top: 0 !important;
          transition: left 0.3s var(--ease-smooth);
        }

        .card { width: 44px; height: 62px; border-radius: 6px;
            background: linear-gradient(145deg, #ffffff 0%, #f1f2ec 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            box-shadow: 0 2px 5px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.8);
            cursor: pointer; position: relative; touch-action: none;
            backface-visibility: hidden; transform-style: preserve-3d; }
        .card.red { color: var(--red); }
        .card.black { color: var(--black); }

        .card.back {
          background: radial-gradient(circle, #2b594b 0%, #132a23 100%);
          border: 1px solid rgba(255, 255, 255, 0.2);
          display: flex; align-items: center; justify-content: center;
        }
        .card.back::before {
          content: ""; position: absolute; inset: 3px;
          border: 1px dashed rgba(255, 255, 255, 0.3); border-radius: 3px;
          background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0 4px, transparent 4px 8px);
        }
        .card.back::after { content: "⚜️"; font-size: 14px; opacity: 0.7; filter: grayscale(0.3); }

        .card.selected { outline: 3px solid var(--accent); outline-offset: -2px; }
        .card.dragging-source { opacity: 0.2; }

        /* Анімація підказки */
        @keyframes hintPulse {
          0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.9); }
          70% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
          100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }
        .hint-highlight {
          animation: hintPulse 1.2s infinite;
          outline: 3px solid #ffd700 !important;
          border-radius: 6px;
          z-index: 100;
        }

        /* 3D-перевертання */
        @keyframes cardFlip3D {
          0% { transform: perspective(400px) rotateY(90deg); opacity: 0.5; }
          100% { transform: perspective(400px) rotateY(0deg); opacity: 1; }
        }
        .card.anim-flip {
          animation: cardFlip3D 0.38s var(--ease-smooth);
        }

        .card .corner { position: absolute; top: 3px; left: 4px; display: flex; flex-direction: column; align-items: center; line-height: 0.85; }
        .card .rank { font-size: 11px; font-weight: 700; }
        .card .mini-suit { font-size: 8px; margin-top: 1px; opacity: 0.85; }
        .card .suit { font-size: 22px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.08)); }

        .card.honor {
          background: linear-gradient(145deg, #fffdfa 0%, #f4eee2 100%);
          border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .tableau { display: flex; gap: 4px; width: 100%; max-width: 332px; justify-content: center; }
        .col { display: flex; flex-direction: column; width: 44px; min-height: 62px; }
        .col .card { margin-top: -40px; }
        .col .card:first-child { margin-top: 0; }
        .col-empty-slot { width: 44px; height: 62px; border: 1px dashed rgba(255,255,255,0.15); border-radius: 5px; }

        /* Drag Avatar */
        #dragAvatar {
          position: fixed; pointer-events: none; z-index: 9999;
          display: flex; flex-direction: column; top: 0; left: 0;
          transform: translate3d(-999px, -999px, 0);
          filter: drop-shadow(0 12px 20px rgba(0,0,0,0.5));
        }
        #dragAvatar.snap-back {
          transition: transform 0.35s var(--ease-smooth) !important;
        }
        #dragAvatar .card { margin-top: -40px; transform: scale(1.05); }
        #dragAvatar .card:first-child { margin-top: 0; }

        .msg { min-height: 18px; font-size: 12px; color: var(--text-muted); margin-top: 10px; text-align: center; }

        .result-panel { text-align: center; margin: 8px 0 4px; }
        .result-panel .title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .result-panel .sub { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }

        /* Кнопки дій — приліплені до низу екрана, з урахуванням safe-area на різних телефонах */
        .actions {
            position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
            display: flex; flex-direction: column; gap: 10px;
            width: 100%; max-width: 480px; align-items: center;
            padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
            box-sizing: border-box; z-index: 500;
            background: linear-gradient(to top, rgba(20,22,26,0.96) 55%, rgba(20,22,26,0));
        }
        .actions-primary, .actions-secondary { display: flex; gap: 8px; width: 100%; max-width: 332px; justify-content: center; }

        .autocomplete-bar { width: 100%; max-width: 332px; display: none; }
        .autocomplete-bar.show { display: block; }
        .autocomplete-btn {
            width: 100%; padding: 12px 16px; font-size: 14px;
            background: linear-gradient(135deg, #38cfa0, #2bb98d); color: #0e2318;
            border-color: rgba(255,255,255,0.3); box-shadow: 0 2px 10px rgba(56,207,160,0.35);
            animation: autoPulse 1.6s ease-in-out infinite;
        }
        @keyframes autoPulse {
            0%, 100% { box-shadow: 0 2px 10px rgba(56,207,160,0.35); }
            50% { box-shadow: 0 2px 18px rgba(56,207,160,0.65); }
        }

        .action-btn { border: none; border-radius: 20px; font-weight: 700; cursor: pointer;
            background: #272729; color: var(--text-light); border: 1px solid rgba(255,255,255,0.12);
            transition: background 0.15s, transform 0.1s; }
        .action-btn:active { background: #38cfa0; color: #14161a; transform: scale(0.97); }
        .action-btn:disabled { opacity: 0.35; pointer-events: none; }

        .primary-btn { flex: 1; padding: 12px 16px; font-size: 15px; background: #2b2e36; border-color: rgba(255,255,255,0.25); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .secondary-btn { padding: 6px 14px; font-size: 11px; opacity: 0.65; background: transparent; }
        .secondary-btn:hover, .secondary-btn:active { opacity: 1; }

        #winCanvas {
          position: fixed; inset: 0; pointer-events: none; z-index: 9000; display: none;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="stats">
        <div>⏱ <b id="timerVal">00:00</b></div>
        <div>🂠 <b id="movesVal">0</b></div>
    </div>

    <div class="top-row">
        <div class="pile-slot" id="stockSlot"></div>
        <div id="wasteSlot"></div>
        <div style="width: 44px; height: 62px; flex-shrink: 0;"></div>
        <div id="foundations" style="display: flex; gap: 4px;"></div>
    </div>

    <div class="tableau" id="tableau"></div>

    <div class="msg" id="msg"></div>
    <div class="msg" id="deadlockMsg" style="display:none; color:#ffd700;"></div>

    <div class="result-panel" id="resultPanel" style="display:none">
        <div class="title" id="resultTitle"></div>
        <div class="sub" id="resultSub"></div>
    </div>

    <div class="actions">
        <div class="autocomplete-bar" id="autoCompleteBar">
            <button class="action-btn autocomplete-btn" id="autoCompleteBtn">⚡ Зібрати автоматично</button>
        </div>
        <div class="actions-primary">
            <button class="action-btn primary-btn" id="undoBtn">↶ Назад</button>
            <button class="action-btn primary-btn" id="hintBtn">💡 Підказка</button>
        </div>
        <div class="actions-secondary">
            <button class="action-btn secondary-btn" id="giveUpBtn">🏳 Здатися</button>
            <button class="action-btn secondary-btn" id="newGameBtn">🔄 Нова гра</button>
        </div>
    </div>
</div>

<div id="dragAvatar"></div>
<canvas id="winCanvas"></canvas>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/login.js"></script>
<script src="js/score-connect.js"></script>
<script src="js/records.js"></script>
<script src="js/help.js"></script>
<script src="js/klondike-solver.js"></script>
<script src="js/back-button.js"></script>
<script>
    (function () {
      const SUITS = ["S", "H", "D", "C"];
      const SUIT_SYMBOL = { S: "♠", H: "♥", D: "♦", C: "♣" };
      const RED_SUITS = new Set(["H", "D"]);
      const RANK_LABEL = { 1: "A", 11: "J", 12: "Q", 13: "K" };

      let tableau, foundations, stock, waste, selected, moves, startTime, timerHandle, finished;
      let historyStack = [];
      let hintHistory = new Set(); // Пам'ять підказок
      let lastRealMove = null; // { cardId, fromCol, toCol } — для захисту від пінг-понгу в підказках

      // --- Фонова перевірка "чи ще можна виграти звідси" (не плутати з
      // hasAnyMove(), яка лише каже "чи є взагалі легальний хід") ---
      let solverWorker = null;
      let solverWorkerBroken = false;
      let lastCheckedSignature = null;   // сигнатура стану, для якого вже маємо lastSolvabilityResult
      let lastSolvabilityResult = null;  // { solvable, timedOut } для lastCheckedSignature
      let solvabilityRequestToken = 0;

      function getSolverWorker() {
        if (solverWorkerBroken) return null;
        if (!solverWorker) {
          try {
            solverWorker = new Worker("js/klondike-solver.js");
          } catch (e) {
            solverWorkerBroken = true;
            return null;
          }
        }
        return solverWorker;
      }

      function computeSignature(t, f, st, w) {
        const code = (c) => c.suit + c.rank + (c.faceUp === false ? "_" : "^");
        return t.map((col) => col.map(code).join(",")).join("|") +
          "#" + f.map((p) => p.length).join(",") +
          "#" + st.map(code).join(",") +
          "/" + w.map(code).join(",");
      }

      function liveStateSignature() {
        return computeSignature(tableau, foundations, stock, waste);
      }

      // --- Tabu-список нещодавно відвіданих станів (принцип "заборона
      // циркулярних ходів") — окремий шар від hintHistory: hintHistory не
      // дає показувати той самий id ходу двічі поспіль в одній серії
      // натискань "Підказка"; stateTabuList не дає РАДИТИ хід, що повертає
      // гру у стан, з якого ви щойно пішли, навіть якщо це "інший" id ходу.
      let stateTabuList = [];
      const STATE_TABU_SIZE = 6;

      function rememberStateForTabu(sig) {
        stateTabuList.push(sig);
        if (stateTabuList.length > STATE_TABU_SIZE) stateTabuList.shift();
      }

      function buildLiveSnapshot() {
        return {
          tableau: tableau.map((col) => col.map((c) => ({ suit: c.suit, rank: c.rank, faceUp: c.faceUp }))),
          foundations: foundations.map((pile) => pile.map((c) => ({ suit: c.suit, rank: c.rank }))),
          stock: stock.map((c) => ({ suit: c.suit, rank: c.rank })),
          waste: waste.map((c) => ({ suit: c.suit, rank: c.rank })),
        };
      }

      // Питаємо у солвера (у фоновому Worker'і, щоб не підвісити інтерфейс),
      // чи з поточної позиції ще є шлях до перемоги. Результат кешується під
      // сигнатуру стану — якщо стан ще не змінився, повторний запит не шлемо.
      function scheduleSolvabilityCheck() {
        if (finished) return;
        const sig = liveStateSignature();
        if (sig === lastCheckedSignature) return;

        const worker = getSolverWorker();
        if (!worker) return;

        const myToken = ++solvabilityRequestToken;
        const live = buildLiveSnapshot();

        const onMsg = (e) => {
          if (!e.data || e.data.type !== "findHint") return;
          worker.removeEventListener("message", onMsg);
          if (myToken !== solvabilityRequestToken) return; // стан устиг змінитись, відповідь застаріла
          lastCheckedSignature = sig;
          // { solvable, timedOut, firstMove } — firstMove це РЕАЛЬНИЙ перший хід
          // знайденої переможної лінії, а не просто булевий прапорець.
          lastSolvabilityResult = e.data.result;
          updateDeadlockNotice();
        };
        worker.addEventListener("message", onMsg);
        worker.postMessage({ cmd: "findHint", live, opts: { maxNodes: 120000, maxTimeMs: 1200 } });
      }

      // Перетворює хід у "сирому" форматі солвера (type + col/fromCol/cardIdx/
      // toCol/fIdx) на DOM-елементи для підсвітки в ЖИВІЙ грі. Працює коректно,
      // лише поки поточний tableau/foundations/waste ще збігаються з тими,
      // для яких цей хід було знайдено (перевіряється сигнатурою в showHint).
      function solverMoveToHintTargets(move) {
        if (!move) return null;
        if (move.type === "draw") {
          return { fromEl: stockSlot, toEl: null };
        }
        if (move.type === "waste->foundation") {
          if (!waste.length) return null;
          const card = waste[waste.length - 1];
          const fIdx = SUITS.indexOf(card.suit);
          return {
            fromEl: wasteSlot.querySelector(".waste-card:last-child"),
            toEl: foundationsEl.children[fIdx]
          };
        }
        if (move.type === "waste->tableau") {
          if (!waste.length || !tableauEl.children[move.col]) return null;
          return {
            fromEl: wasteSlot.querySelector(".waste-card:last-child"),
            toEl: tableauEl.children[move.col]
          };
        }
        if (move.type === "tableau->foundation") {
          const col = tableau[move.col];
          if (!col || !col.length) return null;
          const card = col[col.length - 1];
          const fIdx = SUITS.indexOf(card.suit);
          const colEl = tableauEl.children[move.col];
          return { fromEl: colEl ? colEl.lastElementChild : null, toEl: foundationsEl.children[fIdx] };
        }
        if (move.type === "tableau->tableau") {
          const fromColEl = tableauEl.children[move.fromCol];
          const toColEl = tableauEl.children[move.toCol];
          if (!fromColEl || !toColEl) return null;
          const fromEl = fromColEl.children[move.cardIdx] || fromColEl.lastElementChild;
          return { fromEl, toEl: toColEl };
        }
        return null;
      }

      const tableauEl = document.getElementById("tableau");
      const foundationsEl = document.getElementById("foundations");
      const stockSlot = document.getElementById("stockSlot");
      const wasteSlot = document.getElementById("wasteSlot");
      const timerEl = document.getElementById("timerVal");
      const movesEl = document.getElementById("movesVal");
      const msgEl = document.getElementById("msg");
      const deadlockMsgEl = document.getElementById("deadlockMsg");
      const resultPanel = document.getElementById("resultPanel");
      const resultTitle = document.getElementById("resultTitle");
      const resultSub = document.getElementById("resultSub");
      const dragAvatar = document.getElementById("dragAvatar");
      const winCanvas = document.getElementById("winCanvas");

      function rankLabel(r) { return RANK_LABEL[r] || String(r); }
      function colorOf(card) { return RED_SUITS.has(card.suit) ? "red" : "black"; }

      function isSequential(upper, lower) {
        return lower.rank === upper.rank - 1 && colorOf(lower) !== colorOf(upper);
      }

      function freshDeck() {
        const deck = [];
        SUITS.forEach((s) => {
          for (let r = 1; r <= 13; r++) deck.push({ suit: s, rank: r, faceUp: false, id: `${s}_${r}` });
        });
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        return deck;
      }

      function saveState(movedCardId = null) {
        hintHistory.clear(); // Скидаємо пам'ять підказок при будь-якій дії
        rememberStateForTabu(liveStateSignature()); // пам'ятаємо стан, який щойно покидаємо
        historyStack.push({
          state: JSON.parse(JSON.stringify({ tableau, foundations, stock, waste, moves })),
          movedCardId
        });
      }

      function findCardInCurrentState(id) {
        if (!id) return null;
        for (const col of tableau) {
          const c = col.find(card => card.id === id);
          if (c) return c;
        }
        for (const pile of foundations) {
          const c = pile.find(card => card.id === id);
          if (c) return c;
        }
        const inWaste = waste.find(card => card.id === id);
        if (inWaste) return inWaste;
        const inStock = stock.find(card => card.id === id);
        if (inStock) return inStock;
        return null;
      }

      function undo() {
        if (!historyStack.length) return;
        const { state, movedCardId } = historyStack.pop();

        let fromRect = null;
        let movedCardObj = null;

        if (movedCardId) {
          const currentEl = document.querySelector(`[data-card-id="${movedCardId}"]`);
          if (currentEl) {
            fromRect = currentEl.getBoundingClientRect();
          }
          movedCardObj = findCardInCurrentState(movedCardId);
        }

        tableau = state.tableau;
        foundations = state.foundations;
        stock = state.stock;
        waste = state.waste;
        moves = state.moves;
        lastRealMove = null;
        lastCheckedSignature = null;
        lastSolvabilityResult = null;
        solvabilityRequestToken++;

        if (movesEl) movesEl.textContent = String(moves);
        clearSelection();
        render();

        if (movedCardId && fromRect && movedCardObj) {
          const targetEl = document.querySelector(`[data-card-id="${movedCardId}"]`);
          if (targetEl) {
            targetEl.style.opacity = "0";
            flyCard(movedCardObj, fromRect, targetEl, () => {
              targetEl.style.opacity = "1";
            });
          }
        }
      }

      function stopWinCascade() {
        winCanvas.style.display = "none";
        if (winAnimId) cancelAnimationFrame(winAnimId);
      }

      function newGame() {
        stopWinCascade();
        clearInterval(timerHandle);
        finished = true; // блокує ввід, поки триває генерація
        showGeneratingOverlay(true);

        const worker = new Worker("js/klondike-solver.js");
        worker.onmessage = (e) => {
          worker.terminate();
          showGeneratingOverlay(false);
          applyGeneratedDeal(e.data.result);
        };
        worker.onerror = () => {
          // якщо Worker з якоїсь причини не запустився (рідкісний edge-case
          // середовища) — падаємо назад на звичайну миттєву роздачу без
          // гарантії розв'язності, аби гра точно почалась.
          worker.terminate();
          showGeneratingOverlay(false);
          applyGeneratedDeal({ deal: KlondikeSolver.dealFromDeck(KlondikeSolver.freshShuffledDeck()), verified: false });
        };
        worker.postMessage({ cmd: "generate", opts: {} });
      }

      function applyGeneratedDeal({ deal, verified }) {
        tableau = deal.tableau.map((col) => col.map((c) => ({ ...c, id: c.id || `${c.suit}_${c.rank}` })));
        foundations = [[], [], [], []];
        stock = deal.stock.map((c) => ({ ...c, faceUp: false, id: c.id || `${c.suit}_${c.rank}` }));
        waste = [];
        selected = null;
        moves = 0;
        historyStack = [];
        lastRealMove = null;
        hintHistory.clear();
        stateTabuList = [];
        lastCheckedSignature = null;
        lastSolvabilityResult = null;
        solvabilityRequestToken++; // анулюємо будь-яку підвислу перевірку з попередньої партії
        finished = false;
        startTime = Date.now();
        timerHandle = setInterval(updateTimer, 1000);
        updateTimer();
        movesEl.textContent = "0";
        resultPanel.style.display = "none";
        msgEl.textContent = verified ? "" : "Не вдалось підтвердити 100% розв'язність за відведений час — але спробувати варто!";
        if (!verified) setTimeout(() => { if (msgEl.textContent) msgEl.textContent = ""; }, 3500);
        render();
      }

      let generatingOverlayEl = null;
      function showGeneratingOverlay(show) {
        if (!generatingOverlayEl) {
          generatingOverlayEl = document.createElement("div");
          generatingOverlayEl.style.cssText =
            "position:fixed;inset:0;background:rgba(20,22,26,0.88);display:none;" +
            "align-items:center;justify-content:center;z-index:10000;color:#f4f5f1;" +
            "font-family:'Space Grotesk',sans-serif;font-size:14px;flex-direction:column;gap:10px;";
          generatingOverlayEl.innerHTML = `<div>🃏 Тасуємо й перевіряємо розв'язність…</div>`;
          document.body.appendChild(generatingOverlayEl);
        }
        generatingOverlayEl.style.display = show ? "flex" : "none";
      }

      function updateTimer() {
        const secs = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(secs / 60)).padStart(2, "0");
        const s = String(secs % 60).padStart(2, "0");
        timerEl.textContent = `${m}:${s}`;
      }

      function makeCardEl(card, { faceDown = false } = {}) {
        const el = document.createElement("div");
        if (card && card.id) el.dataset.cardId = card.id;

        const isFaceCard = !faceDown && card && (card.rank === 1 || card.rank >= 11);
        el.className = "card" + (faceDown ? " back" : " " + colorOf(card)) + (isFaceCard ? " honor" : "");

        if (card && card.animFlip) {
          el.classList.add("anim-flip");
          delete card.animFlip;
        }

        if (!faceDown && card) {
          el.innerHTML = `
            <div class="corner">
              <span class="rank">${rankLabel(card.rank)}</span>
              <span class="mini-suit">${SUIT_SYMBOL[card.suit]}</span>
            </div>
            <div class="suit">${SUIT_SYMBOL[card.suit]}</div>
          `;
        }
        return el;
      }

      function flyCard(card, fromRect, toTargetEl, onComplete) {
        if (!fromRect || !toTargetEl) { if (onComplete) onComplete(); return; }
        const toRect = toTargetEl.getBoundingClientRect();

        const flyEl = makeCardEl(card);
        flyEl.style.position = "fixed";
        flyEl.style.left = `${fromRect.left}px`;
        flyEl.style.top = `${fromRect.top}px`;
        flyEl.style.width = `${fromRect.width}px`;
        flyEl.style.height = `${fromRect.height}px`;
        flyEl.style.zIndex = "9999";
        flyEl.style.transition = "transform 0.42s var(--ease-smooth)";
        flyEl.style.pointerEvents = "none";
        flyEl.style.boxShadow = "0 12px 24px rgba(0,0,0,0.45)";
        document.body.appendChild(flyEl);

        const deltaX = toRect.left - fromRect.left;
        const deltaY = toRect.top - fromRect.top;

        requestAnimationFrame(() => {
          flyEl.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0)`;
        });

        setTimeout(() => {
          if (flyEl.parentNode) flyEl.parentNode.removeChild(flyEl);
          if (onComplete) onComplete();
        }, 420);
      }

      function render() {
        stockSlot.innerHTML = "";
        if (stock.length) {
          const el = makeCardEl(stock[stock.length - 1], { faceDown: true });
          el.addEventListener("click", tapStock);
          stockSlot.appendChild(el);
        } else {
          stockSlot.innerHTML = waste.length ? "↺" : "";
          stockSlot.style.color = "var(--text-muted)";
          stockSlot.style.cursor = "pointer";
          stockSlot.onclick = tapStock;
        }

        wasteSlot.innerHTML = "";
        if (waste.length) {
          const visibleCount = Math.min(3, waste.length);
          const visibleCards = waste.slice(-visibleCount);

          visibleCards.forEach((card, idx) => {
            const isTop = idx === visibleCount - 1;
            const el = makeCardEl(card);
            el.classList.add("waste-card");

            el.style.left = `${idx * 15}px`;
            el.style.top = "0px";
            el.style.zIndex = idx + 1;

            if (isTop) {
              if (selected && selected.source === "waste") el.classList.add("selected");
              el.addEventListener("click", () => onTapWaste());
              attachDrag(el, { source: "waste" });
            } else {
              el.style.pointerEvents = "none";
            }
            wasteSlot.appendChild(el);
          });
        }

        foundationsEl.innerHTML = "";
        foundations.forEach((pile, fIdx) => {
          const slot = document.createElement("div");
          slot.className = "pile-slot";
          slot.dataset.fidx = fIdx;

          if (pile.length) {
            const el = makeCardEl(pile[pile.length - 1]);
            el.addEventListener("click", () => onTapFoundation(fIdx));
            slot.appendChild(el);
          } else {
            slot.textContent = "A";
            slot.style.color = "rgba(255,255,255,0.2)";
            slot.style.fontSize = "18px";
            slot.style.fontWeight = "bold";
            slot.addEventListener("click", () => onTapFoundation(fIdx));
          }
          foundationsEl.appendChild(slot);
        });

        tableauEl.innerHTML = "";
        tableau.forEach((col, ci) => {
          const colEl = document.createElement("div");
          colEl.className = "col";
          colEl.dataset.col = ci;
          if (!col.length) {
            const empty = document.createElement("div");
            empty.className = "col-empty-slot";
            empty.addEventListener("click", () => onTapTableau(ci, null));
            colEl.appendChild(empty);
          } else {
            col.forEach((card, idx) => {
              const el = makeCardEl(card, { faceDown: !card.faceUp });
              if (card.faceUp && selected && selected.source === "tableau" && selected.col === ci && idx >= selected.idx) {
                el.classList.add("selected");
              }
              el.addEventListener("click", () => (card.faceUp ? onTapTableau(ci, idx) : onTapTableau(ci, col.length - 1)));
              if (card.faceUp) {
                attachDrag(el, { source: "tableau", col: ci, idx });
              }
              colEl.appendChild(el);
            });
          }
          tableauEl.appendChild(colEl);
        });

        updateAutoCompleteVisibility();
        updateDeadlockNotice();
      }

      const autoCompleteBar = document.getElementById("autoCompleteBar");
      const autoCompleteBtn = document.getElementById("autoCompleteBtn");
      let autoCompleting = false;

      function isAutoCompleteAvailable() {
        if (finished || autoCompleting) return false;
        return tableau.every((col) => col.every((c) => c.faceUp));
      }

      function updateAutoCompleteVisibility() {
        if (!autoCompleteBar) return;
        autoCompleteBar.classList.toggle("show", isAutoCompleteAvailable());
      }

      function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

      function setActionButtonsDisabled(disabled) {
        ["undoBtn", "hintBtn", "giveUpBtn", "newGameBtn"].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.disabled = disabled;
        });
      }

      async function autoComplete() {
        if (autoCompleting || finished) return;
        autoCompleting = true;
        autoCompleteBar.classList.remove("show");
        setActionButtonsDisabled(true);
        saveState();

        let safety = 1000; // запобіжник від зациклення
        while (safety-- > 0) {
          let movedSomething = false;

          // 1. Верхні карти зі столу у фундамент
          for (let cIdx = 0; cIdx < tableau.length; cIdx++) {
            const col = tableau[cIdx];
            if (!col.length) continue;
            const card = col[col.length - 1];
            if (!card.faceUp) continue;
            for (let fIdx = 0; fIdx < foundations.length; fIdx++) {
              if (canMoveToFoundation(card, foundations[fIdx])) {
                col.pop();
                foundations[fIdx].push(card);
                moves++; movesEl.textContent = String(moves);
                movedSomething = true;
                render();
                await sleep(85);
                break;
              }
            }
          }

          // 2. Верхня карта відбою у фундамент
          if (waste.length) {
            const card = waste[waste.length - 1];
            for (let fIdx = 0; fIdx < foundations.length; fIdx++) {
              if (canMoveToFoundation(card, foundations[fIdx])) {
                waste.pop();
                foundations[fIdx].push(card);
                moves++; movesEl.textContent = String(moves);
                movedSomething = true;
                render();
                await sleep(85);
                break;
              }
            }
          }

          if (movedSomething) continue;

          if (foundationCount() === 52) break;

          // 3. Немає ходів прямо зараз — тягнемо ще карту зі стоку/відбою
          if (stock.length > 0) {
            const card = stock.pop();
            card.faceUp = true;
            waste.push(card);
            render();
            await sleep(45);
            continue;
          }
          if (waste.length > 0) {
            stock = waste.slice().reverse().map((c) => ({ ...c, faceUp: false }));
            waste = [];
            render();
            await sleep(45);
            continue;
          }

          break; // більше нічого зробити не можна
        }

        autoCompleting = false;
        setActionButtonsDisabled(false);
        render();
        checkWin();
      }

      if (autoCompleteBtn) autoCompleteBtn.addEventListener("click", autoComplete);

      let activeDrag = null;

      function attachDrag(el, sourceInfo) {
        el.addEventListener("pointerdown", (e) => {
          if (e.button && e.button !== 0) return;

          if (sourceInfo.source === "tableau") {
            const col = tableau[sourceInfo.col];
            for (let i = sourceInfo.idx; i < col.length - 1; i++) {
              if (!isSequential(col[i], col[i + 1])) return;
            }
          }

          const rect = el.getBoundingClientRect();
          activeDrag = {
            sourceInfo,
            startX: e.clientX,
            startY: e.clientY,
            offsetX: e.clientX - rect.left,
            offsetY: e.clientY - rect.top,
            initialLeft: rect.left,
            initialTop: rect.top,
            isDragging: false
          };

          el.setPointerCapture(e.pointerId);

          const onPointerMove = (pe) => {
            if (!activeDrag) return;
            const dist = Math.hypot(pe.clientX - activeDrag.startX, pe.clientY - activeDrag.startY);

            if (!activeDrag.isDragging && dist > 5) {
              activeDrag.isDragging = true;
              startDragUI();
            }

            if (activeDrag.isDragging) {
              dragAvatar.style.transform = `translate3d(${pe.clientX - activeDrag.offsetX}px, ${pe.clientY - activeDrag.offsetY}px, 0)`;
            }
          };

          const onPointerUp = (pe) => {
            el.removeEventListener("pointermove", onPointerMove);
            el.removeEventListener("pointerup", onPointerUp);
            el.removeEventListener("pointercancel", onPointerUp);

            if (activeDrag && activeDrag.isDragging) {
              endDragUI(pe.clientX, pe.clientY);
            }
            activeDrag = null;
          };

          el.addEventListener("pointermove", onPointerMove);
          el.addEventListener("pointerup", onPointerUp);
          el.addEventListener("pointercancel", onPointerUp);
        });
      }

      function startDragUI() {
        dragAvatar.style.transition = "none";
        dragAvatar.classList.remove("snap-back");
        dragAvatar.innerHTML = "";

        let cardsToDrag = [];
        if (activeDrag.sourceInfo.source === "waste") {
          cardsToDrag = [waste[waste.length - 1]];
          wasteSlot.querySelector(".waste-card:last-child")?.classList.add("dragging-source");
        } else if (activeDrag.sourceInfo.source === "tableau") {
          const col = tableau[activeDrag.sourceInfo.col];
          cardsToDrag = col.slice(activeDrag.sourceInfo.idx);
          const colEl = tableauEl.children[activeDrag.sourceInfo.col];
          for (let i = activeDrag.sourceInfo.idx; i < col.length; i++) {
            colEl.children[i]?.classList.add("dragging-source");
          }
        }

        cardsToDrag.forEach((c) => {
          dragAvatar.appendChild(makeCardEl(c));
        });

        dragAvatar.style.transform = `translate3d(${activeDrag.startX - activeDrag.offsetX}px, ${activeDrag.startY - activeDrag.offsetY}px, 0)`;
        void dragAvatar.offsetWidth;
      }

      function endDragUI(dropX, dropY) {
        const dropTargetEl = document.elementFromPoint(dropX, dropY);
        selected = activeDrag.sourceInfo;

        const colEl = dropTargetEl?.closest(".col");
        const foundSlotEl = dropTargetEl?.closest(".pile-slot");
        let moved = false;

        if (colEl) {
          const targetColIdx = parseInt(colEl.dataset.col, 10);
          moved = tryMoveSelectedTo({ type: "tableau", col: targetColIdx }, { animated: false });
        } else if (foundSlotEl && foundSlotEl.dataset.fidx !== undefined) {
          const fIdx = parseInt(foundSlotEl.dataset.fidx, 10);
          moved = tryMoveSelectedTo({ type: "foundation", fIdx }, { animated: false });
        }

        if (moved) {
          dragAvatar.style.transition = "none";
          dragAvatar.innerHTML = "";
          dragAvatar.style.transform = `translate3d(-999px, -999px, 0)`;
          clearSelection();
        } else {
          dragAvatar.classList.add("snap-back");
          dragAvatar.style.transform = `translate3d(${activeDrag.initialLeft}px, ${activeDrag.initialTop}px, 0)`;
          setTimeout(() => {
            dragAvatar.style.transition = "none";
            dragAvatar.classList.remove("snap-back");
            dragAvatar.innerHTML = "";
            dragAvatar.style.transform = `translate3d(-999px, -999px, 0)`;
            clearSelection();
            render();
          }, 350);
        }
      }

      function clearSelection() { selected = null; }

      function tapStock() {
        clearSelection();
        if (stock.length === 0) {
          if (waste.length === 0) { render(); return; }
          saveState();
          stock = waste.slice().reverse().map((c) => ({ ...c, faceUp: false }));
          waste = [];
          render();
        } else {
          const drawCount = Math.min(1, stock.length);
          const topDrawnCardId = stock[stock.length - 1].id;
          saveState(topDrawnCardId);
          for (let i = 0; i < drawCount; i++) {
            const card = stock.pop();
            card.faceUp = true;
            card.animFlip = true;
            waste.push(card);
          }
          render();
        }
      }

      let lastTapTime = 0, lastTapKey = "";
      function isDoubleTap(key) {
        const now = Date.now();
        const isDouble = key === lastTapKey && now - lastTapTime < 320;
        lastTapTime = now;
        lastTapKey = key;
        return isDouble;
      }

      function onTapWaste() {
        if (!waste.length) return;
        const topCard = waste[waste.length - 1];
        const wasteEl = wasteSlot.querySelector(".waste-card:last-child");

        if (isDoubleTap("waste") && wasteEl) {
          const fromRect = wasteEl.getBoundingClientRect();
          if (tryAutoFoundation(topCard, () => waste.pop(), fromRect)) return;
        }

        if (selected && selected.source === "waste") { clearSelection(); render(); return; }
        selected = { source: "waste" };
        render();
      }

      function onTapFoundation(fIdx) {
        if (selected) {
          const moved = tryMoveSelectedTo({ type: "foundation", fIdx });
          if (!moved) clearSelection();
          return;
        }
        render();
      }

      function onTapTableau(colIndex, idx) {
        const col = tableau[colIndex];

        if (idx !== null && isDoubleTap("t" + colIndex + "_" + idx) && idx === col.length - 1) {
          const card = col[col.length - 1];
          const colEl = tableauEl.children[colIndex];
          const cardEl = colEl?.children[idx];
          const fromRect = cardEl ? cardEl.getBoundingClientRect() : null;

          if (tryAutoFoundation(card, () => {
            col.pop();
            if (col.length && !col[col.length - 1].faceUp) {
              col[col.length - 1].faceUp = true;
              col[col.length - 1].animFlip = true;
            }
          }, fromRect)) return;
        }

        if (selected) {
          const moved = tryMoveSelectedTo({ type: "tableau", col: colIndex });
          clearSelection();
          if (moved) return;
          return;
        }

        if (idx === null) return;
        if (!col[idx] || !col[idx].faceUp) return;
        for (let i = idx; i < col.length - 1; i++) {
          if (!isSequential(col[i], col[i + 1])) return;
        }
        selected = { source: "tableau", col: colIndex, idx };
        render();
      }

      function getSelectedCards() {
        if (!selected) return [];
        if (selected.source === "waste") return [waste[waste.length - 1]];
        if (selected.source === "tableau") return tableau[selected.col].slice(selected.idx);
        return [];
      }

      function removeSelectedFromSource() {
        if (selected.source === "waste") {
          waste.pop();
        } else if (selected.source === "tableau") {
          const col = tableau[selected.col];
          col.splice(selected.idx);
          if (col.length && !col[col.length - 1].faceUp) {
            col[col.length - 1].faceUp = true;
            col[col.length - 1].animFlip = true;
          }
        }
      }

      function tryMoveSelectedTo(target, { animated = true } = {}) {
        if (!selected) return false;
        const cards = getSelectedCards();
        if (!cards.length) return false;
        const first = cards[0];

        let sourceEl = null;
        if (animated) {
          if (selected.source === "waste") {
            sourceEl = wasteSlot.querySelector(".waste-card:last-child");
          } else if (selected.source === "tableau") {
            const colEl = tableauEl.children[selected.col];
            sourceEl = colEl?.children[selected.idx];
          }
        }
        const fromRect = sourceEl ? sourceEl.getBoundingClientRect() : null;

        if (target.type === "foundation") {
          if (cards.length !== 1) return false;
          const pile = foundations[target.fIdx];

          if (pile.length === 0) {
            if (first.rank !== 1) return false;
          } else {
            const top = pile[pile.length - 1];
            if (first.suit !== top.suit || first.rank !== top.rank + 1) return false;
          }

          saveState(first.id);
          removeSelectedFromSource();
          pile.push(first);
          moves++; movesEl.textContent = String(moves);
          lastRealMove = null;

          render();

          if (animated && fromRect) {
            const targetEl = foundationsEl.children[target.fIdx];
            if (targetEl) {
              targetEl.style.opacity = "0";
              flyCard(first, fromRect, targetEl, () => {
                targetEl.style.opacity = "1";
                checkWin();
              });
            } else {
              checkWin();
            }
          } else {
            checkWin();
          }
          return true;
        }

        if (target.type === "tableau") {
          const destCol = tableau[target.col];
          const destTop = destCol[destCol.length - 1];

          const validEmpty = destCol.length === 0 && first.rank === 13;
          const validStack = destTop && destTop.faceUp && isSequential(destTop, first);

          if (!validEmpty && !validStack) return false;
          if (selected.source === "tableau" && selected.col === target.col) return false;

          const srcColForTracking = selected.source === "tableau" ? selected.col : null;

          saveState(first.id);
          removeSelectedFromSource();
          destCol.push(...cards);
          moves++; movesEl.textContent = String(moves);

          lastRealMove = (srcColForTracking !== null && cards.length === 1)
            ? { cardId: first.id, fromCol: srcColForTracking, toCol: target.col }
            : null;

          render();

          if (animated && fromRect) {
            const colEl = tableauEl.children[target.col];
            const targetEl = colEl ? colEl.children[destCol.length - cards.length] : null;

            if (targetEl) {
              targetEl.style.opacity = "0";
              flyCard(first, fromRect, targetEl, () => {
                targetEl.style.opacity = "1";
                checkWin();
              });
            } else {
              checkWin();
            }
          } else {
            checkWin();
          }
          return true;
        }
        return false;
      }

      function tryAutoFoundation(card, removeFn, fromRect) {
        if (!card || !card.faceUp) return false;

        let targetIdx = -1;
        if (card.rank === 1) {
          targetIdx = foundations.findIndex(p => p.length === 0);
        } else {
          targetIdx = foundations.findIndex(p => {
            if (!p.length) return false;
            const top = p[p.length - 1];
            return top.suit === card.suit && card.rank === top.rank + 1;
          });
        }

        if (targetIdx !== -1) {
          saveState(card.id);
          const targetSlotEl = foundationsEl.children[targetIdx];
          removeFn();
          moves++; movesEl.textContent = String(moves);
          lastRealMove = null;
          clearSelection();

          if (fromRect && targetSlotEl) {
            flyCard(card, fromRect, targetSlotEl, () => {
              foundations[targetIdx].push(card);
              render();
              checkWin();
            });
          } else {
            foundations[targetIdx].push(card);
            render();
            checkWin();
          }
          return true;
        }
        return false;
      }

      function canMoveToFoundation(card, pile) {
        if (!pile.length) return card.rank === 1;
        const top = pile[pile.length - 1];
        return card.suit === top.suit && card.rank === top.rank + 1;
      }

      function canMoveToTableau(cards, destCol) {
        if (!cards.length) return false;
        const first = cards[0];
        if (destCol.length === 0) return first.rank === 13;
        const destTop = destCol[destCol.length - 1];
        return destTop.faceUp && isSequential(destTop, first);
      }

      // Пріоритети ходів для підказки (менше число = кращий хід):
      // 0 — хід відкриває заховану карту в стовпці
      // 1 — хід кладе карту у фундамент (без розкриття)
      // 2 — хід повністю звільняє стовпець (можна поставити короля)
      // 3 — звичайний хід по столу/з відбою, що нічого нового не дає
      // 4 — просто тягнути карти зі стоку (додається окремо, не тут)
      function findAllPossibleMoves() {
        const movesList = [];

        if (waste.length > 0) {
          const card = waste[waste.length - 1];
          const wasteEl = wasteSlot.querySelector(".waste-card:last-child");

          for (let fIdx = 0; fIdx < foundations.length; fIdx++) {
            if (canMoveToFoundation(card, foundations[fIdx])) {
              movesList.push({
                id: `waste->found_${fIdx}`,
                type: "waste->foundation",
                fIdx,
                tier: 1,
                fromEl: wasteEl,
                toEl: foundationsEl.children[fIdx]
              });
            }
          }
          for (let cIdx = 0; cIdx < tableau.length; cIdx++) {
            if (canMoveToTableau([card], tableau[cIdx])) {
              movesList.push({
                id: `waste->tab_${cIdx}`,
                type: "waste->tableau",
                col: cIdx,
                tier: 3,
                fromEl: wasteEl,
                toEl: tableauEl.children[cIdx]
              });
            }
          }
        }

        for (let cIdx = 0; cIdx < tableau.length; cIdx++) {
          const col = tableau[cIdx];
          if (!col.length) continue;

          const topIdx = col.length - 1;
          const topCard = col[topIdx];
          if (topCard.faceUp) {
            const reveals = topIdx > 0 && !col[topIdx - 1].faceUp;
            for (let fIdx = 0; fIdx < foundations.length; fIdx++) {
              if (canMoveToFoundation(topCard, foundations[fIdx])) {
                movesList.push({
                  id: `tab_${cIdx}->found_${fIdx}`,
                  type: "tableau->foundation",
                  cIdx, fIdx,
                  tier: reveals ? 0 : 1,
                  fromEl: tableauEl.children[cIdx].lastElementChild,
                  toEl: foundationsEl.children[fIdx]
                });
              }
            }
          }

          const firstFaceUpIdx = col.findIndex((c) => c.faceUp);
          if (firstFaceUpIdx === -1) continue;

          // Реальний drag дозволяє тягнути лише повністю послідовну (по спаданню,
          // з чергуванням кольору) групу карт. Рахуємо звідки саме така група
          // починається — а не просто від першої відкритої карти, бо початкові
          // карти можуть бути валідно відкритими, але не утворювати build.
          let seqStart = col.length - 1;
          while (seqStart - 1 >= firstFaceUpIdx && isSequential(col[seqStart - 1], col[seqStart])) {
            seqStart--;
          }

          for (let i = seqStart; i < col.length; i++) {
            const cardsToMove = col.slice(i);

            for (let destCol = 0; destCol < tableau.length; destCol++) {
              if (cIdx === destCol) continue;
              if (i === 0 && tableau[destCol].length === 0) continue; // безглуздий переніс

              if (canMoveToTableau(cardsToMove, tableau[destCol])) {
                // Не радимо хід, який є точним відкатом щойно зробленого реального ходу
                // (інакше підказка «пінг-понгує» ту саму карту туди-сюди нескінченно).
                if (
                  lastRealMove &&
                  cardsToMove.length === 1 &&
                  cardsToMove[0].id === lastRealMove.cardId &&
                  destCol === lastRealMove.fromCol &&
                  cIdx === lastRealMove.toCol
                ) {
                  continue;
                }

                const reveals = i > 0 && !col[i - 1].faceUp;
                const freesColumn = i === 0;
                movesList.push({
                  id: `tab_${cIdx}_card_${i}->tab_${destCol}`,
                  type: "tableau->tableau",
                  fromCol: cIdx, cardIdx: i, toCol: destCol,
                  tier: reveals ? 0 : (freesColumn ? 2 : 3),
                  fromEl: tableauEl.children[cIdx].children[i],
                  toEl: tableauEl.children[destCol]
                });
              }
            }
          }
        }

        movesList.sort((a, b) => a.tier - b.tier);
        return movesList;
      }

      // Рахує сигнатуру стану, ЯКИЙ БУВ БИ після цього ходу — без жодної
      // мутації реального tableau/foundations/stock/waste. Потрібно лише
      // для фільтрації кандидатів підказки за tabu-списком.
      function simulateResultSignature(move) {
        const t = tableau.map((col) => col.slice());
        const f = foundations.map((p) => p.slice());
        const w = waste.slice();
        const st = stock.slice();

        if (move.type === "waste->foundation") {
          const card = w.pop();
          f[move.fIdx] = f[move.fIdx].concat([card]);
        } else if (move.type === "waste->tableau") {
          const card = w.pop();
          t[move.col] = t[move.col].concat([card]);
        } else if (move.type === "tableau->foundation") {
          const card = t[move.cIdx].pop();
          f[move.fIdx] = f[move.fIdx].concat([card]);
        } else if (move.type === "tableau->tableau") {
          const moved = t[move.fromCol].splice(move.cardIdx);
          t[move.toCol] = t[move.toCol].concat(moved);
        } else {
          return null;
        }
        return computeSignature(t, f, st, w);
      }

      // Кандидати саме ДЛЯ ПІДКАЗКИ: ті самі легальні ходи, але без тих, що
      // повертають гру у щойно відвіданий стан (tabu-список). Навмисно
      // окрема функція від findAllPossibleMoves() — та лишається "чистою"
      // перевіркою легальності й далі коректно живить hasAnyMove()/isDeadEnd(),
      // де tabu-фільтр був би шкідливим (створював би фальшивий глухий кут).
      function findHintCandidateMoves() {
        const all = findAllPossibleMoves();
        if (!stateTabuList.length) return all;

        const filtered = all.filter((m) => {
          const sig = simulateResultSignature(m);
          return sig === null || !stateTabuList.includes(sig);
        });

        // Якщо tabu-фільтр прибрав геть усе — краще показати "поганий" хід,
        // ніж нічого не порадити (сам факт відсутності гарних ходів далі
        // все одно виявить фоновий солвер).
        return filtered.length ? filtered : all;
      }

      function cloneCards(list) {
        return list.map((c) => ({ ...c }));
      }

      // Симулює майбутнє тягнення/перетасовку колоди (без зміни реального стану)
      // і шукає, через скільки натискань «тягни» зверху відбою зʼявиться карта,
      // яку реально можна кудись покласти. Повертає null, якщо це неможливо ніколи.
      function findReachableDrawMove() {
        if (!stock.length && !waste.length) return null;

        let simStock = cloneCards(stock);
        let simWaste = cloneCards(waste);
        const seen = new Set();
        const maxSteps = (stock.length + waste.length) * 2 + 6;
        let clicks = 0;

        for (let step = 0; step < maxSteps; step++) {
          const sig = simStock.map((c) => c.id).join(",") + "|" + simWaste.map((c) => c.id).join(",");
          if (seen.has(sig)) return null; // цикл замкнувся — нового вже не буде
          seen.add(sig);

          if (simWaste.length) {
            const top = simWaste[simWaste.length - 1];
            const fIdx = foundations.findIndex((pile) => canMoveToFoundation(top, pile));
            if (fIdx !== -1) return { clicks, type: "foundation", fIdx };
            const cIdx = tableau.findIndex((col) => canMoveToTableau([top], col));
            if (cIdx !== -1) return { clicks, type: "tableau", cIdx };
          }

          if (simStock.length > 0) {
            const n = Math.min(1, simStock.length);
            for (let i = 0; i < n; i++) simWaste.push(simStock.pop());
            clicks++;
          } else if (simWaste.length > 0) {
            simStock = simWaste.slice().reverse();
            simWaste = [];
            clicks++;
          } else {
            break;
          }
        }
        return null;
      }

      // Чи є взагалі хоч якийсь легальний хід зараз або після дотягування колоди?
      function hasAnyMove() {
        if (findAllPossibleMoves().length > 0) return true;
        return findReachableDrawMove() !== null;
      }

      function isDeadEnd() {
        return !finished && !hasAnyMove();
      }

      function updateDeadlockNotice() {
        if (!deadlockMsgEl) return;
        if (autoCompleting || finished) {
          deadlockMsgEl.style.display = "none";
          deadlockMsgEl.textContent = "";
          return;
        }

        // 1. Справжній глухий кут: жодного легального ходу навіть після
        //    дотягування колоди — це визначається миттєво, без солвера.
        if (isDeadEnd()) {
          deadlockMsgEl.textContent = "⚠ У цій розкладці більше немає жодного ходу — глухий кут.";
          deadlockMsgEl.style.display = "block";
          return;
        }

        // 2. Ходи технічно є, але фоновий солвер уже ДОВІВ (вичерпав пошук,
        //    а не просто не встиг), що жоден з них до перемоги не веде.
        //    Саме це і є ситуація "валет і 3 туди-сюди без вирішення" —
        //    формально не глухий кут, а по суті вже програна партія.
        const sig = liveStateSignature();
        if (lastCheckedSignature === sig && lastSolvabilityResult &&
            !lastSolvabilityResult.solvable && !lastSolvabilityResult.timedOut) {
          deadlockMsgEl.textContent = "⚠ Ходи ще є, але виграти з цієї позиції вже неможливо. Спробуй «Назад» або нову гру.";
          deadlockMsgEl.style.display = "block";
          return;
        }

        deadlockMsgEl.style.display = "none";
        deadlockMsgEl.textContent = "";

        // Запускаємо (або оновлюємо) фонову перевірку для поточного стану,
        // щоб мати відповідь готовою до наступного виклику.
        scheduleSolvabilityCheck();
      }

      function showHint() {
        document.querySelectorAll(".hint-highlight").forEach((el) => el.classList.remove("hint-highlight"));

        const realMoves = findHintCandidateMoves();

        if (!realMoves.length) {
          const info = findReachableDrawMove();
          if (info) {
            const destEl = info.type === "foundation"
              ? foundationsEl.children[info.fIdx]
              : tableauEl.children[info.cIdx];

            stockSlot.classList.add("hint-highlight");
            if (destEl) destEl.classList.add("hint-highlight");

            msgEl.textContent = info.clicks <= 1
              ? "Потрібна карта з'явиться вже після наступного тягнення."
              : `Потрібна карта з'явиться приблизно через ${info.clicks} тягнень — тягни далі.`;

            setTimeout(() => {
              stockSlot.classList.remove("hint-highlight");
              if (destEl) destEl.classList.remove("hint-highlight");
              msgEl.textContent = "";
            }, 2400);
            return;
          }
          msgEl.textContent = "Ходів більше немає — це глухий кут.";
          setTimeout(() => { msgEl.textContent = ""; }, 2500);
          return;
        }

        // Перш ніж підсвічувати черговий "технічно легальний" хід — перевіримо
        // фонову перевірку розв'язності поточної позиції.
        const sig = liveStateSignature();
        const solverReady = lastCheckedSignature === sig && !!lastSolvabilityResult;

        if (solverReady && !lastSolvabilityResult.solvable && !lastSolvabilityResult.timedOut) {
          msgEl.textContent = "Ці ходи вже нікуди не ведуть — з цієї позиції виграти неможливо. Спробуй «Назад» або нову гру.";
          setTimeout(() => { msgEl.textContent = ""; }, 3000);
          return;
        }

        // realMoves відсортовані за тіром (0 — найкращий). Якщо найкращий
        // доступний хід усе одно "нейтральний" (тір 2-3: звільнення стовпця
        // чи звичайне перекладання без розкриття) — саме тут раніше виникав
        // пінг-понг, бо тір-евристика не бачить далі одного ходу. У такому
        // разі, якщо солвер УЖЕ знайшов справжню переможну лінію, підказуємо
        // її реальний перший хід замість вгадування за тіром.
        const bestTier = realMoves[0].tier;
        if (bestTier >= 2 && solverReady && lastSolvabilityResult.solvable && lastSolvabilityResult.firstMove) {
          const target = solverMoveToHintTargets(lastSolvabilityResult.firstMove);
          if (target && (target.fromEl || target.toEl)) {
            if (target.fromEl) target.fromEl.classList.add("hint-highlight");
            if (target.toEl) target.toEl.classList.add("hint-highlight");
            setTimeout(() => {
              if (target.fromEl) target.fromEl.classList.remove("hint-highlight");
              if (target.toEl) target.toEl.classList.remove("hint-highlight");
            }, 2000);
            return;
          }
        }

        let nextMove = realMoves.find(m => !hintHistory.has(m.id));
        if (!nextMove) {
          hintHistory.clear();
          nextMove = realMoves[0];
        }

        hintHistory.add(nextMove.id);

        if (nextMove.fromEl) nextMove.fromEl.classList.add("hint-highlight");
        if (nextMove.toEl) nextMove.toEl.classList.add("hint-highlight");

        setTimeout(() => {
          if (nextMove.fromEl) nextMove.fromEl.classList.remove("hint-highlight");
          if (nextMove.toEl) nextMove.toEl.classList.remove("hint-highlight");
        }, 2000);
      }

      function foundationCount() {
        return foundations.reduce((sum, pile) => sum + pile.length, 0);
      }

      function computeScore() {
        const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
        const score = foundationCount() * 100 - Math.floor(elapsedSec / 2) - moves;
        return Math.max(10, Math.round(score));
      }

      function finishGame(won) {
        finished = true;
        clearInterval(timerHandle);
        const score = computeScore();
        resultPanel.style.display = "block";
        resultTitle.textContent = won ? "🎉 Зібрано!" : "Гра завершена";
        resultSub.textContent = `Карт на фундаменті: ${foundationCount()}/52 · Ходів: ${moves} · Очки: ${score}`;

        if (won) startWinCascade();
        updateAutoCompleteVisibility();

        if (window.AppScore) window.AppScore.sendScore("soliter", score);
        if (!window.AppAuth || !window.AppAuth.getSession()) {
          msgEl.textContent = "Увійди в профіль, щоб зберігати рекорди";
        } else {
          msgEl.textContent = "";
        }
      }

      function checkWin() {
        if (finished) return;
        if (foundationCount() === 52) finishGame(true);
      }

      let winAnimId = null;
      function startWinCascade() {
        winCanvas.style.display = "block";
        winCanvas.width = window.innerWidth;
        winCanvas.height = window.innerHeight;
        const ctx = winCanvas.getContext("2d");

        const cardsToCascade = [];
        foundations.forEach((pile) => cardsToCascade.push(...pile));

        let physicsCards = [];
        let spawnIndex = 0;

        function spawnCard() {
          if (spawnIndex >= cardsToCascade.length) return;
          const card = cardsToCascade[spawnIndex++];
          physicsCards.push({
            card,
            x: window.innerWidth / 2 + (Math.random() * 100 - 50),
            y: window.innerHeight * 0.2,
            vx: (Math.random() - 0.5) * 12,
            vy: Math.random() * -6 - 2,
            gravity: 0.45,
            bounce: 0.72
          });
        }

        const spawnTimer = setInterval(spawnCard, 120);

        function drawCardFrame(c) {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = "rgba(0,0,0,0.15)";
          ctx.beginPath();
          ctx.roundRect(-22, -31, 44, 62, 5);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = RED_SUITS.has(c.card.suit) ? "#d9455f" : "#1a1c21";
          ctx.font = "bold 12px 'Space Grotesk', sans-serif";
          ctx.fillText(rankLabel(c.card.rank), -16, -14);
          ctx.font = "18px sans-serif";
          ctx.fillText(SUIT_SYMBOL[c.card.suit], -8, 10);
          ctx.restore();
        }

        function loop() {
          ctx.clearRect(0, 0, winCanvas.width, winCanvas.height);

          physicsCards.forEach((c) => {
            c.vy += c.gravity;
            c.x += c.vx;
            c.y += c.vy;

            if (c.y + 31 >= winCanvas.height) {
              c.y = winCanvas.height - 31;
              c.vy = -c.vy * c.bounce;
            }
            if (c.x - 22 <= 0 || c.x + 22 >= winCanvas.width) {
              c.vx = -c.vx;
            }

            drawCardFrame(c);
          });

          winAnimId = requestAnimationFrame(loop);
        }

        loop();
        setTimeout(() => clearInterval(spawnTimer), 10000);
      }

      const pageEl = document.querySelector(".page");
      const actionsEl = document.querySelector(".actions");
      function syncActionsHeight() {
        if (!pageEl || !actionsEl) return;
        pageEl.style.setProperty("--actions-h", actionsEl.offsetHeight + "px");
      }
      window.addEventListener("resize", syncActionsHeight);
      window.addEventListener("orientationchange", syncActionsHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncActionsHeight);
      }
      if (window.ResizeObserver) {
        new ResizeObserver(syncActionsHeight).observe(actionsEl);
      } else {
        syncActionsHeight();
      }

      document.getElementById("undoBtn").addEventListener("click", undo);
      document.getElementById("hintBtn").addEventListener("click", showHint);
      document.getElementById("giveUpBtn").addEventListener("click", () => {
        if (finished) return;
        finishGame(false);
      });
      document.getElementById("newGameBtn").addEventListener("click", newGame);

      newGame();
    })();
</script>
</body>
</html>
