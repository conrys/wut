# Збирає Android-застосунок 41games (app/) і викладає його за постійним посиланням:
#   https://github.com/conrys/wut/releases/download/apk-latest/41games.apk
#
# Запуск із телефона: GitHub → Actions → «Build APK» → Run workflow.
# Ще запускається сам, коли змінюється оболонка застосунку (app/**).
# Звичайні зміни ігор новий APK НЕ потребують — застосунок підтягує їх сам (живі оновлення).
#
# Підпис: ключ лежить у репозиторії зашифрованим (app/android/release.jks.enc),
# пароль — у Settings → Secrets and variables → Actions → секрет APK_SIGNING_PASSWORD.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  # Поки секрету підпису нема, автоматичний запуск (push) тихо пропускається, а ручний — пояснює, що додати.
  key:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.k.outputs.ok }}
    steps:
      - id: k
        env:
          HAS: ${{ secrets.APK_SIGNING_PASSWORD != '' }}
        run: |
          echo "ok=$HAS" >> "$GITHUB_OUTPUT"
          if [ "$HAS" != "true" ]; then
            msg="Немає секрету APK_SIGNING_PASSWORD (Settings → Secrets and variables → Actions → New repository secret)."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; else echo "::notice::$msg APK не збирався."; fi
          fi

  apk:
    needs: key
    if: needs.key.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ключ підпису
        env:
          APK_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: |
          if [ -z "$APK_SIGNING_PASSWORD" ]; then
            echo "::error::Немає секрету APK_SIGNING_PASSWORD (Settings → Secrets and variables → Actions). Без нього APK не можна буде оновлювати поверх."
            exit 1
          fi
          # пароль із телефона часто вставляється з пробілом чи переносом рядка — прибираємо їх
          PW=$(printf '%s' "$APK_SIGNING_PASSWORD" | tr -d '[:space:]')
          echo "::add-mask::$PW"
          if ! PW="$PW" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/android/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:PW; then
            echo "::error::Секрет APK_SIGNING_PASSWORD не підходить до ключа (довжина ${#PW}, а має бути 28 символів: літери й цифри). Встав рядок із apk_pw.txt ще раз (Settings → Secrets and variables → Actions → APK_SIGNING_PASSWORD → Update)."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Залежності
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Файли гри → app/www
        run: |
          node scripts/vendor-deps.mjs --check
          node app/bundle.mjs www

      - name: Capacitor sync
        working-directory: app
        run: npx cap sync android

      - name: Gradle assembleRelease
        working-directory: app/android
        env:
          KEY_ALIAS: games41
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/41games.apk"
          ls -la "$GITHUB_WORKSPACE/41games.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: 41games-apk
          path: 41games.apk
          retention-days: 14

      - name: Реліз apk-latest (постійне посилання)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="1.${{ github.run_number }} · $(git rev-parse --short HEAD)"
          NOTES="41games $VER — встанови 41games.apk. Ігри оновлюються самі, новий APK потрібен лише для змін оболонки."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest 41games.apk --clobber
            gh release edit apk-latest --title "41games $VER" --notes "$NOTES"
          else
            gh release create apk-latest 41games.apk --title "41games $VER" --notes "$NOTES" --latest
          fi
