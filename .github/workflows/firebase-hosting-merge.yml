name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # список файлів із sha256 для живих оновлень Android-застосунку (app/bundle.mjs)
      - run: node app/bundle.mjs manifest
      - run: node scripts/vendor-deps.mjs --check
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KZL_CRM }}
          channelId: live
          projectId: kzl-crm
