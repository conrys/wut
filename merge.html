<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Злиття</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#21143d" />
<style>
  /* X2-блоки: кидаєш число в колонку, однакові сусіди зливаються в більше. */
  :root { --ink: #fff; --gold: #ffcf3f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none;
    background: radial-gradient(90% 60% at 50% 0%, #5a2f8a, transparent 70%), linear-gradient(180deg, #33205e, #170e2c); color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 56px); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .hud .best { font: 600 15px 'Fredoka', sans-serif; color: var(--gold); display: flex; align-items: center; gap: 6px; }
  .hud .best svg { width: 16px; height: 16px; }
  .hud .score { font: 700 44px/1.05 'Fredoka', sans-serif; font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  #ov { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(12,6,26,.6); padding: 16px; z-index: 20; }
  #ov[hidden] { display: none; }
  .card { width: 100%; max-width: 320px; background: #fff; color: #21143d; border-radius: 26px; padding: 26px 22px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.25); display: grid; gap: 10px; }
  .card h1 { margin: 0; font: 700 32px/1 'Fredoka', sans-serif; }
  .card p { margin: 0; font: 500 17px/1.4 'Fredoka', sans-serif; color: #5a4a80; }
  .card .big { font: 700 54px/1 'Fredoka', sans-serif; color: #8a4bdb; }
  .card button { justify-self: center; margin-top: 6px; border: 0; border-radius: 999px; padding: 12px 30px; background: #ff8a3d; color: #fff; font: 700 20px 'Fredoka', sans-serif; box-shadow: 0 4px 0 #c5611f; cursor: pointer; }
  .card button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c5611f; }
</style>
<link rel="stylesheet" href="js/styles/game-header.css">
<script src="js/core/game-header.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="best"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 4h14v3a5 5 0 0 1-4 4.9V14h2v3H7v-3h2v-2.1A5 5 0 0 1 5 7zm-3 1h2v2a2 2 0 0 1-2-2zm18 0h2a2 2 0 0 1-2 2z"/><rect x="6" y="18" width="12" height="2" rx="1"/></svg><span id="best">0</span></div><div class="score" id="score">0</div></div>
<div id="ov">
  <div class="card">
    <h1 id="ovT">Злиття</h1>
    <div class="big" id="ovS" hidden>0</div>
    <p id="ovP">Торкнись колонки, щоб кинути блок. Однакові числа поруч зливаються в більше — 2 і 2 дають 4, три однакові одразу — ще більше. Ланцюжки злиттів дають бонус.</p>
    <button id="ovB" type="button">Грати</button>
  </div>
</div>

<script>
(function () {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLS = 5, ROWS = 7;
  const PAL = ['#ff5d6c', '#ffb340', '#ffd23f', '#5ad16b', '#2ec4b6', '#3fc3ff', '#5d7bff', '#9b5dff', '#ff6bd6', '#ff8a3d', '#c0e84b', '#ffffff'];
  const col = (v) => PAL[(Math.log2(v) - 1) % PAL.length];
  const fmt = (v) => v >= 1e6 ? Math.round(v / 1e5) / 10 + 'M' : v >= 1e4 ? Math.round(v / 100) / 10 + 'K' : String(v);

  let W, H, cell, GX, GY, grid, next, after, score, best = 0, state = 'menu', busy = false, fx = [], pops = [], T = 0, hover = -1, chainN = 0;
  try { best = +localStorage.getItem('merge_best') || 0; } catch (e) {}
  $('best').textContent = fmt(best);

  function resize() {
    const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    const top = 210, bottom = 30;
    cell = Math.floor(Math.min((W - 24) / COLS, (H - top - bottom) / ROWS, 74));
    GX = Math.round((W - cell * COLS) / 2); GY = Math.round(top + Math.max(0, (H - top - bottom - cell * ROWS) / 2));
  }
  addEventListener('resize', resize);

  // наступне число: ширший вибір, коли на полі вже великі блоки
  function maxOnBoard() { let m = 2; for (const c of grid) for (const b of c) if (b) m = Math.max(m, b.v); return m; }
  function rollNext() { const top = Math.max(2, Math.min(64, maxOnBoard() / 8)); const opts = []; for (let v = 2; v <= top; v *= 2) opts.push(v);
    let r = Math.random() * opts.reduce((a, _, i) => a + 1 / (i + 1), 0); for (let i = 0; i < opts.length; i++) { r -= 1 / (i + 1); if (r <= 0) return opts[i]; } return 2; }
  function start() {
    grid = Array.from({ length: COLS }, () => []); score = 0; fx = []; pops = []; busy = false; chainN = 0;
    next = 2; after = rollNext(); state = 'play'; $('score').textContent = 0; $('ov').hidden = true;
  }

  // ---------- логіка ----------
  // клітинка: grid[c][r] = { v, y (рядок для малювання, тягнеться до r), pop }
  const at = (c, r) => (c >= 0 && c < COLS && grid[c][r]) || null;
  function gravity() { for (let c = 0; c < COLS; c++) grid[c] = grid[c].filter(Boolean); }
  const wait = (ms) => new Promise((res) => setTimeout(res, reduce ? Math.min(ms, 60) : ms));

  async function drop(c) {
    if (state !== 'play' || busy) return;
    if (grid[c].length >= ROWS) {
      // повна колонка: дозволено лише, якщо верхній блок такий самий (тоді зіллються)
      const topB = grid[c][ROWS - 1];
      if (!topB || topB.v !== next) { pops.push({ t: 'Колонка повна', x: GX + (c + 0.5) * cell, y: GY + cell, l: 0.9 }); return; }
    }
    busy = true;
    const b = { v: next, y: ROWS + 0.5, pop: 0 };
    let landed = c;
    if (grid[c].length >= ROWS) { grid[c][ROWS - 1].v *= 2; grid[c][ROWS - 1].pop = 0.25; score += grid[c][ROWS - 1].v; }
    else grid[c].push(b);
    next = after; after = rollNext();
    await wait(140);
    chainN = 0;
    // злиття, поки є що зливати (останній рухомий блок — головний)
    let focus = [[landed, grid[landed].length - 1]];
    for (let guard = 0; guard < 60 && focus.length; guard++) {
      const [fc, fr] = focus.shift(); const me = at(fc, fr); if (!me) continue;
      const nb = [[fc - 1, fr], [fc + 1, fr], [fc, fr - 1]].filter(([x, y]) => { const o = at(x, y); return o && o.v === me.v; });
      if (!nb.length) continue;
      chainN++;
      for (const [x, y] of nb) { fx.push({ x: GX + (x + 0.5) * cell, y: GY + (ROWS - y - 0.5) * cell, tx: GX + (fc + 0.5) * cell, ty: GY + (ROWS - fr - 0.5) * cell, v: me.v, t: 0 }); grid[x][y] = null; }
      me.v *= 2 ** nb.length; me.pop = 0.3;
      const gain = me.v * (chainN > 1 ? chainN : 1);
      score += gain; $('score').textContent = fmt(score);
      pops.push({ t: (chainN > 1 ? 'Ланцюжок ×' + chainN + '  ' : '') + '+' + fmt(gain), x: GX + (fc + 0.5) * cell, y: GY + (ROWS - fr - 1) * cell, l: 1 });
      try { navigator.vibrate && navigator.vibrate(chainN > 1 ? 30 : 12); } catch (e) {}
      await wait(170);
      gravity();
      // після осідання перевіряємо всіх, хто міг змінити сусідів
      focus = [];
      for (let x = 0; x < COLS; x++) for (let y = 0; y < grid[x].length; y++) if (grid[x][y].pop > 0 || Math.abs(grid[x][y].y - y) > 0.01) focus.push([x, y]);
      const mePos = (() => { for (let x = 0; x < COLS; x++) { const y = grid[x].indexOf(me); if (y >= 0) return [x, y]; } return null; })();
      if (mePos) focus.unshift(mePos);
      await wait(120);
    }
    $('score').textContent = fmt(score);
    busy = false;
    if (grid.every((c2, i) => c2.length >= ROWS && grid[i][ROWS - 1].v !== next)) over();
  }

  function over() {
    state = 'over';
    const rec = score > best;
    if (rec) { best = score; try { localStorage.setItem('merge_best', best); } catch (e) {} $('best').textContent = fmt(best); }
    $('ovT').textContent = rec ? 'Новий рекорд!' : 'Місця немає'; $('ovS').hidden = false; $('ovS').textContent = fmt(score);
    $('ovP').textContent = 'Найбільший блок: ' + fmt(maxOnBoard()) + (rec ? '' : ' · рекорд ' + fmt(best));
    $('ovB').textContent = 'Ще раз'; $('ov').hidden = false;
    if (window.AppScore) window.AppScore.sendScore('merge', score);
  }
  $('ovB').addEventListener('click', start);

  const colAt = (x) => { const c = Math.floor((x - GX) / cell); return c >= 0 && c < COLS ? c : -1; };
  cv.addEventListener('pointermove', (e) => { hover = colAt(e.clientX); });
  cv.addEventListener('pointerdown', (e) => { const c = colAt(e.clientX); if (c >= 0 && e.clientY > GY - cell * 1.6) drop(c); });
  addEventListener('keydown', (e) => { const k = +e.key; if (k >= 1 && k <= COLS) drop(k - 1); });

  // ---------- малювання ----------
  function tile(x, y, s, v, a) {
    ctx.globalAlpha = a == null ? 1 : a;
    const c = col(v), r = s * 0.2;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.roundRect(x + 3, y + 6, s - 6, s - 6, r); ctx.fill();
    ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x + 3, y + 3, s - 6, s - 6, r); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.beginPath(); ctx.roundRect(x + s * 0.14, y + s * 0.1, s * 0.72, s * 0.18, r * 0.6); ctx.fill();
    const txt = fmt(v), fs = s * (txt.length <= 2 ? 0.46 : txt.length === 3 ? 0.38 : 0.3);
    ctx.font = "700 " + Math.round(fs) + "px 'Fredoka', sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(2, s * 0.06); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.strokeText(txt, x + s / 2, y + s / 2 + 1);
    ctx.fillStyle = v >= 4096 && PAL[(Math.log2(v) - 1) % PAL.length] === '#ffffff' ? '#21143d' : '#fff'; ctx.fillText(txt, x + s / 2, y + s / 2 + 1);
    ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    // колонки
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = c === hover && state === 'play' ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.05)';
      ctx.beginPath(); ctx.roundRect(GX + c * cell + 3, GY, cell - 6, cell * ROWS, cell * 0.2); ctx.fill();
    }
    // блоки
    for (let c = 0; c < COLS; c++) for (let r = 0; r < grid[c].length; r++) {
      const b = grid[c][r], k = 1 + (b.pop > 0 ? b.pop * 0.6 : 0), s = cell * k;
      tile(GX + c * cell - (s - cell) / 2, GY + (ROWS - 1 - b.y) * cell - (s - cell) / 2, s, b.v);
    }
    // злиття: блоки летять до центру
    for (const f of fx) { const k = Math.min(1, f.t / 0.17); tile(f.x + (f.tx - f.x) * k - cell / 2, f.y + (f.ty - f.y) * k - cell / 2, cell * (1 - k * 0.4), f.v, 1 - k); }
    // наступний
    if (state === 'play' || state === 'menu') {
      const nx = hover >= 0 ? GX + hover * cell : W / 2 - cell / 2, ny = GY - cell * 1.35;
      tile(nx, ny, cell, next);
      ctx.font = "600 13px 'Fredoka', sans-serif"; ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.textAlign = 'right';
      ctx.fillText('далі', W - 14 - cell * 0.55 - 6, ny + cell * 0.35);
      tile(W - 14 - cell * 0.55, ny + cell * 0.1, cell * 0.55, after, 0.8);
    }
    ctx.textAlign = 'center';
    for (const p of pops) { const dy = (1 - p.l) * 40; ctx.globalAlpha = Math.min(1, p.l * 1.6);
      ctx.font = "700 " + Math.round(cell * 0.36) + "px 'Fredoka', sans-serif"; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,40,.7)';
      ctx.strokeText(p.t, p.x, p.y - dy); ctx.fillStyle = '#ffcf3f'; ctx.fillText(p.t, p.x, p.y - dy); ctx.globalAlpha = 1; }
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
    for (let c = 0; c < COLS; c++) for (let r = 0; r < grid[c].length; r++) { const b = grid[c][r];
      if (b.y > r) b.y = Math.max(r, b.y - dt * (reduce ? 60 : 22)); else b.y = r; if (b.pop > 0) b.pop = Math.max(0, b.pop - dt); }
    for (const f of fx) f.t += dt; fx = fx.filter((f) => f.t < 0.17);
    for (const p of pops) p.l -= dt; pops = pops.filter((p) => p.l > 0);
    draw(); requestAnimationFrame(frame);
  }
  resize();
  grid = Array.from({ length: COLS }, () => []); next = 2; after = 2; score = 0;
  requestAnimationFrame(frame);
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/app-settings.js"></script>
<script src="js/core/login.js"></script>
<script src="js/core/score-connect.js"></script>
<script src="js/core/records.js"></script>
<script src="js/core/back-button.js"></script>
</body>
</html>
