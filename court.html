<!-- Гра: Суд Лінча — зала суду: дерево, латунь, папка справи, печатка вироку -->
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Суд Лінча</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lora:wght@500;700&family=PT+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="js/styles/party-shared.css">
<link rel="stylesheet" href="js/styles/game-header.css">
<script src="js/core/game-header.js" defer></script>
<style>
:root {
  --bg: #1a100a; --panel: rgba(255,232,190,.05); --panel-2: rgba(255,232,190,.09);
  --ink: #f6ead2; --muted: rgba(246,234,210,.6); --line: rgba(201,162,74,.28);
  --accent: #c9a24a; --accent-ink: #23170b; --good: #6fbf7e; --bad: #e0574b;
  --paper: #efe3c4; --paper-ink: #2b1d12; --red: #b0281f; --green: #2f7040;
  --font-d: 'Playfair Display', Georgia, serif; --font-b: 'Lora', Georgia, serif; --mono: 'PT Mono', monospace;
  --hdr-bg: rgba(26,16,10,.8);
  --drink-bg: linear-gradient(135deg, #8a2a1c, #c0562b);
  --r: 14px; --r-sm: 10px;
}
/* дерев'яні панелі зали */
body { background:
  radial-gradient(120% 80% at 50% 0%, transparent 40%, rgba(0,0,0,.65) 100%),
  repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 74px),
  repeating-linear-gradient(90deg, rgba(255,200,140,.035) 0 1px, transparent 1px 9px, rgba(0,0,0,.05) 9px 11px, transparent 11px 23px),
  linear-gradient(180deg, #3a2414, #24160c 60%, #170d07) fixed; }
.pp-card { background: linear-gradient(180deg, rgba(60,36,18,.85), rgba(40,24,12,.85)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,220,160,.08), 0 6px 18px rgba(0,0,0,.35); }
.pp-hero h1, .pp-lobby-head .t b, .pp-sumtitle { color: var(--accent); text-shadow: 0 2px 0 #000; }
.pp-hero h1 { font-size: 38px; }
.pp-primary { background: linear-gradient(180deg, #e3c06a, #b38a33); color: #23170b; border: 1px solid #7a5a1c; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 4px 0 #6b4d16; font-weight: 900; }
.pp-primary:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 1px 0 #6b4d16; }
.pp-h { font-family: var(--font-b); color: var(--accent); }
.pp-stagetitle { font-family: var(--font-d); letter-spacing: .16em; color: var(--accent); }

/* етапи засідання */
.ct-steps { display: flex; gap: 6px; }
.ct-steps i { flex: 1; font: 700 10px var(--font-b); font-style: normal; text-align: center; letter-spacing: .1em; text-transform: uppercase; padding: 6px 0;
  border-bottom: 3px solid var(--line); color: var(--muted); }
.ct-steps i.on { border-color: var(--accent); color: var(--accent); }
.ct-steps i.done { border-color: rgba(201,162,74,.55); color: rgba(201,162,74,.7); }

/* папка справи */
.ct-case { position: relative; padding: 16px 16px 18px; border-radius: 4px 4px 10px 10px; background:
  linear-gradient(180deg, rgba(0,0,0,.04), transparent 30%), repeating-linear-gradient(180deg, transparent 0 27px, rgba(80,50,20,.12) 27px 28px), var(--paper);
  color: var(--paper-ink); box-shadow: 0 10px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.25); transform: rotate(-.6deg); overflow: hidden; }
.ct-case::before { content: ""; position: absolute; top: -10px; left: 18px; width: 90px; height: 18px; border-radius: 6px 6px 0 0; background: #d9c69a; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.ct-case-top { display: flex; justify-content: space-between; font: 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: rgba(43,29,18,.65);
  border-bottom: 1px dashed rgba(43,29,18,.35); padding-bottom: 8px; }
.ct-case-top b { color: var(--red); font-weight: 400; }
.ct-label { margin-top: 10px; font: 700 11px var(--font-b); letter-spacing: .16em; text-transform: uppercase; color: rgba(43,29,18,.55); }
.ct-charge { margin-top: 4px; font: 18px/1.45 var(--mono); text-wrap: pretty; }
.ct-case.sm .ct-charge { font-size: 14px; }
.ct-stampmark { position: absolute; right: 10px; bottom: 12px; padding: 6px 14px; border: 4px double currentColor; border-radius: 6px; font: 900 26px var(--font-d);
  letter-spacing: .08em; text-transform: uppercase; transform: rotate(-12deg); opacity: .88; mix-blend-mode: multiply;
  animation: ctStamp .45s cubic-bezier(.3,1.6,.5,1) both 1.05s; }
.ct-stampmark.guilty { color: var(--red); } .ct-stampmark.forgive { color: var(--green); } .ct-stampmark.tie { color: #6b5520; }
@keyframes ctStamp { from { opacity: 0; transform: rotate(-12deg) scale(2.6); } }

/* трибуна */
.ct-floor { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r); background: linear-gradient(180deg, rgba(201,162,74,.12), rgba(201,162,74,.03)); border: 1px solid var(--line); }
.ct-floor .pav { filter: drop-shadow(0 8px 10px rgba(0,0,0,.45)); }
.ct-plaque { flex: 1; min-width: 0; }
.ct-plaque small { display: block; font: 700 10px var(--font-b); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.ct-plaque b { display: block; margin: 2px 0; font: 900 24px/1.1 var(--font-d); overflow-wrap: anywhere; }
.ct-plaque span { display: inline-block; padding: 2px 10px; border-radius: 3px; background: linear-gradient(180deg, #e3c06a, #a57d2c); color: #23170b; font: 700 12px var(--font-b); }
.ct-mic { position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; font-size: 26px; color: var(--accent); }
.ct-mic::before, .ct-mic::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: ctWave 1.6s ease-out infinite; }
.ct-mic::after { animation-delay: .8s; }
@keyframes ctWave { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
.ct-hint { text-align: center; font: italic 500 15px var(--font-b); color: var(--ink); }
.ct-hint.me { font: 700 17px var(--font-d); color: var(--accent); }
.ct-next { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); }

/* лава підсудних */
.ct-dock { display: flex; justify-content: center; gap: 22px; }
.ct-dock div { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; }
.ct-dock small { font: 700 9px var(--font-b); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }

/* вирок: печатки */
.ct-verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ct-stamp { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 8px 14px; border-radius: 12px;
  border: 3px solid currentColor; background: rgba(0,0,0,.25); transition: transform .2s cubic-bezier(.3,1.6,.5,1), background .2s, box-shadow .2s; }
.ct-stamp .ic { font-size: 38px; }
.ct-stamp b { font: 900 22px var(--font-d); letter-spacing: .06em; text-transform: uppercase; }
.ct-stamp small { font-size: 11px; color: var(--muted); }
.ct-stamp.guilty { color: #ef6a5c; } .ct-stamp.forgive { color: #7fd08e; }
.ct-stamp:active { transform: scale(.95); }
.ct-stamp.selected { transform: rotate(-4deg) scale(1.03); background: currentColor; box-shadow: 0 0 0 4px rgba(0,0,0,.3), 0 10px 22px rgba(0,0,0,.45); }
.ct-stamp.selected .ic, .ct-stamp.selected b { color: #1a100a; } .ct-stamp.selected small { color: rgba(26,16,10,.7); }
.ct-verdict.voted .ct-stamp:not(.selected) { opacity: .5; }

/* молоток */
.ct-bench { position: relative; }
.ct-gavel { position: absolute; z-index: 3; right: -6px; top: -26px; width: 92px; height: 92px; transform-origin: 30% 85%;
  animation: ctSlam .7s cubic-bezier(.6,0,.4,1.4) both .25s; filter: drop-shadow(0 6px 6px rgba(0,0,0,.5)); }
@keyframes ctSlam { 0% { transform: rotate(-55deg) translateY(-10px); opacity: 0; } 30% { opacity: 1; } 70% { transform: rotate(8deg); } 100% { transform: rotate(0); } }
.ct-bench.shake .ct-case { animation: ctShake .3s ease-out .78s; }
@keyframes ctShake { 30% { transform: rotate(-.6deg) translateY(3px); } 60% { transform: rotate(-.6deg) translateY(-1px); } }
.ct-result { display: flex; align-items: center; gap: 14px; }
.ct-result .t { flex: 1; min-width: 0; }
.ct-result b { display: block; font: 900 22px/1.15 var(--font-d); }
.ct-result small { font-size: 13px; color: var(--muted); }
.ct-tally { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ct-tally div { text-align: center; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.2); }
.ct-tally b { display: block; font: 900 30px var(--font-d); }
.ct-tally span { font: 700 11px var(--font-b); letter-spacing: .12em; text-transform: uppercase; }
.ct-tally .g { color: #ef6a5c; } .ct-tally .f { color: #7fd08e; }
.ct-tally .win { border-color: currentColor; background: rgba(255,255,255,.06); }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/app-settings.js"></script>
<link rel="stylesheet" href="js/styles/reactions.css">
<script src="js/core/login.js"></script>
<script src="js/core/online-engine.js"></script>
<script src="js/quiplash-avatars.js"></script>
<script src="js/quiplash-sounds.js"></script>
<script src="js/promts/party-seed.js"></script>
<script src="js/party-modes.js"></script>
<script>window.PartyConfig = { mode: "court", gameKey: "party_court" };</script>
<script src="js/party-game.js"></script>
<script src="js/core/room-code-ui.js"></script>
<script src="js/party-ui.js"></script>
<script src="js/core/reactions.js"></script>
<script src="js/core/game-pause.js"></script>
<script src="js/core/help.js"></script>
<script src="js/core/back-button.js"></script>
<script>
(function () {
  const { esc, icon } = window.PartyUI;
  const STEPS = ["accused", "lawyer", "verdict", "result"];
  const STAMP = { guilty: "Винен", forgive: "Прощено", tie: "Нічия" };
  const GAVEL = `<svg class="ct-gavel" viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-30 50 50)">
    <rect x="44" y="44" width="10" height="52" rx="5" fill="#8a5a2e" stroke="#2b1a0e" stroke-width="3"/>
    <rect x="20" y="20" width="58" height="26" rx="6" fill="#7a4a24" stroke="#2b1a0e" stroke-width="3"/>
    <rect x="16" y="22" width="9" height="22" rx="2" fill="#d6b25a" stroke="#2b1a0e" stroke-width="2"/>
    <rect x="73" y="22" width="9" height="22" rx="2" fill="#d6b25a" stroke="#2b1a0e" stroke-width="2"/>
    <path d="M30 26h36" stroke="#a8743e" stroke-width="3" stroke-linecap="round"/></g></svg>`;
  const manual = (room) => room.settings && room.settings.courtAutoAdvance === false;

  function steps(cur) {
    const idx = STEPS.indexOf(cur);
    return `<div class="ct-steps">${["Звинувачений", "Адвокат", "Вирок"].map((t, i) => `<i class="${i === idx ? "on" : i < idx ? "done" : ""}">${t}</i>`).join("")}</div>`;
  }
  function caseFile(c, small, stamp) {
    const text = String(c.st.text || "").replace(/^Звинувачений\s*/i, "");
    return `<div class="ct-case ${small ? "sm" : ""}"><div class="ct-case-top"><span>Справа № <b>${c.room.roundNo + 1}</b></span><span>Зала засідань</span></div>
      <div class="ct-label">Звинувачений(-а)</div><div class="ct-charge">${esc(text)}</div>${stamp || ""}</div>`;
  }

  window.PartyUI.mount({
    title: "Суд Лінча",
    tagline: "Абсурдні звинувачення, пристрасний захист і вирок присяжних",
    emblem: `<svg class="pp-emblem" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="#c9a24a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 22v72M38 104h44M46 95h28"/><path d="M22 36q38-10 76 0"/>
      <path d="M28 36L16 66M28 36l12 30M12 66a16 7 0 0 0 32 0z"/><path d="M92 36L80 66M92 36l12 30M76 66a16 7 0 0 0 32 0z"/></g>
      <circle cx="60" cy="18" r="6" fill="#c9a24a"/></svg>`,
    rules: [
      "Кожен раунд суд розглядає абсурдну справу. Одного гравця звинувачують, іншого призначають адвокатом.",
      "Спершу звинувачений вголос виправдовується, потім адвокат його захищає. На кожен виступ свій час.",
      "Решта — присяжні: таємно ставлять печатку «Винен» або «Простити».",
      "Винен — п'є звинувачений. Простили — п'ють присяжні, а адвокат отримує бал. Порівну — п'є адвокат.",
    ],
    sliders: [{ key: "courtSpeakSeconds", label: "Час на кожен виступ" }, { key: "voteSeconds", label: "Час на вирок" }],
    segs: [{ id: "adv", label: "Передавання слова", items: [[1, "Автоматично"], [0, "Вручну"]],
      get: (s) => (s.courtAutoAdvance === false ? 0 : 1), set: (v) => ({ courtAutoAdvance: v === 1 }),
      note: "Вручну — після таймера ведучий передає слово кнопкою «Далі»." }],
    stageTitle: (c) => ({ accused: "Слово звинуваченому", lawyer: "Слово адвокату", verdict: "Присяжні радяться" }[(c.st.data || {}).step] || "Вирок"),
    timerNote: (room, st, sec) => (st.kind === "show" && manual(room) && sec === 0 ? "стоп" : null),

    build(c) {
      const { st, room } = c, d = st.data || {};
      if (st.kind === "show") {
        const speaker = d.step === "lawyer" ? d.lawyer : d.accused;
        const role = d.step === "lawyer" ? "Адвокат" : "Звинувачений";
        const isMe = speaker === c.me;
        const next = d.step === "lawyer" ? "Далі: вирок присяжних" : `Далі: адвокат ${d.lawyer}`;
        const hint = isMe ? (d.step === "lawyer" ? "Твій вихід! Захищай будь-яким абсурдом" : "Твій вихід! Виправдовуйся вголос")
          : (d.step === "lawyer" ? "Адвокат захищає підзахисного" : "Звинувачений виправдовується");
        return steps(d.step) + caseFile(c) +
          `<div class="ct-floor">${c.avatar(speaker, { size: "xl", mood: "write" })}<div class="ct-plaque"><small>Слово має</small><b>${esc(speaker)}</b><span>${role}</span></div><div class="ct-mic">${icon("mic")}</div></div>` +
          `<div class="ct-hint ${isMe ? "me" : ""}">${esc(hint)}</div><div class="ct-next">${esc(next)}</div>` +
          (manual(room) ? '<div class="pp-note">Слово передає ведучий кнопкою «Далі»</div>' : "");
      }
      if (st.kind === "choice") {
        const dock = `<div class="ct-dock"><div>${c.avatar(d.accused, { size: "md", mood: "sad" })}<small>Звинувачений</small>${esc(d.accused)}</div>
          <div>${c.avatar(d.lawyer, { size: "md", mood: "write" })}<small>Адвокат</small>${esc(d.lawyer)}</div></div>`;
        if (!c.iExpected) return steps("verdict") + caseFile(c, true) + dock + '<div class="ct-hint">Присяжні радяться… Тримайся.</div>';
        return steps("verdict") + caseFile(c, true) + dock +
          `<div class="ct-verdict"><button class="ct-stamp guilty" data-answer="guilty">${icon("gavel")}<b>Винен</b><small>п'є звинувачений</small></button>
            <button class="ct-stamp forgive" data-answer="forgive">${icon("dove")}<b>Простити</b><small>п'є весь суд</small></button></div>`;
      }
      if (st.kind === "reveal") {
        const v = d.verdict || "tie";
        const who = v === "tie" ? d.lawyer : d.accused;
        const mood = v === "guilty" ? "sad" : v === "forgive" ? "happy" : "shock";
        const sub = v === "guilty" ? "Більшість проти. Звинувачений п'є" : v === "forgive" ? `${d.lawyer} переконав(ла) суд: +1 бал. П'ють присяжні` : `${d.lawyer} п'є за нічию`;
        return `<div class="ct-bench shake">${GAVEL}${caseFile(c, false, `<div class="ct-stampmark ${v}">${STAMP[v]}</div>`)}</div>` +
          `<div class="pp-card ct-result">${c.avatar(who, { size: "lg", mood })}<div class="t"><b>${esc(st.headline || "")}</b><small>${esc(sub)}</small></div></div>` +
          `<div class="ct-tally"><div class="g ${v === "guilty" ? "win" : ""}"><b>${d.guilty || 0}</b><span>Винен</span></div><div class="f ${v === "forgive" ? "win" : ""}"><b>${d.forgive || 0}</b><span>Простити</span></div></div>`;
      }
      return caseFile(c);
    },
    update(el, c) {
      const v = el.querySelector(".ct-verdict");
      if (v) v.classList.toggle("voted", !!c.mine);
    },
    onStage(c) {
      const d = c.st.data || {};
      if (c.st.kind === "reveal") {
        setTimeout(() => c.sfx("drum"), 250);
        setTimeout(() => c.sfx(d.verdict === "forgive" ? "cheer" : "buzz"), 1050);
        if ((c.st.penalties || {})[c.me]) c.buzz([80, 50, 80]);
      } else if (c.st.kind === "choice") c.sfx("vs");
      else c.sfx("chime");
    },
  });
})();
</script>
</body>
</html>
