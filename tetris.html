<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Тетріс</title>
  <style>
    :root {
      --shell-bg: #1c1f1a;
      --screen-bg: #c9d1bd;
      --screen-border: #333c2e;
      --cell-outline: #3a4536;
      --cell-fill: #333f2f;
      --text-dark: #333f2f;
      --text-muted: #5a6652;
    }
    * {
      box-sizing: border-box; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0; padding: 0; min-height: 100dvh; background: var(--shell-bg);
      font-family: 'Courier New', monospace; overflow-x: hidden; overflow-y: auto;
      touch-action: manipulation;
    }
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 100dvh;
      box-sizing: border-box;
      padding: 0 12px 12px 12px;
    }
    .console {
      background: var(--shell-bg);
      padding: 16px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }
    .screen {
      background: var(--screen-bg);
      border: 6px solid var(--screen-border);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      gap: 10px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.35);
    }
    #board {
      display: block;
      background: var(--screen-bg);
      border: 3px solid var(--cell-outline);
      image-rendering: pixelated;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: var(--text-dark);
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }
    .panel-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      font-weight: bold;
      border-bottom: 2px solid var(--text-dark);
      padding-bottom: 2px;
      margin-bottom: 4px;
    }
    .panel-value {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.1;
    }
    #nextCanvas {
      background: var(--screen-bg);
      border: 3px solid var(--cell-outline);
      image-rendering: pixelated;
      display: block;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .ctrl-btn {
      background: var(--screen-border);
      color: var(--screen-bg);
      border: none;
      border-radius: 10px;
      padding: 14px 0;
      font-size: 18px;
      font-family: inherit;
      font-weight: bold;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .ctrl-btn:active { background: #555; }
    .ctrl-btn--wide { grid-column: 1 / -1; }
    .ctrl-btn--orange {
      background: #e08a1e;
      color: #241c0c;
    }
    .ctrl-btn--orange:active { background: #c8770f; }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #cfd6c4;
      font-size: 13px;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .top-row button {
      background: none;
      border: 1px solid #cfd6c4;
      color: #cfd6c4;
      border-radius: 6px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 12px;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #overlay {
      position: absolute; inset: 0;
      background: rgba(201, 209, 189, 0.92);
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 10px;
      text-align: center;
      color: var(--text-dark);
      font-weight: bold;
    }
    .board-wrap { position: relative; }
  </style>
</head>
<body>
<div class="page">
  <div class="console">
    <div class="top-row">
      <span>ТЕТРІС</span>
      <button id="pauseBtn">Пауза</button>
    </div>
    <div class="screen">
      <div class="board-wrap">
        <canvas id="board"></canvas>
        <div id="overlay">
          <div id="overlayText">ПАУЗА</div>
          <div id="speedSetting" style="display:flex; flex-direction:column; gap:6px; align-items:center;">
            <label for="speedSelect" style="font-size:11px; letter-spacing:0.06em;">ШВИДКІСТЬ</label>
            <select id="speedSelect" style="font-family:inherit; font-size:13px; padding:6px 10px; border-radius:6px; border:1px solid var(--text-dark); background:var(--screen-bg); color:var(--text-dark);">
              <option value="0.6">Повільно</option>
              <option value="1" selected>Звичайна</option>
              <option value="1.5">Швидко</option>
              <option value="2.2">Дуже швидко</option>
            </select>
          </div>
          <button class="ctrl-btn" id="overlayBtn" style="padding:10px 20px;">Почати</button>
        </div>
      </div>
      <div class="sidebar">
        <div>
          <div class="panel-label">РАХУНОК</div>
          <div class="panel-value" id="scoreVal">0</div>
        </div>
        <div>
          <div class="panel-label">НАСТУПНА</div>
          <canvas id="nextCanvas" width="72" height="72"></canvas>
        </div>
        <div>
          <div class="panel-label">ЛІНІЇ</div>
          <div class="panel-value" id="linesVal">0</div>
        </div>
        <div>
          <div class="panel-label">РІВЕНЬ</div>
          <div class="panel-value" id="levelVal">1</div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnRotate">⟳</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
      <button class="ctrl-btn" id="btnDown">▼</button>
      <button class="ctrl-btn ctrl-btn--wide ctrl-btn--orange" id="btnHardDrop">⤓ СКИНУТИ ВНИЗ</button>
    </div>
  </div>
</div>

<script>
  (function () {
    const COLS = 10, ROWS = 20;
    let CELL = 26;
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');

    function computeCellSize() {
      const vw = Math.min(window.innerWidth, 640);
      const vh = window.innerHeight;
      const reservedWidth = 24 + 32 + 12 + 20 + 10 + 78 + 6;
      const availW = Math.floor((vw - reservedWidth) / COLS);
      const reservedHeight = 24 + 32 + 34 + 20 + 12 + 6 + 190 + 60; // враховуємо висоту шапки
      const availH = Math.floor((vh - reservedHeight) / ROWS);
      CELL = Math.max(12, Math.min(26, availW, availH));
    }
    computeCellSize();
    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;

    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');

    const overlay = document.getElementById('overlay');
    const overlayText = document.getElementById('overlayText');
    const overlayBtn = document.getElementById('overlayBtn');
    const speedSetting = document.getElementById('speedSetting');
    const speedSelect = document.getElementById('speedSelect');
    const scoreVal = document.getElementById('scoreVal');
    const linesVal = document.getElementById('linesVal');
    const levelVal = document.getElementById('levelVal');
    const btnHardDrop = document.getElementById('btnHardDrop');
    let speedMultiplier = 1;
    let hardDropMode = 'drop';

    function setHardDropMode(mode) {
      hardDropMode = mode;
      btnHardDrop.textContent = mode === 'start' ? '▶ ПОЧАТИ ГРУ' : '⤓ СКИНУТИ ВНИЗ';
    }

    const SHAPES = {
      I: [
        [[0,1],[1,1],[2,1],[3,1]],
        [[2,0],[2,1],[2,2],[2,3]],
        [[0,2],[1,2],[2,2],[3,2]],
        [[1,0],[1,1],[1,2],[1,3]],
      ],
      O: [
        [[1,0],[2,0],[1,1],[2,1]],
        [[1,0],[2,0],[1,1],[2,1]],
        [[1,0],[2,0],[1,1],[2,1]],
        [[1,0],[2,0],[1,1],[2,1]],
      ],
      T: [
        [[1,0],[0,1],[1,1],[2,1]],
        [[1,0],[1,1],[2,1],[1,2]],
        [[0,1],[1,1],[2,1],[1,2]],
        [[1,0],[0,1],[1,1],[1,2]],
      ],
      S: [
        [[1,0],[2,0],[0,1],[1,1]],
        [[1,0],[1,1],[2,1],[2,2]],
        [[1,1],[2,1],[0,2],[1,2]],
        [[0,0],[0,1],[1,1],[1,2]],
      ],
      Z: [
        [[0,0],[1,0],[1,1],[2,1]],
        [[2,0],[1,1],[2,1],[1,2]],
        [[0,1],[1,1],[1,2],[2,2]],
        [[1,0],[0,1],[1,1],[0,2]],
      ],
      J: [
        [[0,0],[0,1],[1,1],[2,1]],
        [[1,0],[2,0],[1,1],[1,2]],
        [[0,1],[1,1],[2,1],[2,2]],
        [[1,0],[1,1],[0,2],[1,2]],
      ],
      L: [
        [[2,0],[0,1],[1,1],[2,1]],
        [[1,0],[1,1],[1,2],[2,2]],
        [[0,1],[1,1],[2,1],[0,2]],
        [[0,0],[1,0],[1,1],[1,2]],
      ],
    };
    const TYPES = Object.keys(SHAPES);

    function emptyBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    let board = emptyBoard();
    let current = null;
    let nextType = null;
    let score = 0, lines = 0, level = 1;
    let dropTimer = 0, lastTime = 0;
    let phase = 'playing';
    let clearing = null;
    const CLEAR_DURATION = 380;

    function randomType() { return TYPES[Math.floor(Math.random() * TYPES.length)]; }

    function spawnPiece() {
      const type = nextType || randomType();
      nextType = randomType();
      const piece = { type, rot: 0, x: 3, y: -1 };
      if (collides(piece, 0, 0)) {
        phase = 'gameover';
        showOverlay('ГРА ЗАКІНЧЕНА', 'Нова гра', true);
        window.AppScore && window.AppScore.sendScore('tetris', score);
        return;
      }
      current = piece;
      drawNext();
    }

    function cellsOf(piece) {
      return SHAPES[piece.type][piece.rot].map(([cx, cy]) => [piece.x + cx, piece.y + cy]);
    }

    function collides(piece, dx, dy, rotOverride) {
      const rot = rotOverride !== undefined ? rotOverride : piece.rot;
      const cells = SHAPES[piece.type][rot].map(([cx, cy]) => [piece.x + cx + dx, piece.y + cy + dy]);
      for (const [x, y] of cells) {
        if (x < 0 || x >= COLS || y >= ROWS) return true;
        if (y >= 0 && board[y][x]) return true;
      }
      return false;
    }

    function lockPiece() {
      for (const [x, y] of cellsOf(current)) {
        if (y >= 0) board[y][x] = 1;
      }
      const fullRows = [];
      for (let y = 0; y < ROWS; y++) {
        if (board[y].every((c) => c)) fullRows.push(y);
      }
      if (fullRows.length) {
        phase = 'clearing';
        clearing = { rows: fullRows, startTime: performance.now() };
      } else {
        current = null;
        spawnPiece();
      }
    }

    function finalizeClear() {
      const rowsToRemove = clearing.rows;
      const n = rowsToRemove.length;
      board = board.filter((_, y) => !rowsToRemove.includes(y));
      while (board.length < ROWS) board.unshift(Array(COLS).fill(0));

      const points = [0, 40, 100, 300, 1200][n] * level;
      score += points;
      lines += n;
      level = Math.floor(lines / 10) + 1;
      scoreVal.textContent = score;
      linesVal.textContent = lines;
      levelVal.textContent = level;

      clearing = null;
      phase = 'playing';
      current = null;
      spawnPiece();
    }

    function dropInterval() {
      return Math.max(80, (800 - (level - 1) * 60) / speedMultiplier);
    }

    function move(dx) {
      if (phase !== 'playing' || !current) return;
      if (!collides(current, dx, 0)) current.x += dx;
    }
    function softDrop() {
      if (phase !== 'playing' || !current) return;
      if (!collides(current, 0, 1)) { current.y += 1; score += 1; scoreVal.textContent = score; }
      else lockPiece();
    }
    function hardDrop() {
      if (phase !== 'playing' || !current) return;
      let d = 0;
      while (!collides(current, 0, d + 1)) d++;
      current.y += d;
      score += d * 2;
      scoreVal.textContent = score;
      lockPiece();
    }
    function rotate() {
      if (phase !== 'playing' || !current) return;
      const nextRot = (current.rot + 1) % 4;
      if (!collides(current, 0, 0, nextRot)) { current.rot = nextRot; return; }
      if (!collides({ ...current, x: current.x - 1 }, 0, 0, nextRot)) { current.x -= 1; current.rot = nextRot; return; }
      if (!collides({ ...current, x: current.x + 1 }, 0, 0, nextRot)) { current.x += 1; current.rot = nextRot; return; }
    }

    function drawCell(context, px, py, size, filled, erased) {
      if (erased) return;
      if (!filled) return;
      const pad = Math.round(size * 0.08);
      context.fillStyle = '#333f2f';
      context.strokeStyle = '#3a4536';
      context.lineWidth = Math.max(1, size * 0.06);
      context.strokeRect(px + pad, py + pad, size - pad * 2, size - pad * 2);
      const innerPad = size * 0.32;
      context.fillRect(px + innerPad, py + innerPad, size - innerPad * 2, size - innerPad * 2);
    }

    function render() {
      ctx.fillStyle = '#c9d1bd';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(51,63,47,0.12)';
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          ctx.fillRect(x * CELL + CELL / 2 - 1, y * CELL + CELL / 2 - 1, 2, 2);
        }
      }

      let erasedMask = null;
      if (phase === 'clearing' && clearing) {
        const progress = Math.min(1, (performance.now() - clearing.startTime) / CLEAR_DURATION);
        const center = (COLS - 1) / 2;
        const order = [...Array(COLS).keys()].sort((a, b) => Math.abs(a - center) - Math.abs(b - center));
        const countErased = Math.floor(progress * (COLS + 1));
        erasedMask = new Set(order.slice(0, countErased));
        if (progress >= 1) { finalizeClear(); }
      }

      for (let y = 0; y < ROWS; y++) {
        const isClearingRow = clearing && clearing.rows.includes(y);
        for (let x = 0; x < COLS; x++) {
          const filled = board[y][x];
          const erased = isClearingRow && erasedMask && erasedMask.has(x);
          drawCell(ctx, x * CELL, y * CELL, CELL, filled, erased);
        }
      }

      if (current && phase === 'playing') {
        for (const [x, y] of cellsOf(current)) {
          if (y >= 0) drawCell(ctx, x * CELL, y * CELL, CELL, true, false);
        }
      }
    }

    function drawNext() {
      nextCtx.fillStyle = '#c9d1bd';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextType) return;
      const cells = SHAPES[nextType][0];
      const size = 16;
      const offsetX = (nextCanvas.width - 4 * size) / 2;
      const offsetY = (nextCanvas.height - 4 * size) / 2;
      for (const [cx, cy] of cells) {
        drawCell(nextCtx, offsetX + cx * size, offsetY + cy * size, size, true, false);
      }
    }

    function showOverlay(text, btnText, showSpeed) {
      overlayText.textContent = text;
      overlayBtn.textContent = btnText;
      speedSetting.style.display = showSpeed ? 'flex' : 'none';
      overlay.style.display = 'flex';
      setHardDropMode(showSpeed ? 'start' : 'drop');
    }
    function hideOverlay() { overlay.style.display = 'none'; setHardDropMode('drop'); }

    function resetGame() {
      board = emptyBoard();
      score = 0; lines = 0; level = 1;
      scoreVal.textContent = 0; linesVal.textContent = 0; levelVal.textContent = 1;
      nextType = null;
      phase = 'playing';
      clearing = null;
      hideOverlay();
      spawnPiece();
    }

    function loop(t) {
      if (!lastTime) lastTime = t;
      const dt = t - lastTime;
      lastTime = t;

      if (phase === 'playing') {
        dropTimer += dt;
        if (dropTimer > dropInterval()) {
          dropTimer = 0;
          softDrop();
        }
      }
      render();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (e) => {
      if (phase === 'gameover') return;
      if (e.code === 'ArrowLeft') { move(-1); e.preventDefault(); }
      else if (e.code === 'ArrowRight') { move(1); e.preventDefault(); }
      else if (e.code === 'ArrowDown') { softDrop(); e.preventDefault(); }
      else if (e.code === 'ArrowUp') { rotate(); e.preventDefault(); }
      else if (e.code === 'Space') { hardDrop(); e.preventDefault(); }
      else if (e.code === 'KeyP') { togglePause(); }
    });

    function togglePause() {
      if (phase === 'playing') { phase = 'paused'; showOverlay('ПАУЗА', 'Продовжити', false); }
      else if (phase === 'paused') { phase = 'playing'; hideOverlay(); }
    }

    document.getElementById('pauseBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); togglePause(); });
    document.getElementById('pauseBtn').addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    overlayBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (phase === 'paused') { phase = 'playing'; hideOverlay(); }
      else {
        speedMultiplier = parseFloat(speedSelect.value) || 1;
        resetGame();
      }
    });
    overlayBtn.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

    function bindHold(btn, fn) {
      let interval = null;
      const start = (e) => { e.preventDefault(); fn(); interval = setInterval(fn, 130); };
      const stop = (e) => { if (e) e.preventDefault(); clearInterval(interval); };
      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', stop);
      btn.addEventListener('pointerleave', stop);
      btn.addEventListener('pointercancel', stop);
      btn.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
    }
    bindHold(document.getElementById('btnLeft'), () => move(-1));
    bindHold(document.getElementById('btnRight'), () => move(1));
    bindHold(document.getElementById('btnDown'), () => softDrop());
    document.getElementById('btnRotate').addEventListener('pointerdown', (e) => { e.preventDefault(); rotate(); });
    document.getElementById('btnRotate').addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    document.getElementById('btnHardDrop').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (hardDropMode === 'start') {
        speedMultiplier = parseFloat(speedSelect.value) || 1;
        resetGame();
      } else {
        hardDrop();
      }
    });
    document.getElementById('btnHardDrop').addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

    document.addEventListener('selectstart', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('resize', () => {
      computeCellSize();
      canvas.width = COLS * CELL;
      canvas.height = ROWS * CELL;
    });

    board = emptyBoard();
    phase = 'idle';
    render();
    showOverlay('ТЕТРІС', 'Почати', true);
    requestAnimationFrame(loop);
  })();
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<link rel="stylesheet" href="js/game-header.css">
<script src="js/game-header.js"></script>
<script src="js/login.js"></script>
<script src="js/score-connect.js"></script>
<script src="js/records.js"></script>
<script src="js/back-button.js"></script>
</body>
</html>
